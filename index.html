/* ---- B1 lessons 5-20 ---- */
addLessons("B1",[
["b1L05","Present perfect or past simple?",
 "Use the past simple with a finished time (yesterday, in 2020, last week). Use the present perfect when the time is not finished or not important (today, this year, ever, already).",
 "Passé simple = moment terminé (yesterday). Present perfect = moment non terminé ou non précisé.",
 ["I saw her yesterday.","I've seen her twice this week.","Did you go to Spain last year? / Have you ever been to Spain?"],
 [["I ___ my keys. I can't find them anywhere.",["lost","have lost","was losing","had lost"],1,"Result now, no finished time: have lost."],
  ["We ___ to Tunisia in 2019.",["have gone","went","have been","go"],1,"Finished time (2019): went."],
  ["She ___ three emails so far today.",["wrote","has written","writes","had written"],1,"Today isn't finished: has written."],
  ["When ___ you start learning English?",["have","did","has","were"],1,"Question about a finished time (when): did."],
  ["I ___ never ___ a horse.",["did / ride","have / ridden","was / riding","had / rode"],1,"Life experience: have never ridden."]],
 [["so far","until now","jusqu'à présent"],["anywhere","in any place","nulle part / n'importe où"],["twice","two times","deux fois"],["ride","sit on and control (a horse, a bike)","monter, faire du vélo"]]],
["b1L06","Present perfect continuous",
 "Use have / has been + -ing for an action that started in the past and is still continuing, or has just stopped with a visible result: I've been waiting for an hour. You're wet — have you been running?",
 "have/has been + -ing : action qui dure depuis le passé jusqu'à maintenant.",
 ["I've been studying English for three years.","She's been working here since March.","Why are you tired? I've been cleaning all day."],
 [["I ___ for you for forty minutes!",["wait","have been waiting","am waiting","waited"],1,"Started in the past and still continuing: have been waiting."],
  ["How long ___ you been living in Oran?",["are","did","have","were"],2,"How long have you been + -ing?"],
  ["Her eyes are red. She ___.",["has been crying","cried","cries","is cried"],0,"Visible result of a recent activity."],
  ["They've been ___ the house all morning.",["paint","painted","painting","paints"],2,"been + -ing."],
  ["Which verb is NOT normally used in the continuous form?",["work","know","study","run"],1,"State verbs like know: I've known her for years."]],
 [["wet","covered in water","mouillé"],["state verb","a verb for feelings or states (know, like)","verbe d'état"],["paint","put colour on a wall","peindre"],["since","from a point in time","depuis"]]],
["b1L07","Past perfect",
 "Use had + past participle for an action that happened before another past action: When I arrived at the station, the train had already left.",
 "had + participe passé : action antérieure à une autre action passée (plus-que-parfait).",
 ["She had finished dinner when I called.","I didn't recognise him because he had changed a lot.","Had you ever flown before that trip?"],
 [["When we got to the cinema, the film ___.",["started","had started","has started","starts"],1,"Earlier action: had started."],
  ["I was hungry because I ___ breakfast.",["didn't have","hadn't had","haven't had","don't have"],1,"Before being hungry: hadn't had."],
  ["She ___ to Paris before, so she knew the city well.",["had been","has been","was","went"],0,"Earlier experience: had been."],
  ["By the time the police arrived, the thief ___.",["escaped","has escaped","had escaped","escapes"],2,"Before the police arrived: had escaped."],
  ["Which action happened first? 'When I got home, my sister had cooked dinner.'",["I got home","My sister cooked dinner","Both at the same time","We don't know"],1,"Past perfect shows the earlier action."]],
 [["recognise","know who someone is when you see them","reconnaître"],["thief","a person who steals","voleur"],["escape","get away","s'échapper"],["by the time","when, not later than","au moment où"]]],
["b1L08","Must, mustn't and have to",
 "Must = strong obligation, often from the speaker (I must call my mother). Have to = obligation from rules (We have to wear a badge). Mustn't = it is forbidden. Don't have to = not necessary.",
 "must = obligation personnelle ; have to = règle extérieure ; mustn't = interdit ; don't have to = pas nécessaire.",
 ["You must be on time for the interview.","You mustn't smoke in the hospital.","You don't have to bring food; lunch is provided."],
 [["You ___ use your phone during the exam. It's forbidden.",["don't have to","mustn't","needn't","must"],1,"Forbidden: mustn't."],
  ["It's Saturday. I ___ get up early.",["mustn't","don't have to","must","have to"],1,"Not necessary: don't have to."],
  ["Drivers ___ stop at red lights.",["have to","don't have to","mustn't","needn't"],0,"A rule: have to (or must)."],
  ["I ___ remember to buy bread. (my own idea)",["must","mustn't","don't have to","has to"],0,"Personal obligation: must."],
  ["Past of must (obligation) is…",["musted","had to","must have","mustn't"],1,"Past: had to."]],
 [["obligation","something you must do","obligation"],["forbidden","not allowed","interdit"],["provided","given to you","fourni"],["badge","a card with your name","badge"]]],
["b1L09","Deduction: must, might, can't",
 "Use must when you are almost sure something is true (He must be tired, he worked all night). Use might / could when it's possible. Use can't when you are almost sure it isn't true (She can't be at home, her car isn't here).",
 "must = sûrement ; might/could = peut-être ; can't = impossible.",
 ["You must be hungry after that long trip.","He might be in the library.","That can't be Sara, she's in Canada."],
 [["The lights are off. They ___ be out.",["must","can't","mustn't","don't"],0,"Almost sure: must."],
  ["She ___ be a doctor. She's only fifteen!",["must","might","can't","should"],2,"Almost sure it's false: can't."],
  ["I'm not sure where Adel is. He ___ be at the gym.",["must","can't","might","has to"],2,"Possible: might."],
  ["You've been travelling for twelve hours. You ___ be exhausted.",["can't","must","mustn't","needn't"],1,"Logical deduction: must."],
  ["'He could be ill' means…",["He is certainly ill","It's possible he is ill","He can't be ill","He was ill"],1,"Could = possible."]],
 [["deduction","a conclusion from evidence","déduction"],["exhausted","very tired","épuisé"],["certainly","surely","certainement"],["evidence","facts that show something","preuve"]]],
["b1L10","Defining relative clauses",
 "Use who (or that) for people, which (or that) for things, where for places and whose for possession: The woman who called you is my aunt. This is the book that I told you about.",
 "who/that = personnes, which/that = choses, where = lieu, whose = possession.",
 ["A dentist is a person who looks after your teeth.","The phone which I bought was cheap.","That's the café where we met."],
 [["The man ___ lives next door is a pilot.",["which","who","where","whose"],1,"A person: who."],
  ["Is this the bus ___ goes to the airport?",["who","where","that","whose"],2,"A thing: that (or which)."],
  ["This is the hospital ___ I was born.",["which","where","who","that"],1,"A place: where."],
  ["I have a friend ___ father is a famous singer.",["who","whose","which","where"],1,"Possession: whose."],
  ["Which sentence is correct?",["The film who we saw was long.","The film that we saw was long.","The film where we saw was long.","The film whose we saw was long."],1,"A thing: that/which."]],
 [["pilot","a person who flies planes","pilote"],["dentist","a doctor for teeth","dentiste"],["look after","take care of","s'occuper de"],["born","when you start life","né"]]],
["b1L11","Future arrangements: present continuous",
 "Use the present continuous for fixed plans with a time and place (I'm meeting Sara at six). Use going to for intentions, and will for decisions made now and predictions.",
 "Présent continu = rendez-vous fixé ; going to = intention ; will = décision immédiate.",
 ["I'm flying to Istanbul on Friday.","We're having a party on Saturday.","I'm going to learn Spanish one day."],
 [["I've booked the ticket. I ___ to Algiers tomorrow.",["travel","am travelling","will travel","travelled"],1,"Fixed arrangement: present continuous."],
  ["Look at my diary: I ___ the doctor at 3 p.m.",["see","am seeing","will see","saw"],1,"Appointment: am seeing."],
  ["'The phone is ringing.' 'I ___ answer it.'",["am answering","'m going to","'ll","answer"],2,"Decision now: I'll."],
  ["What ___ you doing this weekend?",["do","are","will","did"],1,"Asking about plans: What are you doing…?"],
  ["Which sentence shows an intention without a fixed plan?",["I'm meeting Ali at 8.","I'm going to read more books.","The train leaves at 9.","I'll help you!"],1,"Intention: going to."]],
 [["arrangement","a plan with other people","rendez-vous, arrangement"],["diary","a book for your plans","agenda"],["intention","what you plan to do","intention"],["appointment","a meeting at a fixed time","rendez-vous"]]],
["b1L12","Zero conditional",
 "Use the zero conditional for facts and things that are always true: If + present simple, present simple. If you heat water to 100°C, it boils.",
 "Conditionnel zéro : vérités générales. If + présent, présent.",
 ["If you mix blue and yellow, you get green.","If I drink coffee at night, I can't sleep.","Plants die if they don't get water."],
 [["If you heat ice, it ___.",["melted","melts","will melt","would melt"],1,"General truth: present simple."],
  ["If it ___, the roads get dangerous.",["snows","snowed","will snow","snowing"],0,"If + present simple."],
  ["Which sentence is a zero conditional?",["If I win, I'll buy a car.","If water reaches 0°C, it freezes.","If I were rich, I'd travel.","If I had known, I'd have come."],1,"A scientific fact."],
  ["If you ___ the button, the door opens.",["push","pushed","will push","would push"],0,"Present simple."],
  ["My cat gets angry if I ___ her tail.",["touched","touch","will touch","touching"],1,"Present simple in both parts."]],
 [["heat","make hot","chauffer"],["boil","bubble at 100°C","bouillir"],["freeze","become ice","geler"],["melt","become liquid","fondre"]]],
["b1L13","Indirect questions",
 "Indirect questions are more polite. After Could you tell me…? / Do you know…? use normal word order (subject + verb), not question order: Where is the station? → Could you tell me where the station is?",
 "Questions indirectes : ordre sujet + verbe. Do you know where the bank is?",
 ["Do you know what time it is?","Could you tell me where the toilets are?","I wonder if she will come."],
 [["Could you tell me where ___?",["is the bank","the bank is","does the bank","the bank does"],1,"Normal order: the bank is."],
  ["Do you know what time ___?",["does the film start","the film starts","starts the film","is the film start"],1,"No do/does: the film starts."],
  ["Can you tell me ___ the museum is open on Monday?",["if","that","what","do"],0,"Yes/no question: if (or whether)."],
  ["I'd like to know how much ___.",["does it cost","it costs","costs it","is it cost"],1,"Normal order: it costs."],
  ["Which is the most polite?",["Where's the toilet?","Tell me the toilet.","Could you tell me where the toilet is?","Toilet where?"],2,"Indirect question."]],
 [["polite","respectful","poli"],["wonder","ask yourself","se demander"],["toilets","the room with a WC","toilettes"],["museum","a building with art or history","musée"]]],
["b1L14","Both, either, neither",
 "Both = the two (Both my parents work). Either = one or the other (You can take either bus). Neither = not one and not the other (Neither answer is correct). Both … and, either … or, neither … nor.",
 "both = les deux ; either … or = soit … soit ; neither … nor = ni … ni.",
 ["Both of my brothers live in Algiers.","You can pay either by card or in cash.","Neither Samia nor her sister came."],
 [["___ of my parents are teachers.",["Either","Neither","Both","None"],2,"The two: both."],
  ["We can go ___ today or tomorrow.",["both","either","neither","nor"],1,"Choice: either … or."],
  ["___ my brother nor my sister likes fish.",["Neither","Either","Both","Not"],0,"Negative: neither … nor."],
  ["'Do you want tea or coffee?' '___. I'm fine, thanks.'",["Both","Either","Neither","All"],2,"Not one, not the other: neither."],
  ["I like ___ football and basketball.",["either","neither","both","nor"],2,"both … and."]],
 [["cash","money in notes and coins","espèces"],["card","a bank card","carte bancaire"],["choice","an option","choix"],["fine","OK","bien"]]],
["b1L15","Common phrasal verbs",
 "Phrasal verbs are verbs + a small word (up, off, after…) with a new meaning: give up (stop trying), look after (take care of), find out (discover), turn down (refuse), set up (start a business), run out of (have no more).",
 "Verbes à particule : give up = abandonner, look after = s'occuper de, find out = découvrir, run out of = manquer de.",
 ["I gave up sugar last year.","Can you look after my cat this weekend?","We ran out of milk, so I went to the shop."],
 [["Don't ___ ! You can pass the exam.",["give up","look after","set up","find out"],0,"Stop trying: give up."],
  ["She ___ her own company in 2021.",["turned down","set up","ran out","looked after"],1,"Start a business: set up."],
  ["I need to ___ what time the train leaves.",["find out","give up","run out","turn up"],0,"Discover: find out."],
  ["We've ___ petrol. We need to stop.",["run out of","given up","looked after","set up"],0,"Have no more: run out of."],
  ["He ___ the job offer because the salary was too low.",["turned down","set up","found out","looked after"],0,"Refuse: turn down."]],
 [["give up","stop trying","abandonner"],["look after","take care of","s'occuper de"],["find out","discover information","découvrir"],["run out of","have no more","manquer de"]]],
["b1L16","Question tags",
 "Question tags check information: It's cold, isn't it? You don't smoke, do you? Positive sentence → negative tag; negative sentence → positive tag. Use the same auxiliary (be, do, have, can…).",
 "Question tag = n'est-ce pas ? Phrase positive → tag négatif, et inversement.",
 ["You're from Oran, aren't you?","She can drive, can't she?","They didn't come, did they?"],
 [["It's a beautiful day, ___?",["is it","isn't it","doesn't it","wasn't it"],1,"Positive → negative tag: isn't it."],
  ["You live in Setif, ___?",["don't you","do you","aren't you","isn't it"],0,"Present simple: don't you."],
  ["He hasn't finished yet, ___?",["has he","hasn't he","did he","is he"],0,"Negative → positive: has he."],
  ["They went to the wedding, ___?",["didn't they","don't they","weren't they","did they"],0,"Past simple: didn't they."],
  ["I'm late, ___?",["amn't I","aren't I","isn't I","don't I"],1,"Special form: aren't I?"]],
 [["check","make sure","vérifier"],["auxiliary","a helping verb (do, be, have)","auxiliaire"],["wedding","a marriage celebration","mariage"],["yet","until now","encore, déjà"]]],
["b1L17","So and such",
 "So + adjective/adverb (so tired, so quickly). Such + (a/an) + adjective + noun (such a good film, such nice people). Both can be followed by that + result: It was so hot that we stayed inside.",
 "so + adjectif ; such (a) + adjectif + nom = si / tellement.",
 ["The film was so boring that I fell asleep.","She's such a kind person.","They are such good friends."],
 [["It was ___ a long day!",["so","such","very","too"],1,"such a + adjective + noun."],
  ["The soup is ___ hot that I can't eat it.",["such","so","such a","very much"],1,"so + adjective."],
  ["They are ___ friendly people.",["so","such","such a","so a"],1,"such + adjective + plural noun."],
  ["He spoke ___ quickly that nobody understood.",["such","so","such a","too much"],1,"so + adverb."],
  ["What ___ beautiful weather!",["a","such a","—","so"],2,"Weather is uncountable: What beautiful weather!"]],
 [["boring","not interesting","ennuyeux"],["fell asleep","started sleeping","s'est endormi"],["friendly","nice to others","amical"],["result","what happens after","résultat"]]],
["b1L18","Make or do?",
 "Use do for work, tasks and general activities (do homework, do the shopping, do exercise, do your best). Use make for creating or producing (make a cake, make a mistake, make a decision, make money, make a phone call).",
 "do = faire (tâches, travail) ; make = fabriquer, produire (make a mistake, a decision).",
 ["I always make mistakes with prepositions.","Can you do the washing-up?","We need to make a decision today."],
 [["Have you ___ your homework?",["made","done","did","make"],1,"Homework → do."],
  ["Sorry, I ___ a mistake.",["did","made","done","make"],1,"Mistake → make."],
  ["She ___ yoga every morning.",["makes","does","do","made"],1,"Exercise/activity → do."],
  ["Let's ___ a plan for the trip.",["do","make","doing","did"],1,"Plan → make."],
  ["He wants to ___ a lot of money.",["do","make","does","done"],1,"Money → make."]],
 [["mistake","something wrong","erreur"],["decision","a choice","décision"],["washing-up","washing the dishes","vaisselle"],["task","a piece of work","tâche"]]],
["b1L19","Comparatives: much, far, a bit; the more … the more",
 "Make comparatives stronger with much / far / a lot (much cheaper) or weaker with a bit / slightly (a bit taller). Use the + comparative, the + comparative for two things that change together: The more you practise, the better you get.",
 "much / far + comparatif = beaucoup plus ; a bit = un peu plus ; the more…, the more… = plus…, plus…",
 ["The train is much faster than the bus.","My new flat is a bit bigger.","The earlier we leave, the sooner we'll arrive."],
 [["This hotel is ___ more expensive than the other one.",["very","much","so","too"],1,"Strong comparative: much."],
  ["The more you read, ___ your vocabulary becomes.",["the richer","richer","the richest","more rich"],0,"the + comparative."],
  ["Today is ___ colder than yesterday — only one degree.",["much","far","a bit","a lot"],2,"Small difference: a bit."],
  ["___ I sleep, the more tired I feel.",["More","The more","Most","The most"],1,"The more…, the more…"],
  ["Walking is ___ healthier than driving.",["far","very","such","too"],0,"far + comparative."]],
 [["vocabulary","the words you know","vocabulaire"],["slightly","a little","légèrement"],["degree","unit of temperature","degré"],["healthier","better for health","plus sain"]]],
["b1L20","Purpose: to, in order to, so that",
 "To say why we do something, use to + verb (I went to the bank to get money), in order to + verb (more formal), or so that + subject + can/could/will (I left early so that I could catch the train).",
 "But : to / in order to + verbe ; so that + sujet + can/could.",

addReads("B1",[
["b1r01","The rise of remote learning","Ten years ago, most students in Algeria had never taken an online course. Today, many universities offer part of their classes online, and thousands of learners use apps and video platforms to study languages, programming or business.\nOnline learning has clear advantages. Students can study at their own pace, repeat difficult lessons and save time on transport. People who work full-time can also continue their education.\nHowever, it also has disadvantages. Some students find it hard to stay motivated without a teacher in the room. Others have a weak internet connection. Experts suggest a mix of online and face-to-face learning, which they call 'blended learning'.",
 [["What has changed in ten years?",["Students stopped studying","Online learning became common","Universities closed","Internet became slower"],1,"Many universities offer part of their classes online."],["Which is an advantage mentioned?",["Free laptops","Studying at your own pace","Shorter courses","No exams"],1,"Students can study at their own pace."],["What is one problem?",["Too many teachers","Staying motivated","Expensive books","Long holidays"],1,"Some find it hard to stay motivated."],["What is 'blended learning'?",["Only online learning","A mix of online and face-to-face","Learning with music","Learning in groups"],1,"A mix of online and face-to-face learning."]],
 [["at your own pace","as fast or slow as you want"],["motivated","wanting to do something"],["face-to-face","in the same room"]]],
["b1r02","Why we procrastinate","Procrastination means delaying tasks that we know we should do. Almost everyone does it: we tidy our desk instead of writing an essay, or check our phone instead of starting a report.\nPsychologists say procrastination is not about laziness. It is usually about emotions. When a task feels boring, difficult or stressful, our brain looks for something more pleasant.\nOne useful technique is the 'five-minute rule'. You promise yourself to work on the task for just five minutes. Usually, once you start, it's easier to continue. Breaking a big task into small steps also helps.",
 [["What is procrastination?",["Working too fast","Delaying tasks","Sleeping a lot","Forgetting things"],1,"Delaying tasks we know we should do."],["According to psychologists, what causes it?",["Laziness","Emotions","Bad food","Weather"],1,"It is usually about emotions."],["What is the 'five-minute rule'?",["Take a five-minute break every hour","Work on a task for just five minutes to start","Finish tasks in five minutes","Wake up five minutes earlier"],1,"Promise to work on the task for just five minutes."],["What else helps?",["Doing everything at once","Breaking tasks into small steps","Waiting for motivation","Working at night"],1,"Breaking a big task into small steps."]],
 [["delay","do something later"],["laziness","not wanting to work"],["pleasant","nice, enjoyable"]]],
["b1r03","The date palm","For centuries, the date palm has been essential to life in the Sahara. Its fruit is rich in sugar and energy, and it can be stored for months without a fridge.\nAlgeria is one of the world's biggest producers of dates. The most famous variety, Deglet Nour, which means 'date of light', is grown mainly around Biskra and Touggourt. Its golden, almost transparent colour makes it popular around the world.\nThe palm tree is also used for many other things: its leaves for baskets and roofs, and its trunk for building. In oases, palms create shade, which allows other fruit and vegetables to grow underneath.",
 [["Why were dates important in the Sahara?",["They are cold","They give energy and can be stored","They are cheap to import","They grow quickly"],1,"Rich in energy and stored for months."],["What does Deglet Nour mean?",["Sweet fruit","Date of light","Golden tree","Desert gift"],1,"'Date of light'."],["What are palm leaves used for?",["Medicine","Baskets and roofs","Fuel only","Paper"],1,"Leaves for baskets and roofs."],["How do palms help other plants in oases?",["They give shade","They give water","They kill insects","They make soil"],0,"Palms create shade."]],
 [["essential","absolutely necessary"],["variety","a type"],["oasis","a green place with water in the desert"]]],
["b1r04","Fast fashion","Fast fashion means cheap clothes that are produced quickly to follow the latest trends. Big brands now release new collections almost every week.\nThe problem is that fast fashion has a high environmental cost. Producing one pair of jeans can use thousands of litres of water. Many cheap clothes are worn only a few times before they are thrown away.\nSome consumers are changing their habits. They buy fewer, better-quality clothes, repair what they have, or buy second-hand. Some cities in Algeria now have popular second-hand markets, known locally as 'friperies', where young people find unique pieces at low prices.",
 [["What is fast fashion?",["Expensive designer clothes","Cheap clothes made quickly to follow trends","Sports clothes","Traditional clothes"],1,"Cheap clothes produced quickly to follow trends."],["What is one environmental problem?",["It uses a lot of water","It creates jobs","It's too slow","It uses no energy"],0,"One pair of jeans can use thousands of litres of water."],["How are some consumers changing?",["Buying more","Buying second-hand and repairing","Never buying clothes","Only buying online"],1,"Buy fewer, repair, or buy second-hand."],["What are 'friperies'?",["New shopping malls","Second-hand clothes markets","Factories","Fashion schools"],1,"Second-hand markets known locally as 'friperies'."]],
 [["trend","what is popular now"],["consumer","a person who buys things"],["second-hand","used before by someone else"]]],
["b1r05","A letter of application","Dear Ms Benali,\nI am writing to apply for the position of junior accountant advertised on your website.\nI graduated last June with a degree in Finance from the University of Boumerdès. During my studies, I completed a three-month internship at a construction company, where I helped prepare monthly reports and checked invoices.\nI am organised, accurate and comfortable working with Excel. I speak Arabic, French and English. I believe I would be a useful member of your team, and I would welcome the opportunity to discuss my application in an interview.\nYours sincerely,\nRyad Mansouri",
 [["Which job is Ryad applying for?",["Senior manager","Junior accountant","Sales assistant","Teacher"],1,"Junior accountant."],["Where did he do his internship?",["At a bank","At a construction company","At a university","At a hospital"],1,"At a construction company."],["What did he do in his internship?",["Sold products","Prepared reports and checked invoices","Taught students","Designed websites"],1,"Helped prepare monthly reports and checked invoices."],["What does he ask for at the end?",["A higher salary","An interview","A reference","A job for his brother"],1,"The opportunity to discuss my application in an interview."]],
 [["apply","formally ask for a job"],["internship","work experience for students"],["invoice","a document asking for payment"]]],
["b1r06","Learning a language as an adult","Many adults believe that it's too late to learn a new language. It's true that children often learn pronunciation more easily, but research shows that adults have important advantages too.\nAdults usually understand grammar faster because they can think about rules logically. They also have more experience of the world, so they can connect new words to things they already know. Most importantly, adults often have a clear reason to learn, such as a job or travel, which keeps them motivated.\nThe key, experts say, is regular practice. Twenty minutes every day is more effective than three hours once a week.",
 [["What do children often learn more easily?",["Grammar","Pronunciation","Vocabulary","Writing"],1,"Children often learn pronunciation more easily."],["Why do adults understand grammar faster?",["They are older","They think about rules logically","They study more","They have better teachers"],1,"They can think about rules logically."],["What keeps adults motivated?",["Money","A clear reason to learn","Exams","Homework"],1,"A clear reason, such as a job or travel."],["What do experts recommend?",["Three hours once a week","Twenty minutes every day","Only during holidays","Studying at night"],1,"Twenty minutes every day."]],
 [["research","careful study to find facts"],["logically","with clear reasoning"],["effective","working well"]]],
["b1r07","The Kabyle wedding","In Kabylie, traditional weddings often last several days and bring together the whole village. Before the wedding, women prepare large amounts of couscous and sweets, while men organise the music and the place.\nOn the main day, the bride usually wears a colourful Kabyle dress decorated with silver jewellery. Musicians play the tbel, a large drum, and the ghaita, a kind of flute. Guests dance and sing traditional songs late into the night.\nToday, many young couples combine traditions with modern elements, like a celebration in a reception hall, but the main customs remain an important part of local identity.",
 [["How long can a traditional wedding last?",["One hour","Several days","One month","One evening only"],1,"Several days."],["What does the bride wear?",["A white Western dress","A colourful Kabyle dress with silver jewellery","A black dress","Jeans"],1,"A colourful Kabyle dress decorated with silver jewellery."],["What is the tbel?",["A flute","A large drum","A dress","A dish"],1,"A large drum."],["What do many young couples do today?",["Refuse all traditions","Combine traditions with modern elements","Marry abroad","Have no music"],1,"Combine traditions with modern elements."]],
 [["bride","a woman on her wedding day"],["jewellery","rings, necklaces…"],["custom","a traditional way of doing something"]]],
["b1r08","Working from a café","A growing number of freelancers work from cafés instead of offices. They say the background noise helps them concentrate, and they enjoy being around other people.\nCafé owners have mixed feelings. Some welcome freelancers because they bring regular business. Others complain that some customers buy one coffee and stay for six hours, taking tables that other customers could use.\nAs a result, some cafés have introduced new rules: Wi-Fi limited to two hours, or special 'laptop zones'. Others have created co-working spaces where people pay a small fee for a desk, coffee and fast internet.",
 [["Why do freelancers like cafés?",["Coffee is free","Background noise helps them concentrate","They have no home","Cafés are open all night"],1,"Background noise helps them concentrate."],["What is some owners' complaint?",["Freelancers are noisy","Customers stay for hours buying one coffee","Freelancers don't pay","They break laptops"],1,"Buy one coffee and stay for six hours."],["Which new rule is mentioned?",["No phones","Wi-Fi limited to two hours","Only cash","No talking"],1,"Wi-Fi limited to two hours."],["What is a co-working space?",["A free library","A place where you pay for a desk and internet","A school","A home office"],1,"People pay a small fee for a desk, coffee and fast internet."]],
 [["freelancer","a person who works for different clients"],["mixed feelings","both positive and negative feelings"],["fee","money you pay for a service"]]],
["b1r09","Water: a precious resource","Algeria is one of the countries most affected by water scarcity. Rainfall is low in much of the country, and droughts have become more frequent.\nTo respond, the government has built dams and desalination plants, which turn sea water into drinking water. Algeria now has some of the largest desalination plants in Africa.\nBut experts say that saving water at home is also important. Fixing leaking taps, taking shorter showers and watering gardens in the evening can save thousands of litres a year. Farmers are encouraged to use drip irrigation, which brings water directly to the roots of plants.",
 [["What is the main problem?",["Too much rain","Water scarcity","Floods","Pollution only"],1,"Water scarcity."],["What do desalination plants do?",["Clean rivers","Turn sea water into drinking water","Produce electricity","Collect rain"],1,"Turn sea water into drinking water."],["Which is NOT a tip for saving water at home?",["Fix leaking taps","Take shorter showers","Water gardens at noon","Water gardens in the evening"],2,"The text says water gardens in the evening, not at noon."],["What is drip irrigation?",["Watering by plane","Bringing water directly to plant roots","Rain collection","Watering at night"],1,"Brings water directly to the roots."]],
 [["scarcity","not having enough"],["drought","a long time without rain"],["leaking","letting water escape"]]],
["b1r10","The power of habit","Around 40% of what we do each day is not a decision but a habit, according to researchers at Duke University. Habits save our brain energy: we don't have to think about brushing our teeth or the way to work.\nEvery habit has three parts: a cue (the trigger), a routine (the action), and a reward (the good feeling). For example, feeling stressed (cue) leads to eating something sweet (routine), which makes us feel better (reward).\nTo change a bad habit, experts recommend keeping the same cue and reward but changing the routine. When you feel stressed, you could go for a short walk instead of eating sweets.",
 [["About how much of our daily behaviour is habit?",["10%","25%","40%","90%"],2,"Around 40%."],["Why are habits useful?",["They save brain energy","They make us rich","They are always healthy","They are new"],0,"Habits save our brain energy."],["What are the three parts of a habit?",["Start, middle, end","Cue, routine, reward","Morning, afternoon, evening","Idea, plan, action"],1,"A cue, a routine and a reward."],["How can you change a bad habit?",["Change the routine","Remove the reward","Ignore it","Do it more"],0,"Keep the cue and reward but change the routine."]],
 [["cue","a signal that starts an action"],["reward","something good you get"],["routine","something you do regularly"]]],
["b1r11","Street food in Algiers","If you walk through Algiers in the evening, you'll smell grilled meat, fresh bread and spices. Street food is an important part of the city's life.\nOne of the most popular snacks is karantika, a baked dish made from chickpea flour, eggs and spices, served in bread with harissa and cumin. It's cheap, filling and loved by students. Another favourite is mahjouba, a thin folded pancake filled with tomato and onion sauce.\nVisitors are often surprised that these dishes cost so little. Food lovers say the best places are the small shops with long queues, because locals always know where the food is good.",
 [["What is karantika made from?",["Rice and meat","Chickpea flour, eggs and spices","Potatoes","Fish"],1,"Chickpea flour, eggs and spices."],["Why do students love karantika?",["It's cheap and filling","It's sweet","It's healthy","It's from France"],0,"Cheap, filling and loved by students."],["What is inside mahjouba?",["Cheese","Tomato and onion sauce","Chocolate","Chicken"],1,"Filled with tomato and onion sauce."],["According to food lovers, where are the best places?",["Expensive restaurants","Small shops with long queues","Hotels","Supermarkets"],1,"Small shops with long queues."]],
 [["snack","a small quick meal"],["filling","makes your stomach full"],["queue","a line of people waiting"]]],
["b1r12","Should homework be banned?","Some countries have reduced or even banned homework for young children. Supporters say children need time to play, rest and be with their families. They argue that too much homework causes stress and doesn't improve results for primary pupils.\nOthers disagree. They say homework teaches responsibility and helps children review what they learned in class. Parents also see what their children are studying.\nMany educators suggest a middle way: short, useful homework, such as reading for twenty minutes, instead of long exercises.",
 [["What do supporters of banning homework say?",["Children need more exercises","Children need time to play and rest","Teachers are lazy","Homework is too easy"],1,"Children need time to play, rest and be with their families."],["What do opponents say homework teaches?",["Responsibility","Cooking","Sport","Nothing"],0,"Homework teaches responsibility."],["What is the 'middle way'?",["No homework at all","Short, useful homework","Homework only on weekends","More homework"],1,"Short, useful homework."],["What example of useful homework is given?",["Writing essays","Reading for twenty minutes","Maths tests","Copying texts"],1,"Reading for twenty minutes."]],
 [["ban","officially stop"],["argue","give reasons for an opinion"],["review","study again"]]],
["b1r13","A start-up story","When Imène Ait was at university, she noticed that many students struggled to find affordable private tutors. In her final year, she and two friends created a simple website that connected students with tutors in their city.\nAt first, they had only fifteen tutors and no money for advertising. They used social media and asked their first customers to recommend the site. Within two years, the platform had more than three thousand tutors in ten cities.\nImène says the most important lesson was listening to users: 'Every new feature we added came from a customer's suggestion.' (This is a fictional example.)",
 [["What problem did Imène notice?",["Expensive books","Students couldn't find affordable tutors","Too many universities","No internet"],1,"Many students struggled to find affordable private tutors."],["How did they promote the site at first?",["TV adverts","Social media and recommendations","Newspapers","Billboards"],1,"They used social media and asked customers to recommend the site."],["How many tutors were there after two years?",["Fifteen","Three hundred","More than three thousand","Ten"],2,"More than three thousand tutors."],["What was the most important lesson?",["Spend more on adverts","Listen to users","Work alone","Raise prices"],1,"Listening to users."]],
 [["struggle","find something very difficult"],["affordable","not too expensive"],["feature","a part or function of a product"]]],
["b1r14","Noise pollution","When people think of pollution, they usually imagine dirty air or water. But noise is also a form of pollution, and it affects millions of people living in cities.\nConstant noise from traffic, construction and loud music can cause stress, sleep problems and even high blood pressure. Children who go to school near busy roads or airports can have more difficulty concentrating.\nSome cities are taking action. They create 'quiet zones', plant trees along roads and limit construction work at night. Individuals can also help by keeping music at a reasonable volume and avoiding unnecessary use of car horns.",
 [["What does the text say about noise?",["It is not pollution","It is a form of pollution","It only affects animals","It's good for health"],1,"Noise is also a form of pollution."],["Which health problem is mentioned?",["Broken bones","High blood pressure","Bad eyesight","Allergies"],1,"Even high blood pressure."],["Which action do cities take?",["Build more airports","Create quiet zones","Ban cars completely","Close schools"],1,"They create 'quiet zones'."],["How can individuals help?",["Use car horns more","Keep music at a reasonable volume","Move to the desert","Buy bigger speakers"],1,"Keeping music at a reasonable volume."]],
 [["constant","all the time"],["construction","building work"],["volume","how loud a sound is"]]],
["b1r15","The history of the Tassili rock art","In the Tassili n'Ajjer, in south-east Algeria, there are more than 15,000 rock paintings and engravings. Some are thought to be up to 10,000 years old.\nThe images show that the Sahara was once green. There are pictures of elephants, giraffes and hippos, animals that need a lot of water. Later paintings show cattle, which suggests that people became herders. The most recent images include horses and camels, which arrived much later.\nIn 1982, the site was listed as a UNESCO World Heritage Site. Visitors must be accompanied by authorised guides to protect the fragile paintings.",
 [["Where is the Tassili n'Ajjer?",["North-west Algeria","South-east Algeria","On the coast","In Tunisia"],1,"In south-east Algeria."],["What do the animal pictures show?",["The Sahara was once green","People hunted lions","There was snow","The sea was there"],0,"The images show that the Sahara was once green."],["What do the most recent images include?",["Elephants","Hippos","Horses and camels","Dinosaurs"],2,"Horses and camels."],["Why must visitors have guides?",["To protect the paintings","To pay less","To find water","To take photos"],0,"To protect the fragile paintings."]],
 [["engraving","a picture cut into stone"],["herder","a person who looks after animals"],["fragile","easily damaged"]]],
["b1r16","How to give a good presentation","Many people are afraid of speaking in public, but a few simple techniques can help. First, know your audience: what do they already know, and what do they need?\nSecond, keep your slides simple. Use images and a few key words, not long sentences. People can't read and listen at the same time.\nThird, practise aloud several times, ideally in front of a friend. Finally, remember that some nervousness is normal. Breathing slowly before you start and making eye contact with friendly faces in the audience can make a big difference.",
 [["What is the first tip?",["Make long slides","Know your audience","Speak fast","Read your notes"],1,"Know your audience."],["Why should slides be simple?",["People can't read and listen at the same time","Slides are expensive","It's faster to make","Teachers prefer it"],0,"People can't read and listen at the same time."],["How should you practise?",["Silently","Aloud, ideally in front of a friend","Only the night before","Never"],1,"Practise aloud several times, ideally in front of a friend."],["What does the text say about nervousness?",["It's a big problem","Some is normal","You should cancel","It shows you're not ready"],1,"Some nervousness is normal."]],
 [["audience","the people who listen"],["aloud","so others can hear"],["eye contact","looking at people's eyes"]]],
["b1r17","The Sahara solar project","The Sahara receives more sunlight than almost anywhere else on Earth. For years, engineers have dreamed of using this energy to power North Africa and even Europe.\nAlgeria has announced plans to produce a large share of its electricity from renewable sources, mainly solar, by 2035. New solar farms have been built in the south, and more are planned.\nHowever, there are challenges. Sand and dust reduce the efficiency of panels, and transporting electricity over long distances is expensive. Researchers are developing panels that clean themselves and better systems to store energy for the night.",
 [["Why is the Sahara good for solar energy?",["It's cold","It receives a lot of sunlight","It's near the sea","It has many rivers"],1,"It receives more sunlight than almost anywhere else."],["What does Algeria plan by 2035?",["Stop using electricity","Produce a large share of electricity from renewables","Export all its oil","Close solar farms"],1,"A large share of electricity from renewable sources."],["Which challenge is mentioned?",["Too much rain","Sand and dust on panels","Lack of sunlight","Too many workers"],1,"Sand and dust reduce the efficiency of panels."],["What are researchers developing?",["Self-cleaning panels and better storage","Bigger cars","New oil wells","Wind farms only"],0,"Panels that clean themselves and better storage."]],
 [["renewable","that can be used again and again"],["share","a part of the total"],["efficiency","how well something works"]]],
["b1r18","Friendship in the digital age","Social media allows us to stay in touch with hundreds of people. But are online 'friends' real friends?\nThe anthropologist Robin Dunbar suggests that humans can maintain only about 150 meaningful relationships, and only around five very close friends. Having more online connections doesn't change this limit.\nResearch also shows that face-to-face meetings are important for strong friendships. Messages and likes help keep relationships alive, but they can't replace sharing a meal or a long conversation. The best approach, many psychologists say, is to use technology to organise real meetings, not to replace them.",
 [["What is Dunbar's suggested limit for meaningful relationships?",["50","150","500","1,000"],1,"About 150 meaningful relationships."],["About how many very close friends do people have?",["Five","Fifteen","Fifty","One hundred"],0,"Only around five very close friends."],["What do messages and likes do?",["Replace real meetings","Help keep relationships alive","Destroy friendships","Nothing"],1,"Help keep relationships alive."],["What do psychologists recommend?",["Delete social media","Use technology to organise real meetings","Have more online friends","Never meet people"],1,"Use technology to organise real meetings."]],
 [["stay in touch","keep communicating"],["maintain","keep in good condition"],["meaningful","important, with real value"]]],
["b1r19","Tourism in Algeria","Algeria is Africa's largest country, but it receives fewer tourists than its neighbours. Many visitors don't know about its Roman ruins, Mediterranean beaches, mountain villages and the spectacular landscapes of the Sahara.\nIn recent years, the government has simplified visa procedures for some tourists visiting the south, and new hotels have opened. Desert tourism around Djanet and Tamanrasset is growing, especially in winter.\nLocal guides say the challenge is to develop tourism without damaging the environment or local cultures. They want visitors who respect traditions and stay in local guesthouses, so that the money helps communities.",
 [["What is said about the number of tourists?",["Algeria has the most tourists in Africa","Algeria receives fewer tourists than its neighbours","No tourists visit","Tourists only visit the coast"],1,"It receives fewer tourists than its neighbours."],["What has the government done?",["Closed hotels","Simplified some visa procedures","Banned desert trips","Raised prices"],1,"Simplified visa procedures for some tourists."],["When is desert tourism popular?",["In summer","In winter","Only in Ramadan","Never"],1,"Especially in winter."],["What do local guides want?",["Mass tourism","Visitors who respect traditions and support communities","Only rich tourists","Big international hotels"],1,"Visitors who respect traditions and stay in local guesthouses."]],
 [["spectacular","very impressive"],["procedure","an official way of doing something"],["guesthouse","a small family hotel"]]],
["b1r20","Artificial intelligence in daily life","Artificial intelligence (AI) is no longer science fiction. We use it every day, often without noticing: when a phone recognises our face, when an app suggests a song, or when a map finds the fastest route.\nAI can also help in education and health. It can translate texts, explain difficult ideas and help doctors read medical images. But it can make mistakes, and it may repeat unfair ideas from the data it learned from.\nExperts say we should use AI as a helpful tool, not as a replacement for our own thinking. It's important to check information and to understand how the technology works.",
 [["Which is an everyday example of AI?",["A pencil","A phone recognising your face","A paper book","A bicycle"],1,"When a phone recognises our face."],["How can AI help doctors?",["By replacing them","By reading medical images","By driving ambulances","By cleaning hospitals"],1,"Help doctors read medical images."],["What is one risk of AI?",["It's always slow","It can make mistakes","It never works","It's illegal"],1,"It can make mistakes."],["What do experts recommend?",["Stop using AI","Use AI as a tool and check information","Believe everything AI says","Use AI only for games"],1,"Use AI as a helpful tool and check information."]],
 [["science fiction","stories about future technology"],["route","the way from one place to another"],["unfair","not equal or just"]]]
]);

/* ---- B1 writing 1-20 ---- */
const CK_B1=["My text has paragraphs with one main idea each.","I used linking words (however, although, also, as a result).","I used a range of tenses correctly.","I checked spelling and punctuation."];
addWrites("B1",[
["b1w01","A formal email: asking for information","You want to join an English course at a language school. Write an email asking about dates, prices, levels and certificates.",120,["I am writing to enquire about…","Could you please tell me…?","I would also like to know whether…","I look forward to hearing from you."],"Dear Sir or Madam,\nI am writing to enquire about your evening English courses for adults. I am an engineer and I need to improve my English for my job.\nCould you please tell me when the next course starts and how much it costs? I would also like to know whether you offer a placement test, because I think my level is around B1.\nFinally, do students receive a certificate at the end of the course?\nI look forward to hearing from you.\nYours faithfully,\nKarim Boudjema",[...CK_B1,"I used a formal greeting and closing."]],
["b1w02","An opinion paragraph: social media","Do you think social media has more advantages or disadvantages for young people? Give your opinion with reasons and examples.",130,["In my opinion,…","One reason is that…","For example,…","On the other hand,…","To sum up,…"],"In my opinion, social media has more advantages than disadvantages for young people, if they use it carefully. One reason is that it helps them stay in touch with friends and family who live far away. For example, my cousin studies in Canada and we talk every week. Social media is also useful for learning, because there are many educational videos.\nOn the other hand, it can be addictive, and some young people spend hours scrolling instead of studying or sleeping. To sum up, social media is a powerful tool, but young people should learn to control the time they spend on it.",CK_B1],
["b1w03","A story: an unexpected meeting","Write a story that begins: 'I was waiting at the airport when I saw someone I hadn't seen for ten years.'",150,["I was waiting… when…","At first, I didn't recognise…","He / She had changed…","We decided to…","It turned out that…"],"I was waiting at the airport when I saw someone I hadn't seen for ten years. At first, I didn't recognise her. She had cut her long hair and she was wearing glasses. Then she smiled, and I knew immediately: it was Sonia, my best friend from primary school.\nWe hadn't spoken since her family moved to Annaba. My flight was delayed, so we decided to have a coffee together. We talked about our old teachers, our studies and our families. It turned out that we were both working in the same field, marketing.\nWhen my flight was called, we exchanged numbers. Now we speak every week, and next month she is coming to visit me.",[...CK_B1,"I used the past perfect for earlier events."]],
["b1w04","A review of a film or series","Write a review of a film or series you watched recently. Describe the story briefly and say what you liked and didn't like.",140,["I recently watched…","It tells the story of…","What I liked most was…","However,…","I would recommend it to…"],"I recently watched 'The Chef', a short series about a young man who returns to his family's restaurant after his father dies. The restaurant is in debt and the staff don't trust him.\nWhat I liked most was the acting. The main character is very believable, and you can feel the stress in the kitchen. The series also shows how important teamwork and family are.\nHowever, some episodes are too long, and there is a lot of shouting, which became tiring. Overall, it is an intense but moving series. I would recommend it to anyone who likes cooking or stories about families.",CK_B1],
["b1w05","A complaint letter","You stayed in a hotel and there were several problems. Write a letter of complaint to the manager and ask for a solution.",140,["I am writing to complain about…","Firstly,… Secondly,…","I was very disappointed…","I would be grateful if you could…","Yours faithfully,"],"Dear Manager,\nI am writing to complain about my stay at your hotel from 10 to 13 March.\nFirstly, the room was not cleaned during my stay, even though I asked twice at reception. Secondly, the air conditioning did not work, and it was very hot at night. Finally, breakfast was advertised as included, but I was asked to pay for it.\nI was very disappointed, because your hotel has excellent reviews online. I would be grateful if you could refund the money I paid for breakfast and offer a discount for the problems I experienced.\nI look forward to your reply.\nYours faithfully,\nAmira Tlemsani",[...CK_B1,"I listed problems clearly and asked for a solution."]],
["b1w06","Advantages and disadvantages: living abroad","Write about the advantages and disadvantages of living and working in another country.",150,["There are several advantages to…","Firstly,… In addition,…","However, there are also disadvantages.","For instance,…","Overall,…"],"There are several advantages to living and working in another country. Firstly, you can earn a higher salary and gain international experience, which is useful for your career. In addition, you learn a new language and discover a different culture, which helps you become more open-minded.\nHowever, there are also disadvantages. For instance, you may feel lonely, especially during holidays when you miss your family. Life can also be expensive, and it takes time to understand new rules and customs.\nOverall, I believe living abroad is a valuable experience, but people should prepare well and stay connected with their families.",CK_B1],
["b1w07","A message of advice","Your friend wants to improve his English quickly before a job interview in two months. Write him a message with advice.",120,["If I were you, I'd…","It might be a good idea to…","Why don't you…?","Make sure you…","Good luck!"],"Hi Amine,\nGreat news about the interview! Two months is enough time if you work regularly. If I were you, I'd practise speaking every day, even for fifteen minutes. Why don't you record yourself answering common interview questions, like 'Tell me about yourself'? Then listen and correct your mistakes.\nIt might also be a good idea to learn vocabulary related to your job. Watch interviews on YouTube with subtitles and note useful expressions. Finally, make sure you prepare examples from your experience.\nGood luck, I'm sure you'll do well!\nYacine",[...CK_B1,"I used different ways to give advice."]],
["b1w08","Describe a festival or celebration","Describe a festival or celebration in your country for a foreign reader.",150,["One of the most important celebrations in my country is…","It takes place…","People usually…","Traditionally,…","What I love most about it is…"],"One of the most important celebrations in Algeria is Yennayer, the Amazigh New Year. It takes place on 12 January, and since 2018 it has been a national holiday.\nPeople usually prepare a special dinner with family. Traditionally, they cook couscous or 'cherchem', a dish made of wheat and beans. In some regions, a small object is hidden in the food, and the person who finds it is said to have luck for the year.\nThere are also concerts, markets and exhibitions about Amazigh culture. What I love most about Yennayer is that it brings families together and celebrates our heritage.",CK_B1],
["b1w09","A report: facilities at your university","Your university asked students to write a short report about the facilities (library, cafeteria, sports) with recommendations.",150,["The aim of this report is to…","Overall,…","A major problem is that…","It is recommended that…","In conclusion,…"],"Report on student facilities\nThe aim of this report is to describe the main facilities at our university and suggest improvements.\nLibrary: Overall, the library is quiet and well organised. However, there are not enough computers, and it closes too early during exams.\nCafeteria: The food is cheap, but the choice is limited and there are long queues at lunchtime.\nSports: The sports hall is modern, but many students do not know about the activities.\nRecommendations: It is recommended that the library stays open until 10 p.m. during exams, that the cafeteria offers healthier options, and that the sports office advertises its activities on social media.",[...CK_B1,"I used headings and a neutral style."]],
["b1w10","A biography","Write a short biography of a person you admire (famous or not): their early life, achievements and why they matter.",150,["was born in… in…","As a child,…","After finishing…, he / she…","His / Her greatest achievement was…","Today,…"],"Fatma N'Soumer was born around 1830 in a village in Kabylie. As a child, she was very religious and studied the Quran, and she became known in her region for her intelligence and courage.\nWhen French troops entered Kabylie in the 1850s, she helped to organise the resistance. Her greatest achievement was leading fighters in several battles and becoming a symbol of freedom.\nShe was captured in 1857 and died in prison in 1863. Today, she is remembered as one of the most important women in Algerian history, and many schools and streets carry her name.",[...CK_B1,"I used the past simple and time expressions."]],
["b1w11","Describe a place for a travel blog","Write a short travel blog post about a place you know well, to make readers want to visit.",150,["If you're looking for…, then…","Located in…","The best time to visit is…","Don't miss…","Make sure you try…"],"If you're looking for a quiet escape from the city, then Tikjda is the place for you. Located in the Djurdjura mountains, about 140 kilometres from Algiers, it offers fresh air, forests and amazing views.\nThe best time to visit is spring, when the snow is melting and the hills are green, or winter if you want to see snow. Don't miss the walk to the cedar forest, where you might even see Barbary macaques, the famous monkeys of the region.\nMake sure you try the local honey and a hot bowl of chorba at one of the small restaurants. Bring warm clothes: even in summer, evenings can be cool!",CK_B1],
["b1w12","An email to a colleague","You can't attend an important meeting tomorrow. Write an email to a colleague explaining why and asking them to take notes.",110,["I'm afraid I won't be able to…","The reason is that…","Would you mind…?","I'd really appreciate it.","Thanks in advance,"],"Hi Nadia,\nI'm afraid I won't be able to attend tomorrow's meeting about the new project. The reason is that I have to travel to Oran for a client visit that was organised at the last minute.\nWould you mind taking notes for me, especially about the deadlines and the budget? If possible, could you also ask the manager when the next meeting will be? I'd really appreciate it.\nI'll be back on Thursday, so we can talk then.\nThanks in advance,\nSofiane",[...CK_B1,"I used a semi-formal, polite tone."]],
["b1w13","For and against: school uniforms","Write a balanced essay about school uniforms: arguments for and against, and your opinion.",160,["Many schools require…","Supporters argue that…","Furthermore,…","Opponents, however, believe that…","Personally,…"],"Many schools around the world require students to wear a uniform. This topic often creates debate.\nSupporters argue that uniforms create equality, because students from rich and poor families look the same. Furthermore, uniforms save time in the morning and help students focus on learning instead of fashion.\nOpponents, however, believe that uniforms limit students' freedom and creativity. They also point out that uniforms can be expensive for families with several children.\nPersonally, I support simple and affordable uniforms, because I think equality is more important. However, schools should allow students some choice, such as different colours or styles.",CK_B1],
["b1w14","A personal experience: a challenge","Write about a challenge you faced and what you learned from it.",150,["One of the biggest challenges I've ever faced was…","At the time,…","I had never…","Eventually,…","Looking back, I've learned that…"],"One of the biggest challenges I've ever faced was giving a presentation in English in front of 200 people at a conference. At the time, I was in my third year at university, and I had never spoken in public before.\nFor two weeks, I practised every evening in front of my family. I also recorded myself and watched videos of good speakers. On the day, my hands were shaking, but I took a deep breath and started.\nEventually, the presentation went well, and some people asked interesting questions. Looking back, I've learned that preparation is the key to confidence, and that fear becomes smaller when you face it.",CK_B1],
["b1w15","A proposal for your town","Your town wants ideas to make life better for young people. Write a short proposal.",150,["I would like to propose…","At present,…","This would allow…","It would also…","I strongly believe that…"],"I would like to propose the creation of a youth centre in the city centre.\nAt present, there are very few places where young people can meet, study or do activities in the evening, apart from cafés. As a result, many of them spend too much time on their phones or in the streets.\nThe centre could have a study room with free Wi-Fi, a small library, rooms for music and theatre, and a space for workshops on topics like programming or starting a business. This would allow young people to develop new skills. It would also create opportunities for volunteers and local associations.\nI strongly believe that investing in young people is investing in the future of our town.",CK_B1],
["b1w16","Describe a graph","The graph shows the number of students learning English at a language centre: 2020: 300, 2021: 450, 2022: 500, 2023: 400, 2024: 700. Describe the changes.",120,["The graph shows…","Between … and …, the number rose / fell…","It reached a peak of…","There was a slight / sharp…","Overall,…"],"The graph shows the number of students learning English at a language centre between 2020 and 2024.\nBetween 2020 and 2021, the number rose sharply from 300 to 450. It continued to increase slightly in 2022, reaching 500 students. However, in 2023 there was a fall to 400 students.\nIn 2024, the number rose dramatically to 700, the highest figure in the period.\nOverall, despite a drop in 2023, the number of students more than doubled over the five years.",[...CK_B1,"All my numbers match the data."]],
["b1w17","A story ending with a lesson","Write a story that ends with: '…and that was the day I learned to always read the instructions.'",150,["It all started when…","I was so excited that…","Unfortunately,…","To make things worse,…","…and that was the day I learned to always read the instructions."],"It all started when I bought a new bookshelf online. It arrived in a big box with dozens of pieces and a thick booklet. I was so excited that I threw the booklet aside and started building it immediately.\nAfter two hours, the bookshelf looked almost finished, but it was leaning to one side. Unfortunately, I had put two pieces upside down. To make things worse, when I put my books on it, one of the shelves fell and broke a vase that belonged to my grandmother.\nI had to take everything apart and start again, this time following every step carefully. It took another hour, but the result was perfect, and that was the day I learned to always read the instructions.",[...CK_B1,"My ending matches the given sentence exactly."]],
["b1w18","Comparing two options","You can study at a university near home or at a better university in another city. Compare the options and make a decision.",150,["On the one hand,…","On the other hand,…","Whereas…","Taking everything into account,…","That's why I've decided to…"],"I have to choose between two universities. On the one hand, studying near home has clear advantages. I could live with my family, save money on rent and keep my friends. My mother would also be happy!\nOn the other hand, the university in Algiers has a better reputation, modern laboratories and more international programmes. Whereas my local university offers only a general degree, the other one offers a specialisation in data science, which is my dream.\nTaking everything into account, I believe the opportunities are more important than comfort. That's why I've decided to study in Algiers, even if it will be difficult at first.",CK_B1],
["b1w19","A thank-you and recommendation","A teacher helped you a lot. Write a message to the school director thanking the teacher and explaining why they deserve recognition.",130,["I am writing to express my gratitude to…","Thanks to his / her…","He / She always…","I believe he / she deserves…","Yours sincerely,"],"Dear Director,\nI am writing to express my gratitude to Mr Belkacem, who taught me physics this year.\nThanks to his clear explanations and patience, I went from failing the subject to getting one of the best marks in my class. He always stayed after class to answer questions, and he created online exercises that helped us revise at home.\nMore importantly, he believed in his students and encouraged us when we lost confidence. I believe he deserves to be recognised as an outstanding teacher, and I hope future students will have the same opportunity.\nYours sincerely,\nMeriem Haddad",CK_B1],
["b1w20","An essay: technology and jobs","Some people think technology will create more jobs than it destroys. Others disagree. Discuss and give your opinion.",170,["It is often said that…","There is no doubt that…","At the same time,…","In my view,…","In conclusion,…"],"It is often said that technology is destroying jobs. There is no doubt that machines and software have replaced many tasks, such as working in factories or processing documents in offices.\nAt the same time, technology has created completely new jobs, for example app developers, data analysts and social media managers, which did not exist twenty years ago. It also allows small businesses to sell online and reach customers in other countries.\nIn my view, technology will create more jobs than it destroys, but only if people are ready to learn new skills. Governments and universities should offer training so that workers can adapt.\nIn conclusion, the challenge is not technology itself, but how well we prepare for it.",CK_B1]
]);

["b1s01","The Interview",[
 ["Hakim had been looking for a job for six months.","كان حكيم يبحث عن عمل منذ ستة أشهر."],
 ["He had sent more than fifty applications, but nobody had answered.","كان قد أرسل أكثر من خمسين طلبًا، لكن لم يرد عليه أحد."],
 ["One morning, he received an email from a big company in Algiers.","في صباح أحد الأيام، تلقى بريدًا إلكترونيًا من شركة كبيرة في الجزائر العاصمة."],

 ["He spent the whole evening preparing answers to possible questions.","قضى المساء كله يحضّر أجوبة لأسئلة محتملة."],
 ["On the way to the interview, he saw an old man who had fallen in the street.","في الطريق إلى المقابلة، رأى رجلًا مسنًا سقط في الشارع."],

 [["How long had Hakim been looking for a job?",["Six weeks","Six months","One year","Two months"],1,"For six months."],["Why was he late?",["He missed the bus","He helped an old man","He forgot the address","He overslept"],1,"He stopped to help an old man."],["Who was the director?",["Hakim's friend","The old man's son","Hakim's teacher","A stranger"],1,"The director was the old man's son."]]],
["b1s02","The Lighthouse Keeper",[
 ["For thirty years, Mr Amrani had looked after the lighthouse on the rocky coast.","لمدة ثلاثين عامًا، كان السيد عمراني يعتني بالمنارة على الساحل الصخري."],
 ["Every evening, he climbed the 120 steps to turn on the light.","كل مساء، كان يصعد مئة وعشرين درجة ليشعل الضوء."],
 ["Ships passing at night depended on him.","كانت السفن المارة ليلًا تعتمد عليه."],
 ["One winter night, a terrible storm hit the coast.","في إحدى ليالي الشتاء، ضربت عاصفة رهيبة الساحل."],
 ["The electricity went off, and the lighthouse became dark.","انقطعت الكهرباء، وأصبحت المنارة مظلمة."],
 ["Mr Amrani knew that a fishing boat was still at sea.","كان السيد عمراني يعلم أن قارب صيد لا يزال في البحر."],
 ["He quickly lit the old oil lamp that he had kept for emergencies.","أشعل بسرعة المصباح الزيتي القديم الذي احتفظ به لحالات الطوارئ."],
 ["All night, he stayed awake to keep the flame alive.","طوال الليل، بقي مستيقظًا ليحافظ على اللهب مشتعلًا."],
 ["At dawn, the fishing boat arrived safely in the port.","عند الفجر، وصل قارب الصيد بسلام إلى الميناء."],
 ["The fishermen came to thank him with fresh fish and tears in their eyes.","جاء الصيادون ليشكروه حاملين السمك الطازج والدموع في أعينهم."]],
 [["How long had Mr Amrani worked at the lighthouse?",["Ten years","Twenty years","Thirty years","Forty years"],2,"For thirty years."],["What happened during the storm?",["The lighthouse fell","The electricity went off","A ship sank","He left"],1,"The electricity went off."],["How did he save the boat?",["He called the police","He lit an old oil lamp","He swam to it","He used his phone"],1,"He lit the old oil lamp."]]],
["b1s03","The Language Exchange",[
 ["When Clara arrived in Oran from Spain, she didn't speak a word of Arabic.","عندما وصلت كلارا إلى وهران قادمة من إسبانيا، لم تكن تتكلم كلمة واحدة بالعربية."],
 ["She had come to work as a Spanish teacher at a language school.","كانت قد جاءت لتعمل معلمة للغة الإسبانية في مدرسة لغات."],
 ["One of her students, Wassila, offered her a deal.","عرضت عليها إحدى طالباتها، وسيلة، اتفاقًا."],
 ["\"I'll teach you Algerian Arabic if you help me with my Spanish.\"","\"سأعلمك الدارجة الجزائرية إن ساعدتني في الإسبانية.\""],
 ["Every Saturday, they met at a café near the sea.","كل يوم سبت، كانتا تلتقيان في مقهى قرب البحر."],
 ["They spoke Spanish for one hour and Arabic for the next.","كانتا تتحدثان الإسبانية لمدة ساعة والعربية في الساعة التالية."],
 ["Clara made funny mistakes, and Wassila laughed kindly.","كانت كلارا ترتكب أخطاء مضحكة، وكانت وسيلة تضحك بلطف."],
 ["After a year, Clara could bargain at the market and chat with neighbours.","بعد عام، أصبحت كلارا قادرة على المساومة في السوق والدردشة مع الجيران."],
 ["Wassila passed her Spanish exam with an excellent mark.","نجحت وسيلة في امتحان الإسبانية بعلامة ممتازة."],
 ["More importantly, they had become best friends.","والأهم من ذلك، أصبحتا صديقتين مقربتين."]],
 [["Why did Clara come to Oran?",["To study","To work as a Spanish teacher","On holiday","To visit family"],1,"To work as a Spanish teacher."],["What was the deal?",["Money for lessons","Arabic lessons in exchange for Spanish help","Free coffee","A trip to Spain"],1,"I'll teach you Algerian Arabic if you help me with my Spanish."],["What was the most important result?",["Clara left Oran","They became best friends","Wassila failed","They stopped meeting"],1,"They had become best friends."]]],
["b1s04","The Broken Phone",[
 ["Bilal dropped his phone in the sink while he was washing the dishes.","أسقط بلال هاتفه في المغسلة بينما كان يغسل الأطباق."],
 ["The screen went black, and nothing worked.","أصبحت الشاشة سوداء، ولم يعد شيء يعمل."],
 ["He couldn't afford a new one until the end of the month.","لم يكن يستطيع شراء هاتف جديد حتى نهاية الشهر."],
 ["At first, he felt lost without it.","في البداية، شعر بالضياع بدونه."],
 ["He kept reaching into his pocket out of habit.","ظل يمد يده إلى جيبه بحكم العادة."],
 ["But after a few days, something strange happened.","لكن بعد أيام قليلة، حدث شيء غريب."],
