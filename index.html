 ["He talked more with his family at dinner.","صار يتحدث أكثر مع عائلته على العشاء."],
 ["He even noticed the birds singing outside his window in the morning.","حتى إنه لاحظ العصافير تغرد خارج نافذته في الصباح."],
 ["When he finally bought a new phone, he decided to keep it in a drawer during the evenings.","وعندما اشترى أخيرًا هاتفًا جديدًا، قرر أن يتركه في درج خلال الأمسيات."]],
 [["How did Bilal break his phone?",["He dropped it on the floor","He dropped it in the sink","Someone stole it","The battery exploded"],1,"He dropped his phone in the sink."],["What did he start doing?",["Watching more TV","Reading books and talking with family","Working more","Sleeping all day"],1,"Reading books and talking more with his family."],["What did he decide in the end?",["Never to buy a phone","To keep the new phone in a drawer in the evenings","To buy two phones","To use it all day"],1,"Keep it in a drawer during the evenings."]]],
["b1s05","The Secret Recipe",[
 ["Grandma Zoubida was famous in the neighbourhood for her makrout.","كانت الجدة زبيدة مشهورة في الحي بالمقروط الذي تصنعه."],
 ["People said nobody could make it as well as she did.","كان الناس يقولون إن لا أحد يستطيع صنعه مثلها."],
 ["For years, she had refused to share the recipe.","لسنوات، كانت ترفض مشاركة الوصفة."],
 ["When her granddaughter Sihem got married, Grandma called her into the kitchen.","عندما تزوجت حفيدتها سهام، نادتها الجدة إلى المطبخ."],
 ["\"It's time,\" she said, closing the door.","قالت وهي تغلق الباب: \"لقد حان الوقت.\""],
 ["She showed Sihem how to mix the semolina, dates and orange flower water.","أرت سهام كيف تخلط السميد والتمر وماء الزهر."],
 ["Sihem waited for the secret ingredient.","انتظرت سهام المكوّن السري."],
 ["But Grandma only smiled and said, \"There is no secret.\"","لكن الجدة ابتسمت فقط وقالت: \"لا يوجد سر.\""],
 ["\"I just make it slowly, with patience, for the people I love.\"","\"أنا فقط أصنعه ببطء، وبصبر، من أجل من أحب.\""],
 ["Today, Sihem's makrout is almost as good as her grandmother's.","اليوم، مقروط سهام يكاد يكون جيدًا مثل مقروط جدتها."]],
 [["What was Grandma famous for?",["Couscous","Makrout","Bread","Tea"],1,"Famous for her makrout."],["When did she share the recipe?",["Never","When Sihem got married","At a party","On TV"],1,"When her granddaughter Sihem got married."],["What was the 'secret'?",["A special spice","Patience and love","Expensive dates","A machine"],1,"Make it slowly, with patience, for the people I love."]]],
["b1s06","The Wrong Email",[
 ["Lamia worked as an assistant in a busy marketing agency.","كانت لمياء تعمل مساعدة في وكالة تسويق مزدحمة."],
 ["One Friday, she wrote a funny email to her friend about their boss's terrible jokes.","في أحد أيام الجمعة، كتبت رسالة مضحكة لصديقتها عن نكات مديرهما السيئة."],
 ["She pressed 'send' and went to make a coffee.","ضغطت على \"إرسال\" وذهبت لتحضر قهوة."],
 ["When she came back, her heart stopped.","عندما عادت، توقف قلبها."],
 ["She had sent the email to the whole company, including the boss.","كانت قد أرسلت الرسالة إلى الشركة كلها، بما في ذلك المدير."],
 ["She spent the weekend imagining the worst.","قضت عطلة نهاية الأسبوع تتخيل الأسوأ."],
 ["On Monday, she went to his office to apologise.","يوم الاثنين، ذهبت إلى مكتبه لتعتذر."],
 ["To her surprise, he was laughing.","لدهشتها، كان يضحك."],
 ["\"Everyone has been telling me my jokes are bad,\" he said. \"You're the first to write it down!\"","قال: \"الجميع يقولون لي إن نكاتي سيئة. أنتِ أول من كتبها!\""],
 ["Since that day, Lamia always checks the recipients twice.","منذ ذلك اليوم، تتحقق لمياء دائمًا من المرسَل إليهم مرتين."]],
 [["What was the email about?",["A new project","The boss's terrible jokes","A holiday","A salary"],1,"About their boss's terrible jokes."],["What was the mistake?",["She sent it to the whole company","She forgot to write","She deleted it","She sent it to a client"],0,"She had sent the email to the whole company."],["How did the boss react?",["He was angry","He fired her","He laughed","He cried"],2,"To her surprise, he was laughing."]]],
["b1s07","The Mountain Village",[
 ["After finishing his medical studies, Dr Rabah chose to work in a small mountain village.","بعد أن أنهى دراسة الطب، اختار الدكتور رابح العمل في قرية جبلية صغيرة."],
 ["His friends thought he was crazy.","ظن أصدقاؤه أنه مجنون."],
 ["\"You could earn much more in the city,\" they said.","قالوا: \"يمكنك أن تكسب أكثر بكثير في المدينة.\""],
 ["The village had no doctor, and the nearest hospital was two hours away.","لم يكن في القرية طبيب، وكان أقرب مستشفى على بعد ساعتين."],
 ["At first, the villagers were suspicious of the young doctor.","في البداية، كان سكان القرية يشكّون في الطبيب الشاب."],
 ["But one night, he saved the life of a child with a high fever.","لكن في إحدى الليالي، أنقذ حياة طفل مصاب بحمى شديدة."],
 ["After that, people trusted him completely.","بعد ذلك، وثق به الناس تمامًا."],
 ["They brought him vegetables, honey and bread as gifts.","كانوا يحضرون له الخضروات والعسل والخبز هدايا."],
 ["Twenty years later, he is still there.","بعد عشرين عامًا، لا يزال هناك."],
 ["\"I'm not rich,\" he says, \"but I'm the happiest man I know.\"","يقول: \"لست غنيًا، لكنني أسعد رجل أعرفه.\""]],
 [["Why did his friends think he was crazy?",["He could earn more in the city","He didn't finish his studies","He was afraid of mountains","He wanted to be a farmer"],0,"You could earn much more in the city."],["What changed the villagers' opinion?",["He gave them money","He saved a child's life","He built a hospital","He became the mayor"],1,"He saved the life of a child with a high fever."],["How does he feel now?",["Rich and bored","Not rich but very happy","Tired and sad","He wants to leave"],1,"I'm the happiest man I know."]]],
["b1s08","The Second-Hand Bookshop",[
 ["Every Thursday, Nesrine visited the small second-hand bookshop near the university.","كل يوم خميس، كانت نسرين تزور مكتبة الكتب المستعملة الصغيرة قرب الجامعة."],
 ["The owner, an old man named Ammi Saïd, always recommended a new book.","كان صاحبها، رجل مسن يدعى عمي سعيد، يقترح عليها دائمًا كتابًا جديدًا."],
 ["One day, she found an old novel with a letter hidden between the pages.","في أحد الأيام، وجدت رواية قديمة فيها رسالة مخبأة بين الصفحات."],
 ["The letter had been written in 1975 by a young man to the woman he loved.","كانت الرسالة قد كُتبت عام 1975 من شاب إلى المرأة التي يحبها."],
 ["Nesrine showed it to Ammi Saïd.","أرت نسرين الرسالة لعمي سعيد."],
 ["His hands began to shake as he read it.","بدأت يداه ترتجفان وهو يقرؤها."],
 ["\"I wrote this,\" he whispered. \"I never had the courage to send it.\"","همس: \"أنا من كتبها. لم تكن لدي الشجاعة لإرسالها.\""],
 ["The woman had married someone else and moved away.","كانت المرأة قد تزوجت شخصًا آخر وانتقلت بعيدًا."],
 ["He had sold the book years ago, without remembering the letter inside.","كان قد باع الكتاب منذ سنوات، دون أن يتذكر الرسالة بداخله."],
 ["Nesrine gave the letter back, and he put it in his pocket, smiling sadly.","أعادت نسرين الرسالة، فوضعها في جيبه مبتسمًا بحزن."]],
 [["What did Nesrine find in the novel?",["Money","A hidden letter","A photo","A map"],1,"A letter hidden between the pages."],["Who wrote the letter?",["Nesrine's father","Ammi Saïd","A famous writer","A stranger"],1,"I wrote this."],["Why was the letter never sent?",["He lost the address","He didn't have the courage","The post office was closed","She returned it"],1,"I never had the courage to send it."]]],
["b1s09","The Marathon",[
 ["Samia had never been good at sport.","لم تكن سامية يومًا جيدة في الرياضة."],
 ["At school, she was always the last to finish the race.","في المدرسة، كانت دائمًا آخر من ينهي السباق."],
 ["At thirty-five, after a health scare, she decided to start running.","في الخامسة والثلاثين، وبعد وعكة صحية مقلقة، قررت أن تبدأ الجري."],
 ["The first day, she could only run for two minutes without stopping.","في اليوم الأول، لم تستطع أن تجري سوى دقيقتين دون توقف."],
 ["She felt embarrassed, but she didn't give up.","شعرت بالإحراج، لكنها لم تستسلم."],
 ["She ran three times a week, a little further each time.","كانت تجري ثلاث مرات في الأسبوع، أبعد قليلًا في كل مرة."],
 ["After a year, she signed up for a half-marathon.","بعد عام، سجّلت في نصف ماراثون."],
 ["On the day of the race, her legs hurt and she wanted to stop.","في يوم السباق، كانت ساقاها تؤلمانها وأرادت أن تتوقف."],
 ["Then she saw her children cheering at the finish line.","ثم رأت أطفالها يشجعونها عند خط النهاية."],
 ["She crossed the line with tears of joy, not first, but proud.","عبرت الخط بدموع الفرح، ليست الأولى، لكنها فخورة."]],
 [["Why did Samia start running?",["To win money","After a health scare","Her friend asked her","For a job"],1,"After a health scare."],["How long could she run on the first day?",["Two minutes","Twenty minutes","One hour","Five kilometres"],0,"Only two minutes without stopping."],["Who was waiting at the finish line?",["Her boss","Her children","Her doctor","Nobody"],1,"Her children cheering at the finish line."]]],
["b1s10","The Last Train",[
 ["It was almost midnight when Farès reached the station.","كانت الساعة تقارب منتصف الليل عندما وصل فارس إلى المحطة."],
 ["He had missed the last train by two minutes.","كان قد فاته آخر قطار بدقيقتين."],
 ["The station was empty, and his phone battery was dead.","كانت المحطة فارغة، وبطارية هاتفه فارغة."],
 ["He sat on a bench, wondering what to do.","جلس على مقعد يتساءل ماذا يفعل."],
 ["A cleaner, who was finishing her shift, noticed him.","لاحظته عاملة نظافة كانت تنهي نوبتها."],
 ["She lent him her phone so that he could call his brother.","أعارته هاتفها ليتمكن من الاتصال بأخيه."],
 ["While they waited, she told him she had been working there for twenty years.","بينما كانا ينتظران، أخبرته أنها تعمل هناك منذ عشرين عامًا."],
 ["She had raised four children alone, and they had all gone to university.","كانت قد ربّت أربعة أطفال وحدها، والتحقوا جميعًا بالجامعة."],
 ["When his brother arrived, Farès thanked her warmly.","عندما وصل أخوه، شكرها فارس بحرارة."],
 ["He realised that missing the train had given him a lesson about courage.","أدرك أن فوات القطار علّمه درسًا عن الشجاعة."]],
 [["Why was Farès stuck at the station?",["He missed the last train","He lost his ticket","The station closed early","He fell asleep"],0,"He had missed the last train by two minutes."],["How did the cleaner help him?",["She drove him home","She lent him her phone","She gave him money","She bought him a ticket"],1,"She lent him her phone."],["What had the cleaner done?",["Become a manager","Raised four children who all went to university","Travelled the world","Bought the station"],1,"She had raised four children alone, and they had all gone to university."]]]
]);

/* ---- B2 lessons 5-20 ---- */
addLessons("B2",[
["b2L05","Future continuous and future perfect",
 "Future continuous (will be + -ing) = an action in progress at a future time: This time tomorrow I'll be flying to Dubai. Future perfect (will have + past participle) = completed before a future time: By June, I'll have finished my thesis.",
 "will be + -ing = en cours à un moment futur ; will have + p.p. = terminé avant un moment futur.",
 ["Don't call at 8; I'll be having dinner.","By 2030, they will have built the new metro line.","Will you be using the car tonight?"],
 [["This time next week, we ___ on the beach.",["will lie","will be lying","will have lain","lie"],1,"In progress at a future time: will be lying."],
  ["By the time you arrive, I ___ the report.",["will finish","will be finishing","will have finished","finish"],2,"Completed before a future moment: will have finished."],
  ["In ten years, she ___ here for a quarter of a century.",["will work","will have worked","is working","works"],1,"Duration up to a future point: will have worked."],
  ["___ you be passing the post office? Could you post this?",["Will","Are","Do","Have"],0,"Polite question about plans: Will you be…?"],
  ["By midnight, the guests ___.",["will have left","will be leave","leave","have left"],0,"Completed by midnight."]],
 [["thesis","a long piece of university research","thèse, mémoire"],["quarter of a century","25 years","un quart de siècle"],["by the time","before the moment when","d'ici à ce que"],["metro line","an underground train route","ligne de métro"]]],
["b2L06","Wish and if only",
 "Wish + past simple = a present situation you want to be different (I wish I had more time). Wish + past perfect = regret about the past (I wish I had studied harder). Wish + would = annoyance about someone's behaviour (I wish you would stop interrupting).",
 "wish + passé = regret présent ; wish + plus-que-parfait = regret passé ; wish + would = agacement.",
 ["I wish I lived closer to the sea.","If only I hadn't said that!","I wish the neighbours would turn the music down."],
 [["I wish I ___ speak Chinese.",["can","could","will","would"],1,"Present wish: could."],
  ["She wishes she ___ the job offer last year.",["accepted","had accepted","would accept","accepts"],1,"Past regret: had accepted."],
  ["If only it ___ raining! We want to go out.",["stops","would stop","stopped","had stopped"],1,"Annoyance/desire for change: would stop."],
  ["I wish I ___ so much yesterday. I feel terrible.",["didn't eat","hadn't eaten","wouldn't eat","don't eat"],1,"Past regret: hadn't eaten."],
  ["Which is correct?",["I wish I would be taller.","I wish I was / were taller.","I wish I am taller.","I wish I had been taller now."],1,"Present state: past simple (were/was)."]],
 [["regret","feel sorry about something you did","regretter"],["annoyance","feeling slightly angry","agacement"],["interrupt","stop someone speaking","interrompre"],["offer","something proposed to you","offre"]]],
["b2L07","Past deduction: must have, can't have, might have",
 "To make deductions about the past use modal + have + past participle: She must have left early (I'm sure). He can't have seen us (I'm sure he didn't). They might / could have missed the bus (possible).",
 "must have + p.p. = a sûrement ; can't have = n'a sûrement pas ; might have = a peut-être.",
 ["The ground is wet. It must have rained last night.","He can't have finished already; he only started ten minutes ago.","She might have forgotten our meeting."],
 [["The lights are off. They ___ gone to bed.",["must have","can't have","should have","mustn't have"],0,"Logical certainty: must have."],
  ["You ___ seen Karim yesterday. He's in Canada!",["must have","might have","can't have","should have"],2,"Impossible: can't have."],
  ["I'm not sure why she's late. She ___ got stuck in traffic.",["must have","might have","can't have","would have"],1,"Possibility: might have."],
  ["He passed with 19/20. He ___ studied a lot.",["can't have","must have","needn't have","shouldn't have"],1,"Logical conclusion: must have."],
  ["'Could have left' means…",["certainly left","possibly left","didn't leave","should leave"],1,"Could have = possible in the past."]],
 [["stuck","not able to move","bloqué"],["deduction","a logical conclusion","déduction"],["ground","the floor outside","sol"],["certainty","being completely sure","certitude"]]],
["b2L08","Should have, could have, needn't have",
 "Should have + past participle = criticism or regret (You should have told me). Could have = a possibility that didn't happen (I could have won). Needn't have = you did it, but it wasn't necessary (You needn't have bought flowers).",
 "should have = aurait dû ; could have = aurait pu ; needn't have = n'était pas nécessaire (mais fait).",
 ["I should have listened to your advice.","We could have taken a taxi, but we walked.","You needn't have cooked; we'd already eaten."],
 [["I failed. I ___ studied more.",["must have","should have","can't have","needn't have"],1,"Regret: should have."],
  ["You ___ brought an umbrella. It didn't rain.",["needn't have","mustn't have","couldn't have","should have"],0,"Done but unnecessary: needn't have."],
  ["She ___ been a great doctor, but she chose music.",["could have","must have","should","can't have"],0,"Possibility that didn't happen: could have."],
  ["You ___ driven so fast. It was dangerous.",["shouldn't have","needn't have","couldn't have","mustn't"],0,"Criticism: shouldn't have."],
  ["'He should have called' means…",["He called","He didn't call, and that was wrong","He might call","He had to call and did"],1,"Criticism of something not done."]],
 [["criticism","saying something was wrong","critique"],["advice","a suggestion","conseil"],["unnecessary","not needed","inutile"],["chose","past of choose","a choisi"]]],
["b2L09","Impersonal passive: it is said that…",
 "To report general beliefs formally, use It is said / believed / thought / reported that + clause, or subject + is said / believed + to + infinitive: It is believed that the city was founded by the Phoenicians. The city is believed to have been founded by the Phoenicians.",
 "It is said that… / He is said to… = on dit que… (style formel).",
 ["It is reported that ten people were injured.","The painting is thought to be worth millions.","He is said to have left the country."],
 [["___ that the minister will resign.",["It says","It is said","They are said","It is saying"],1,"Impersonal passive: It is said that."],
  ["The castle is believed ___ in the 12th century.",["to build","to have been built","building","be built"],1,"Past passive infinitive: to have been built."],
  ["She is thought ___ the richest woman in the country.",["be","to be","being","to have"],1,"Present: to be."],
  ["Which sentence is the most formal?",["People say coffee is bad for you.","Coffee is said to be bad for you.","Coffee, they say, is bad.","Everyone knows coffee is bad."],1,"Impersonal passive is more formal."],
  ["It ___ that the economy will grow next year.",["expects","is expected","is expecting","expected"],1,"Passive: is expected."]],
 [["resign","leave a job officially","démissionner"],["founded","started (a city, company)","fondé"],["injured","hurt","blessé"],["worth","having a value of","valant"]]],
["b2L10","Causative: have / get something done",
 "Use have / get + object + past participle when someone else does something for you: I had my car repaired. She's getting her hair cut tomorrow. It can also describe bad experiences: He had his phone stolen.",
 "have/get + objet + participe passé = faire faire quelque chose par quelqu'un.",
 ["We're having our kitchen painted.","I need to get my eyes tested.","She had her bag stolen on the train."],
 [["I ___ my passport renewed last week.",["had","made","did","renewed"],0,"Causative: had + object + past participle."],
  ["You should get your laptop ___.",["check","checked","checking","to check"],1,"Past participle: checked."],
  ["They're having a new roof ___ next month.",["put","putting","puts","to put"],0,"Past participle of put: put."],
  ["He had his wallet ___ in the market.",["steal","stolen","stealing","stole"],1,"Bad experience: had his wallet stolen."],
  ["Which means someone else cut her hair?",["She cut her hair.","She had her hair cut.","She has cut her hair.","She was cutting her hair."],1,"Causative = someone else did it."]],
 [["renew","make valid again","renouveler"],["roof","the top of a building","toit"],["test (eyes)","check","faire contrôler (la vue)"],["stolen","taken by a thief","volé"]]],
["b2L11","Reporting verbs",
 "Instead of say and tell, use precise reporting verbs: suggest + -ing / that, recommend, admit + -ing, deny + -ing, refuse + to, offer + to, warn + object + (not) to, remind + object + to, apologise for + -ing.",
 "Verbes rapporteurs : suggest -ing, admit -ing, deny -ing, refuse to, offer to, warn sb (not) to.",
 ["She suggested going to the cinema.","He denied taking the money.","My mother reminded me to call my aunt."],
 [["'I didn't break the window!' → He denied ___ the window.",["to break","breaking","break","that break"],1,"deny + -ing."],
  ["'Let's take a break.' → She suggested ___ a break.",["to take","taking","take","us to take"],1,"suggest + -ing."],
  ["'I'll carry your bag.' → He offered ___ my bag.",["carrying","to carry","carry","that carry"],1,"offer + to."],
  ["'Don't touch the wire!' → The electrician warned us ___ the wire.",["to touch","not touching","not to touch","don't touch"],2,"warn + object + not to."],
  ["'Sorry I'm late.' → She apologised ___ late.",["to be","for being","being","that be"],1,"apologise for + -ing."]],
 [["deny","say something is not true","nier"],["admit","agree that something is true","admettre"],["warn","tell about a danger","avertir"],["remind","help someone remember","rappeler"]]],
["b2L12","Verbs with -ing or to: change of meaning",
 "Some verbs change meaning: remember / forget doing (memory of the past) vs remember / forget to do (a duty); stop doing (quit) vs stop to do (pause in order to); try doing (experiment) vs try to do (make an effort); regret doing vs regret to inform.",
 "remember doing = se souvenir d'avoir fait ; remember to do = ne pas oublier de faire ; stop doing = arrêter ; stop to do = s'arrêter pour.",
 ["I remember meeting him in 2015.","Remember to lock the door.","He stopped to buy some water."],
 [["I'll never forget ___ the Sahara for the first time.",["to see","seeing","see","to seeing"],1,"Memory of the past: forget seeing."],
  ["Please remember ___ the lights before you leave.",["turning off","to turn off","turn off","turned off"],1,"A duty: remember to do."],
  ["He was tired, so he stopped ___ a coffee.",["having","to have","have","had"],1,"Pause in order to: stopped to have."],
  ["My doctor told me to stop ___. It's bad for my lungs.",["to smoke","smoking","smoke","smoked"],1,"Quit: stop smoking."],
  ["If the laptop won't start, try ___ the battery.",["to charge","charging","charge","charged"],1,"Experiment: try charging."]],
 [["lock","close with a key","fermer à clé"],["lungs","organs you breathe with","poumons"],["quit","stop doing permanently","arrêter"],["charge","fill with electricity","charger"]]],
["b2L13","Participle clauses",
 "Participle clauses make writing more concise. Present participle (-ing) = active: Walking home, I saw an accident. Past participle = passive: Built in 1890, the bridge is still used. Having + past participle = completed before: Having finished the report, she went home.",
 "Propositions participiales : -ing (actif), participe passé (passif), having + p.p. (antériorité).",
 ["Feeling tired, he went to bed early.","Written in 1960, the novel is still popular.","Having lost his keys, he couldn't get in."],
 [["___ the email, she closed her laptop.",["Sending","Having sent","Sent","To send"],1,"Completed first: Having sent."],
  ["___ by millions of people, the app is very successful.",["Using","Used","Having used","Use"],1,"Passive meaning: Used."],
  ["___ along the beach, we found a small turtle.",["Walked","Walking","Having walked","To walk"],1,"Simultaneous active action: Walking."],
  ["The man ___ next to me was very rude.",["sat","sitting","sits","having sat"],1,"Active: the man who was sitting."],
  ["Products ___ in Algeria often use local materials.",["making","made","make","having made"],1,"Passive: products that are made."]],
 [["concise","short and clear","concis"],["turtle","an animal with a shell","tortue"],["rude","not polite","impoli"],["materials","what things are made of","matériaux"]]],
["b2L14","Cleft sentences for emphasis",
 "Cleft sentences highlight information. It + be + focus + who / that: It was Lina who solved the problem. What-clauses: What I need is a holiday. What surprised me was his calm.",
 "Mise en relief : It was … who/that… ; What I need is…",
 ["It was in 1962 that Algeria became independent.","What I love about Oran is the atmosphere.","It's not the money that matters, it's the experience."],
 [["___ I really need is more sleep.",["That","What","Which","It"],1,"What-cleft."],
  ["It was my sister ___ found the solution.",["which","who","what","whom she"],1,"Person: who (or that)."],
  ["Which sentence emphasises 'the price'?",["The price surprised me.","What surprised me was the price.","I was surprised.","The price was surprising."],1,"What … was the price."],
  ["It ___ in Tlemcen that we first met.",["is","was","were","has"],1,"Past event: It was…"],
  ["What she did ___ call the police.",["is","was","were","did"],1,"What she did was (to) call…"]],
 [["emphasis","making something important","insistance"],["independent","free, not controlled by another","indépendant"],["atmosphere","the feeling of a place","ambiance"],["solution","the answer to a problem","solution"]]],
["b2L15","Linking: whereas, nevertheless, moreover",
 "Contrast: whereas / while (between two clauses), nevertheless / however (new sentence). Addition: moreover / furthermore / in addition. Result: consequently / therefore / as a result.",
 "whereas = alors que ; nevertheless = néanmoins ; moreover = de plus ; therefore = donc.",
 ["My brother loves maths, whereas I prefer literature.","The plan was risky. Nevertheless, they continued.","The hotel is cheap. Moreover, it's close to the beach."],

["b2L19","Word formation: prefixes and suffixes",

["b2c06","en-US","A podcast on burnout","Burnout isn't just feeling tired. It's a state of emotional exhaustion, cynicism and reduced performance, usually caused by chronic stress at work. Experts warn that taking a holiday may help temporarily, but unless the underlying causes are addressed, the symptoms tend to return.",

addReads("B2",[
["b2r01","The paradox of choice","In 2004, the psychologist Barry Schwartz published The Paradox of Choice, arguing that having too many options can make people less happy. When faced with dozens of similar products, consumers often feel anxious, take longer to decide and are less satisfied with what they finally choose.\nSchwartz distinguishes between 'maximisers', who always search for the best possible option, and 'satisficers', who are happy with something that is good enough. Research suggests that satisficers tend to be more content, even if maximisers sometimes make objectively better decisions.\nCritics point out that the effect depends on context. Experts in a field, for instance, may enjoy choosing from many options. Nevertheless, the idea has influenced how companies design menus, websites and product ranges.",
 [["What is the main idea of Schwartz's book?",["More choice always makes us happier","Too many options can make people less happy","Shopping is relaxing","Choice is not important"],1,"Having too many options can make people less happy."],["What is a 'satisficer'?",["Someone who looks for the best option","Someone happy with a good-enough option","A shop assistant","A critic"],1,"Happy with something that is good enough."],["What do critics say?",["The effect depends on context","The book is wrong in all cases","Experts hate choice","Companies ignore it"],0,"The effect depends on context."],["How has the idea been used?",["In designing menus and websites","In building roads","In teaching maths","In sport"],0,"It has influenced how companies design menus, websites and product ranges."]],
 [["paradox","a statement that seems contradictory"],["content","satisfied, happy"],["objectively","based on facts, not feelings"]]],
["b2r02","Brain drain or brain circulation?","For decades, the departure of highly educated people from developing countries to wealthier nations has been described as a 'brain drain'. Algeria, like many countries, has seen thousands of doctors, engineers and researchers settle abroad, particularly in France and Canada.\nThe consequences can be serious: hospitals lose specialists, and universities struggle to retain talented staff. However, some economists now prefer the term 'brain circulation'. They argue that emigrants often send money home, create business links and transfer knowledge, especially when they return or collaborate remotely.\nGovernments are increasingly trying to benefit from their diasporas, for example by creating networks of experts abroad, offering incentives for return, or involving emigrants in national research projects.",
 [["What is 'brain drain'?",["Students failing exams","Educated people leaving for richer countries","A medical condition","Too many universities"],1,"The departure of highly educated people to wealthier nations."],["Which consequence is mentioned?",["Hospitals lose specialists","Prices fall","More tourists come","Schools close"],0,"Hospitals lose specialists."],["Why do some prefer 'brain circulation'?",["Emigrants never return","Emigrants send money, create links and transfer knowledge","It sounds nicer","Because of tourism"],1,"Emigrants send money, create business links and transfer knowledge."],["What are governments doing?",["Banning emigration","Trying to benefit from their diasporas","Closing universities","Ignoring the issue"],1,"Trying to benefit from their diasporas."]],
 [["settle","go to live permanently"],["retain","keep"],["incentive","something that encourages action"]]],
["b2r03","Why sleep deprivation is a public health issue","Sleep was once considered a passive state, but it is now known to be essential for memory, emotional balance and the immune system. Adults who regularly sleep fewer than six hours a night face a higher risk of obesity, heart disease and depression.\nDespite this, sleep deprivation is widespread. Long working hours, late-night screen use and noisy urban environments all contribute. Some researchers argue that sleep should be treated as seriously as diet and exercise in public health campaigns.\nSeveral measures have been proposed: starting school later for teenagers, whose biological clocks naturally shift later; limiting work emails outside office hours; and educating people about sleep hygiene. Critics note that such policies may be difficult to implement, but evidence of their benefits is growing.",
 [["What was sleep once considered?",["Essential","A passive state","Dangerous","A luxury"],1,"Sleep was once considered a passive state."],["Which risk is linked to sleeping under six hours?",["Better memory","Heart disease","Taller height","Better immune system"],1,"Higher risk of obesity, heart disease and depression."],["Why should school start later for teenagers?",["They are lazy","Their biological clocks shift later","Teachers prefer it","Buses are late"],1,"Their biological clocks naturally shift later."],["What do critics say about these policies?",["They have no benefits","They may be difficult to implement","They are too cheap","They are already everywhere"],1,"Such policies may be difficult to implement."]],
 [["deprivation","not having enough of something"],["widespread","found in many places"],["implement","put into action"]]],
["b2r04","The economics of the informal sector","In many developing economies, a large share of workers are employed in the informal sector: street vendors, small repair shops, home-based producers and unregistered transport services. These activities are not officially recorded, taxed or protected by labour law.\nThe informal sector provides income for millions of people who might otherwise be unemployed, and it often offers flexible, low-cost services. However, informal workers usually lack social security, pensions and health insurance, and governments lose significant tax revenue.\nPolicy responses vary. Some countries have simplified registration procedures and created special tax regimes for micro-enterprises. Others offer access to credit or training in exchange for formalisation. Economists generally agree that heavy-handed repression is counterproductive, since it destroys livelihoods without creating formal jobs.",
 [["What characterises the informal sector?",["Officially recorded and taxed","Not recorded, taxed or protected","Only large companies","Government jobs"],1,"Not officially recorded, taxed or protected."],["What is one benefit of the informal sector?",["It provides income for millions","It pays high taxes","It offers pensions","It's always legal"],0,"It provides income for millions of people."],["What do informal workers usually lack?",["Customers","Social security and pensions","Skills","Products"],1,"They lack social security, pensions and health insurance."],["Why is repression counterproductive?",["It destroys livelihoods without creating formal jobs","It's too expensive","It's illegal","It creates too many jobs"],0,"It destroys livelihoods without creating formal jobs."]],
 [["vendor","a person who sells"],["revenue","income, money received"],["livelihood","the way someone earns a living"]]],
["b2r05","Can we trust what we see online?","Advances in artificial intelligence have made it possible to create highly realistic fake images, audio and videos, often called 'deepfakes'. While the technology has creative uses in film and education, it also raises serious concerns.\nDeepfakes can be used to spread misinformation, damage reputations or commit fraud. In one widely reported case, criminals imitated a manager's voice to persuade an employee to transfer a large sum of money.\nExperts recommend several strategies: checking the original source, looking for the same news in reliable media, and being cautious with content that provokes strong emotions. Technology companies are also developing tools to detect manipulated media, though detection often lags behind creation.",
 [["What are 'deepfakes'?",["Real news reports","Highly realistic fake media created with AI","Old photos","Cartoons"],1,"Highly realistic fake images, audio and videos."],["How were deepfakes used in the reported case?",["To make a film","To imitate a manager's voice for fraud","To teach a lesson","To sell a product legally"],1,"Criminals imitated a manager's voice."],["Which strategy is recommended?",["Share content quickly","Check the original source","Trust emotional content","Never use the internet"],1,"Checking the original source."],["What does 'detection often lags behind creation' mean?",["Detection tools are faster","Detection tools are slower to develop","Both are equal","Detection is impossible"],1,"Lags behind = is slower than."]],
 [["misinformation","false information"],["fraud","dishonest action to get money"],["cautious","careful"]]],
["b2r06","The return of the tramway","In the twentieth century, many cities removed their tram lines to make space for cars. Today, the tram is making a remarkable comeback. Algiers, Oran, Constantine, Sétif and several other Algerian cities have opened modern tramway lines since 2011.\nSupporters highlight several advantages: trams are electric, quiet, and carry far more passengers than buses. They can also regenerate neighbourhoods, as new shops and housing tend to appear along the lines.\nNevertheless, tram projects are expensive and construction often disrupts businesses for years. Some critics argue that improving bus networks would achieve similar results at a fraction of the cost. The debate reflects a broader question about how cities should balance investment, sustainability and everyday convenience.",
 [["What happened to trams in the 20th century?",["They were expanded","Many were removed for cars","They became free","They were electrified"],1,"Many cities removed their tram lines."],["Which advantage of trams is mentioned?",["They are cheap to build","They carry more passengers than buses","They are faster than planes","They need no electricity"],1,"They carry far more passengers than buses."],["What problem does construction cause?",["It disrupts businesses","It improves sales","It reduces noise","Nothing"],0,"Construction often disrupts businesses."],["What alternative do critics suggest?",["More cars","Improving bus networks","Building airports","Walking only"],1,"Improving bus networks."]],
 [["comeback","a return to popularity"],["regenerate","bring new life to"],["disrupt","interrupt, cause problems"]]],
["b2r07","The ethics of tourism photography","Smartphones have turned almost every traveller into a photographer. But taking pictures of people, especially in traditional communities, raises ethical questions.\nPhotographing someone without permission can feel disrespectful, particularly when people are portrayed as exotic attractions rather than individuals. In some regions, residents have started asking for payment, while others refuse to be photographed altogether.\nResponsible travel organisations suggest simple rules: ask before taking a portrait, respect a refusal, avoid photographing children without parental consent, and consider sharing the photos with the people in them. Some photographers argue that building a relationship first leads not only to more ethical images, but also to better ones.",
 [["What has made almost every traveller a photographer?",["Cheap cameras","Smartphones","Photography schools","Social pressure"],1,"Smartphones."],["Why can photographing people feel disrespectful?",["Photos are expensive","People are portrayed as exotic attractions","Cameras are noisy","It's illegal everywhere"],1,"Portrayed as exotic attractions rather than individuals."],["Which is a suggested rule?",["Always photograph children","Ask before taking a portrait","Never share photos","Use a hidden camera"],1,"Ask before taking a portrait."],["What do some photographers argue?",["Relationships lead to better images","Speed is more important","Ethics don't matter","Portraits should be banned"],0,"Building a relationship leads to more ethical and better images."]],
 [["ethical","morally right"],["consent","permission"],["portray","show, represent"]]],
["b2r08","Microfinance: a success story?","Microfinance provides small loans to people who lack access to traditional banking, often women in rural areas. Its most famous pioneer, Muhammad Yunus, founded the Grameen Bank in Bangladesh and won the Nobel Peace Prize in 2006.\nAdvocates claim that microloans empower borrowers to start businesses and escape poverty. Indeed, early studies reported impressive repayment rates and positive social effects.\nHowever, more rigorous research has produced mixed results. Some borrowers became trapped in debt, especially where interest rates were high. Many economists now conclude that microfinance is a useful tool for managing household finances, but not a miracle solution to poverty. Combining loans with training, savings accounts and insurance appears to be more effective.",
 [["Who does microfinance mainly serve?",["Large companies","People without access to banks","Governments","Rich investors"],1,"People who lack access to traditional banking."],["What did Muhammad Yunus receive in 2006?",["An Olympic medal","The Nobel Peace Prize","A bank","A university degree"],1,"The Nobel Peace Prize in 2006."],["What did rigorous research find?",["Only positive effects","Mixed results","No effects at all","It caused inflation"],1,"More rigorous research has produced mixed results."],["What seems more effective?",["Loans alone","Combining loans with training, savings and insurance","Higher interest rates","Stopping microfinance"],1,"Combining loans with training, savings accounts and insurance."]],
 [["loan","money borrowed"],["empower","give power or confidence"],["rigorous","very careful and exact"]]],
["b2r09","The value of boredom","In a world of constant notifications, boredom has become rare. Whenever we have a free moment, we reach for our phones. Yet some psychologists argue that boredom has an important function.\nIn one study, participants who first completed a boring task, copying numbers from a phone book, later produced more creative ideas than a control group. The researchers suggested that boredom encourages the mind to wander, which can lead to new connections and insights.\nThis does not mean that all boredom is beneficial; chronic boredom is associated with low mood and risky behaviour. But occasionally allowing ourselves to do nothing, without immediately filling the gap with entertainment, may help us think more freely.",
 [["Why has boredom become rare?",["We work more","Constant notifications and phones","We sleep more","Life is exciting"],1,"Whenever we have a free moment, we reach for our phones."],["What did participants copy in the study?",["Poems","Numbers from a phone book","Pictures","Emails"],1,"Copying numbers from a phone book."],["What was the result?",["They became angry","They produced more creative ideas","They slept","They left"],1,"They produced more creative ideas."],["What does the writer say about chronic boredom?",["It's always good","It's linked to low mood and risky behaviour","It makes people rich","It doesn't exist"],1,"Chronic boredom is associated with low mood and risky behaviour."]],
 [["wander","move without a clear direction"],["insight","a deep understanding"],["chronic","lasting a long time"]]],
["b2r10","Languages in Algeria","Algeria is a multilingual country. Arabic and Tamazight are official languages, the latter having been recognised as official in the 2016 constitution. In daily life, most people speak Algerian Arabic (Darja) or one of several Amazigh varieties, such as Kabyle, Chaoui or Tamasheq.\nFrench, a legacy of the colonial period, remains widely used in higher education, business and the media. In recent years, however, English has gained ground, particularly among young people, and the government has introduced English teaching from primary school.\nLinguists note that Algerians frequently switch between languages within a single conversation, a phenomenon known as code-switching. Far from being a sign of poor language skills, it reflects a rich linguistic repertoire and the ability to adapt to different contexts.",

["b2r11","Remote work: here to stay?","Before 2020, remote work was a privilege enjoyed by a minority of employees. The pandemic changed that almost overnight, forcing millions to work from home. Several years later, many organisations have adopted hybrid models.\nProponents point to reduced commuting time, lower office costs and access to a wider talent pool. Some studies even report higher productivity among remote workers, although results vary by task and individual.\nOn the other hand, managers worry about weaker team cohesion, difficulties in training junior staff, and the blurring of boundaries between work and personal life. The emerging consensus is that remote work suits certain tasks better than others, and that clear communication and trust are essential for any arrangement to succeed.",
 [["What was remote work before 2020?",["Very common","A privilege for a minority","Illegal","Unknown"],1,"A privilege enjoyed by a minority."],["What model have many organisations adopted?",["Full office","Hybrid","Full remote only","Four-day week"],1,"Hybrid models."],["Which concern do managers have?",["Lower office costs","Weaker team cohesion","Too much productivity","Shorter commutes"],1,"Weaker team cohesion."],["What is the emerging consensus?",["Remote work fails","Remote work suits some tasks better than others","Everyone should return","It doesn't matter"],1,"Remote work suits certain tasks better than others."]],

["b2r12","The science of motivation","Why do some people persist with difficult goals while others give up? Psychologists distinguish between extrinsic motivation, driven by external rewards like money or grades, and intrinsic motivation, which comes from genuine interest or satisfaction.\nResearch by Edward Deci and Richard Ryan suggests that people are most motivated when three needs are met: autonomy (feeling in control), competence (feeling capable) and relatedness (feeling connected to others). Interestingly, offering rewards for activities people already enjoy can sometimes reduce their intrinsic motivation, an effect known as 'overjustification'.\nFor teachers and managers, the implications are clear: offering choice, giving constructive feedback and fostering a sense of belonging may be more effective in the long term than relying solely on incentives.",
 [["What is extrinsic motivation?",["Coming from genuine interest","Driven by external rewards","Feeling connected","Feeling tired"],1,"Driven by external rewards like money or grades."],["Which is NOT one of the three needs?",["Autonomy","Competence","Relatedness","Wealth"],3,"Wealth is not one of them."],["What is 'overjustification'?",["Rewards can reduce intrinsic motivation","People work harder for money","Teachers give too much homework","Students need more grades"],0,"Rewards for enjoyable activities can reduce intrinsic motivation."],["What is recommended for teachers and managers?",["Only use incentives","Offer choice, feedback and belonging","Remove all feedback","Punish failure"],1,"Offering choice, constructive feedback and a sense of belonging."]],
 [["persist","continue despite difficulty"],["genuine","real, sincere"],["foster","encourage the development of"]]],
["b2r13","Food waste","According to the United Nations, roughly one third of all food produced in the world is lost or wasted. In developing countries, losses mainly occur after harvest and during transport and storage. In wealthier countries, much of the waste happens in shops and households.\nThe consequences extend beyond economics. Wasted food represents wasted water, land and energy, and decomposing food in landfills produces methane, a powerful greenhouse gas.\nSolutions range from better storage facilities for farmers to clearer date labels on products, since many consumers confuse 'best before' with 'use by'. Some cities encourage restaurants and supermarkets to donate surplus food, and apps now connect consumers with unsold meals at reduced prices.",
 [["How much food is lost or wasted globally?",["About 10%","About one third","About half","Almost all"],1,"Roughly one third."],["Where does most waste happen in wealthier countries?",["After harvest","In shops and households","During transport","On farms"],1,"In shops and households."],["Why is food in landfills a problem?",["It produces methane","It attracts tourists","It's too expensive","It creates water"],0,"Decomposing food produces methane."],["What confusion do many consumers have?",["Between 'best before' and 'use by'","Between fruit and vegetables","Between prices","Between shops"],0,"Many consumers confuse 'best before' with 'use by'."]],
 [["landfill","a place where rubbish is buried"],["surplus","an extra amount"],["donate","give for free"]]],
["b2r14","The rise of the gig economy","The gig economy refers to work organised around short-term tasks, often arranged through digital platforms: delivering food, driving passengers, or completing freelance design projects.\nFor workers, gig work offers flexibility and a relatively easy entry into the labour market. For consumers, it provides convenient and often cheap services. Platforms argue that they simply connect independent contractors with clients.\nCritics, however, point out that many gig workers depend on a single platform, earn less than minimum wage once expenses are deducted, and have no sick pay or pension. Courts in several countries have ruled that some drivers and couriers should be classified as employees. The debate centres on how to preserve flexibility while guaranteeing basic protections.",
 [["What is the gig economy?",["Permanent office jobs","Short-term tasks often through digital platforms","Government jobs","Music concerts"],1,"Work organised around short-term tasks through platforms."],["What do platforms argue?",["They employ everyone","They simply connect contractors with clients","They pay pensions","They are charities"],1,"They simply connect independent contractors with clients."],["Which criticism is mentioned?",["Workers earn too much","Workers have no sick pay or pension","The work is too slow","Customers pay too much"],1,"No sick pay or pension."],["What have some courts decided?",["Platforms must close","Some workers should be classified as employees","Gig work is illegal","Nothing"],1,"Some drivers and couriers should be classified as employees."]],

["b2r15","Bejaia and the history of numbers","In the late twelfth century, Bejaia (then known as Bugia) was a thriving Mediterranean port and a centre of trade and learning. It was there that a young Italian, Leonardo of Pisa, later known as Fibonacci, accompanied his father, a customs official.\nIn Bejaia, Fibonacci is believed to have studied Hindu-Arabic numerals and methods of calculation taught by local scholars. In 1202, he published Liber Abaci, a book that introduced these numerals and their practical applications to European merchants.\nThe new system, including the use of zero and place value, gradually replaced Roman numerals and transformed commerce, accounting and science in Europe. Today, Bejaia commemorates this heritage, a reminder of the role North Africa played in the transmission of knowledge.",
 [["What was Bejaia in the late 12th century?",["A small village","A thriving port and centre of learning","A desert oasis","A Roman capital"],1,"A thriving Mediterranean port and a centre of trade and learning."],["Why was Fibonacci in Bejaia?",["He was a soldier","He accompanied his father, a customs official","He was a tourist","He was born there"],1,"He accompanied his father, a customs official."],["What did Liber Abaci introduce to Europe?",["Roman numerals","Hindu-Arabic numerals","The alphabet","Paper money"],1,"It introduced these numerals to European merchants."],["What did the new system include?",["Zero and place value","Letters only","Symbols for gods","Nothing new"],0,"Including the use of zero and place value."]],
 [["thriving","very successful, growing"],["merchant","a trader"],["commemorate","remember and honour"]]],
["b2r16","Should university be free?","In Algeria, public higher education is essentially free, whereas in countries such as the United States and the United Kingdom, students often graduate with substantial debt. The question of who should pay for university education is hotly debated.\nSupporters of free tuition argue that education is a public good: graduates contribute to society through their work, taxes and innovation. Free access, they claim, promotes equality of opportunity.\nOpponents counter that free tuition is costly for taxpayers and can lead to overcrowded classrooms and underfunded facilities. Some also argue that it disproportionately benefits wealthier families, whose children are more likely to attend university anyway. Many countries seek a middle path, combining low fees with grants and income-contingent loans.",
 [["What is the situation in Algeria?",["Public higher education is essentially free","Universities are very expensive","There are no universities","Only private universities exist"],0,"Public higher education is essentially free."],["What do supporters of free tuition argue?",["Education is a public good","Universities should close","Students should pay more","Only rich should study"],0,"Education is a public good."],["What is one argument against free tuition?",["It reduces equality","It can lead to overcrowded classrooms","It's too cheap","Students study too much"],1,"Overcrowded classrooms and underfunded facilities."],["What is the 'middle path'?",["Very high fees","Low fees with grants and income-contingent loans","No universities","Free everything"],1,"Combining low fees with grants and income-contingent loans."]],
 [["tuition","teaching, or the fees for it"],["substantial","large"],["income-contingent","depending on how much you earn"]]],
["b2r17","Desert architecture","Long before air conditioning, the inhabitants of the Sahara developed ingenious ways to stay cool. In the M'zab valley, houses are built close together, creating narrow, shaded streets. Thick walls of stone and lime absorb heat during the day and release it slowly at night.\nInternal courtyards allow hot air to rise and escape, while small openings limit direct sunlight. Rooftop terraces are used for sleeping on summer nights. The traditional system of water distribution, known as foggaras, carried groundwater through underground channels to the palm groves.\nToday, architects worldwide study these techniques for inspiration in designing energy-efficient buildings. In an era of rising temperatures, vernacular architecture offers lessons that modern construction has too often ignored.",
 [["How do narrow streets help?",["They create shade","They allow cars","They attract tourists","They save land"],0,"Creating narrow, shaded streets."],["What do thick walls do?",["Let in light","Absorb heat by day and release it at night","Make noise","Collect water"],1,"Absorb heat during the day and release it slowly at night."],["What are foggaras?",["Rooftop terraces","Underground water channels","Types of palm trees","Markets"],1,"Carried groundwater through underground channels."],["Why do modern architects study these techniques?",["For energy-efficient buildings","To build skyscrapers","For decoration only","To sell houses"],0,"For inspiration in designing energy-efficient buildings."]],
 [["ingenious","clever and original"],["courtyard","an open space inside a building"],["vernacular","traditional to a place"]]],
["b2r18","The attention economy","Most free digital services are funded by advertising, which means their business model depends on capturing and holding our attention. Every additional minute spent on an app generates data and advertising revenue.\nTo maximise engagement, designers use techniques inspired by behavioural psychology: infinite scrolling, autoplay, notifications and variable rewards, similar to those used in slot machines. Former tech employees have publicly expressed concern about the consequences for mental health and concentration.\nIn response, some governments are considering regulations, while users are turning to 'digital minimalism': deleting unnecessary apps, disabling notifications and setting time limits. The challenge, as one critic put it, is that 'if you're not paying for the product, you are the product.'",
 [["How are most free digital services funded?",["By governments","By advertising","By donations","By users paying"],1,"Funded by advertising."],["Which design technique is mentioned?",["Infinite scrolling","Paper manuals","Slow loading","Black screens"],0,"Infinite scrolling, autoplay, notifications and variable rewards."],["What is 'digital minimalism'?",["Using more apps","Reducing unnecessary digital use","Buying cheaper phones","Working in tech"],1,"Deleting unnecessary apps, disabling notifications, setting time limits."],["What does 'you are the product' mean?",["Users are sold as products in shops","Users' attention and data are what is sold","Users must pay","Users design the apps"],1,"If you don't pay, your attention/data is what is sold."]],
 [["engagement","how much users interact"],["regulation","an official rule"],["slot machine","a gambling machine"]]],
["b2r19","Climate migration","Climate change is increasingly cited as a driver of migration. Rising sea levels threaten coastal communities, while droughts and desertification undermine agriculture in regions such as the Sahel.\nHowever, researchers caution against simplistic narratives. Migration is usually the result of multiple factors, economic, political and social, and environmental stress often acts as a 'threat multiplier' rather than a single cause. Moreover, most climate-related movement is internal, from rural areas to cities within the same country, rather than international.\nInternational law does not currently recognise 'climate refugees' as a legal category, which leaves many displaced people without specific protection. Policymakers are debating how to adapt legal frameworks, while also investing in adaptation measures that could allow people to remain in their homes.",
 [["Which effect of climate change is mentioned?",["Rising sea levels","More snow everywhere","Cheaper food","Fewer storms"],0,"Rising sea levels threaten coastal communities."],["What do researchers caution against?",["Simplistic narratives","Studying migration","International law","Agriculture"],0,"Caution against simplistic narratives."],["Where does most climate-related movement happen?",["Between continents","Within the same country","To Europe only","To islands"],1,"Most is internal, within the same country."],["What is the legal status of 'climate refugees'?",["Fully recognised","Not currently recognised as a legal category","Banned","Same as tourists"],1,"International law does not currently recognise them."]],
 [["driver","a cause"],["undermine","make weaker"],["displaced","forced to leave home"]]],
["b2r20","Learning from failure","Many successful entrepreneurs describe failure as their best teacher. The inventor Thomas Edison is often quoted as saying that he had not failed, but had found ten thousand ways that didn't work.\nResearch supports the idea that failure can foster learning, but only under certain conditions. People learn more from failure when they analyse what went wrong without excessive self-blame, and when their environment does not punish mistakes harshly. Organisations with 'psychological safety', where employees feel safe to admit errors, tend to innovate more.\nNevertheless, glorifying failure has its own risks. Not every failure is instructive, and repeated failures can have serious financial and emotional costs. The key, experts argue, is to fail early, fail cheaply and, above all, reflect carefully.",
 [["How do many entrepreneurs describe failure?",["As shameful","As their best teacher","As impossible","As boring"],1,"Failure as their best teacher."],["When do people learn most from failure?",["When they blame themselves heavily","When they analyse calmly in a safe environment","When they ignore it","When they are punished"],1,"Analyse without excessive self-blame, in a non-punishing environment."],["What is 'psychological safety'?",["Safety equipment","Feeling safe to admit errors","Insurance","Strict rules"],1,"Where employees feel safe to admit errors."],["What do experts advise?",["Fail often and expensively","Fail early, fail cheaply and reflect","Never take risks","Hide failures"],1,"Fail early, fail cheaply and reflect carefully."]],
 [["entrepreneur","a person who starts businesses"],["harshly","very severely"],["instructive","teaching something useful"]]]
