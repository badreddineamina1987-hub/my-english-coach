const CK_B2=["My introduction states the topic and my position clearly.","Each paragraph has a topic sentence and supporting examples.","I used a range of advanced structures (passives, conditionals, relative clauses).","I used formal linking words (moreover, nevertheless, consequently).","My conclusion summarises without repeating word for word."];
addWrites("B2",[
["b2w01","Essay: social media and democracy","'Social media has done more harm than good to public debate.' To what extent do you agree?",250,["It is often argued that…","There is little doubt that…","Admittedly,…","Nevertheless,…","On balance, I would argue that…"],"It is often argued that social media has damaged public debate by spreading misinformation and dividing societies. While there is some truth in this claim, I would argue that the picture is more complex.\nThere is little doubt that social media platforms have amplified false information. Algorithms tend to reward content that provokes strong emotions, which means that sensational or misleading posts often spread faster than careful analysis. Moreover, users are increasingly exposed only to opinions that confirm their own beliefs.\nAdmittedly, these problems are serious. Nevertheless, social media has also given a voice to groups that were previously excluded from traditional media. Citizens can now document injustice, organise campaigns and question official narratives in real time.\nOn balance, I would argue that social media is a tool whose impact depends on how it is regulated and used. Rather than rejecting it, societies should invest in media literacy and demand greater transparency from technology companies.",CK_B2],
["b2w02","Formal report: improving public transport","Your city council has asked residents to write a report on public transport, describing current problems and recommending improvements.",220,["Introduction: The purpose of this report is to…","Current situation","It was found that…","Recommendations","It is strongly recommended that…"],"Introduction\nThe purpose of this report is to assess the current state of public transport in our city and to propose practical improvements.\nCurrent situation\nIt was found that buses are frequently overcrowded during peak hours, particularly on routes serving the university and the industrial zone. Furthermore, timetables are not displayed at most stops, and many vehicles are old and not accessible to people with disabilities. The tramway is popular but covers only a limited area.\nRecommendations\nIt is strongly recommended that the council increase bus frequency during peak hours and introduce a mobile app with real-time information. In addition, accessible vehicles should gradually replace the oldest buses. Extending the tramway towards the new residential districts would also reduce car use.\nConclusion\nIf these measures were implemented, public transport would become a more reliable and attractive alternative to private cars.",[...CK_B2.slice(2),"I used headings and an impersonal style."]],
["b2w03","Cover letter for a competitive position","Write a cover letter applying for a graduate trainee position at an international company.",220,["I am writing to express my strong interest in…","Having completed…","During my internship at…, I…","I am particularly drawn to…","I would welcome the opportunity to…"],"Dear Hiring Manager,\nI am writing to express my strong interest in the Graduate Trainee Programme advertised on your website.\nHaving completed a Master's degree in International Business at the University of Algiers 3, I have developed a solid understanding of market analysis and cross-cultural management. During my six-month internship at a logistics company, I coordinated communication between suppliers in three countries and contributed to a project that reduced delivery times by twelve per cent.\nI am particularly drawn to your company's commitment to sustainable growth in Africa, an area in which I wrote my thesis. I am fluent in Arabic, French and English, and I am currently learning Spanish.\nI am confident that my analytical skills, adaptability and motivation would allow me to make a valuable contribution to your team. I would welcome the opportunity to discuss my application further.\nYours sincerely,\nSelma Bouabdallah",[...CK_B2.slice(2),"I gave specific, measurable achievements."]],
["b2w04","Article: the city of the future","Write an article for a magazine describing what cities might look like in 2050 and what should change now.",230,["Imagine waking up in…","By 2050, cities will have…","It is likely that…","However, this future will only be possible if…","The choices we make today…"],"Imagine waking up in a city where the streets are quiet, the air is clean and your morning commute takes ten minutes on foot. This may sound utopian, but many urban planners believe it is achievable by 2050.\nBy then, cities will probably have replaced many roads with green corridors and cycle lanes. It is likely that most vehicles will be electric and shared, reducing the need for parking. Buildings may produce their own energy through solar panels and recycle their water.\nHowever, this future will only be possible if we act now. Governments must invest in public transport rather than new motorways, and new neighbourhoods should be designed so that schools, shops and clinics are within walking distance.\nThe choices we make today will determine whether our grandchildren inherit cities designed for people or for cars.",CK_B2],
["b2w05","Discursive essay: university education should be practical","'Universities should focus on preparing students for employment rather than on academic knowledge.' Discuss both views and give your opinion.",250,["This issue has sparked considerable debate.","Proponents of this view maintain that…","By contrast, others contend that…","While I acknowledge that…, I believe…","In conclusion,…"],"The role of universities has sparked considerable debate in recent years, particularly as youth unemployment remains high in many countries.\nProponents of a practical focus maintain that universities have a responsibility to equip graduates with skills that employers need. Many graduates, they argue, leave university with theoretical knowledge but little experience of teamwork, project management or digital tools, which makes the transition to work difficult.\nBy contrast, others contend that the purpose of higher education is broader than employment. Universities should develop critical thinking, curiosity and the ability to understand complex problems, qualities which cannot be reduced to job-specific skills and which remain valuable as the job market changes.\nWhile I acknowledge that graduates need practical preparation, I believe that the two aims are not mutually exclusive. Internships, project-based learning and partnerships with companies can be integrated into academic programmes without sacrificing intellectual depth.\nIn conclusion, the best universities will be those that combine rigorous knowledge with meaningful opportunities to apply it.",CK_B2],
["b2w06","Proposal: a mentoring programme","Write a proposal to your university director suggesting a mentoring programme between senior and first-year students.",220,["Aim","Background","Proposed programme","Expected benefits","I would therefore propose that…"],"Aim\nThis proposal outlines a peer-mentoring programme designed to help first-year students adapt to university life.\nBackground\nA recent survey in our faculty showed that nearly forty per cent of first-year students feel lost during their first semester, and many struggle with time management and academic writing.\nProposed programme\nEach first-year student would be paired with a volunteer from the third or fourth year. Mentors would meet their mentees twice a month to discuss study methods, explain administrative procedures and share advice. Mentors would receive a short training session and a certificate recognising their contribution.\nExpected benefits\nThe programme would improve the integration and results of new students, while allowing senior students to develop leadership and communication skills. It would require minimal funding, as it relies on volunteers.\nI would therefore propose that a pilot version be launched next semester in one department and evaluated at the end of the year.",[...CK_B2.slice(2),"I used headings and a persuasive tone."]],
["b2w07","Review: a book that changed your thinking","Write a review of a book (fiction or non-fiction) that changed the way you think.",220,["Few books have influenced me as much as…","At its core, the book explores…","What makes it particularly compelling is…","That said,…","I would wholeheartedly recommend it to…"],"Few books have influenced me as much as 'Thinking, Fast and Slow' by Daniel Kahneman. At its core, the book explores the two systems that drive the way we think: a fast, intuitive system and a slow, analytical one.\nWhat makes it particularly compelling is the way Kahneman uses simple experiments to reveal how often our intuitions mislead us. After reading it, I became more aware of my own biases, for instance my tendency to judge situations based on first impressions or on the most recent information I had heard.\nThat said, the book is long and some chapters are quite technical, which may discourage casual readers. It is not a book to read in one sitting, but one to return to.\nI would wholeheartedly recommend it to anyone interested in psychology, economics or simply in making better decisions.",CK_B2],
["b2w08","Formal complaint with escalation","You have already complained twice to an internet provider without result. Write a firm but polite final complaint before taking further action.",220,["I am writing for the third time regarding…","Despite assurances that…","This situation has caused…","Unless the matter is resolved by…, I will have no choice but to…","I trust that…"],"Dear Customer Service Manager,\nI am writing for the third time regarding the repeated interruptions to my internet connection (account number 458 211), which began on 2 October.\nDespite assurances from your technical team on 7 and 15 October that the problem would be resolved within 48 hours, the connection continues to drop several times a day. As I work from home, this situation has caused me considerable professional difficulties, including missed online meetings with clients.\nI would like to request that a technician visit my home within the next five working days and that I receive a refund for the period during which the service has not been provided as agreed.\nUnless the matter is resolved by 10 November, I will have no choice but to cancel my contract and refer the case to the consumer protection authority.\nI trust that you will give this matter your urgent attention.\nYours sincerely,\nMourad Kaci",[...CK_B2.slice(2),"I included dates, facts and a clear deadline."]],
["b2w09","Opinion: should voting be compulsory?","Write an opinion essay: Should voting be compulsory?",240,["Voter turnout has been declining…","Advocates of compulsory voting argue…","Opponents raise a fundamental objection:…","Weighing these arguments,…","Ultimately,…"],"Voter turnout has been declining in many democracies, leading some to propose that voting should be made compulsory, as it already is in countries such as Australia and Belgium.\nAdvocates of compulsory voting argue that it produces governments that better reflect the whole population, not just the most motivated or privileged groups. When everyone votes, they claim, politicians must address the concerns of all citizens, including young and disadvantaged people.\nOpponents raise a fundamental objection: in a free society, the right to vote should also include the right not to vote. Forcing reluctant citizens to the polls might also lead to random or uninformed choices, which would not necessarily improve the quality of democracy.\nWeighing these arguments, I believe that encouraging participation is preferable to compulsion. Measures such as civic education, easier registration and the option to vote online could raise turnout without restricting freedom.\nUltimately, a healthy democracy depends less on the obligation to vote than on citizens' belief that their vote matters.",CK_B2],
["b2w10","Data commentary","Describe and comment on these figures: Internet users in a country (% of population): 2010: 12%, 2015: 38%, 2020: 63%, 2024: 77%. Mobile internet share of all connections: 2010: 5%, 2024: 92%.",200,["The data illustrate…","The proportion rose steadily / dramatically from … to…","A particularly striking feature is…","This trend can be attributed to…","It remains to be seen whether…"],"The data illustrate the rapid growth of internet use in the country between 2010 and 2024.\nThe proportion of the population using the internet rose dramatically from just 12% in 2010 to 38% in 2015, more than tripling in five years. Growth continued at a steady pace, reaching 63% in 2020 and 77% in 2024.\nA particularly striking feature is the shift towards mobile connections. Whereas only 5% of connections were mobile in 2010, this figure had soared to 92% by 2024, indicating that most people now access the internet primarily through their smartphones.\nThis trend can probably be attributed to the falling cost of smartphones and the expansion of mobile networks. It remains to be seen whether the remaining quarter of the population, likely concentrated in rural areas, will be connected in the coming years.",[...CK_B2.slice(2),"All my figures match the data exactly."]],
["b2w11","Narrative: a difficult decision","Write a story about a character who must make a difficult decision. Use a range of narrative tenses.",240,["Little did she know that…","Had she known…","By the time…, she had already…","No sooner had… than…","In the end,…"],"Little did Yasmine know that a single email would change the course of her life. She had been working as a pharmacist in Tlemcen for six years when she received an offer to join a research laboratory in Montreal.\nIt was the opportunity she had dreamed of since university. Yet her father had fallen ill the previous winter, and she was the only one of his children still living nearby. Had she received the offer a year earlier, she would have accepted without hesitation.\nFor two weeks, she hardly slept. By the time the deadline approached, she had already written two replies, one accepting and one refusing, and had deleted both. No sooner had she mentioned the offer to her father than he took her hand. 'I raised you to fly,' he said, 'not to stay in the nest.'\nIn the end, she negotiated a later starting date, arranged care for her father with her brother, and promised to visit every summer. Three years later, her name appears on a published study, and her father keeps a copy by his bed.",[...CK_B2.slice(2),"I used inversion or past perfect for dramatic effect."]],
["b2w12","Email to a professor: requesting supervision","Write a formal email to a professor asking them to supervise your master's thesis.",200,["I am writing to enquire whether you would be willing to…","I have long been interested in…","My proposed research would examine…","I have attached…","I would be grateful for the opportunity to…"],"Dear Professor Benali,\nI am a second-year master's student in Applied Economics, and I am writing to enquire whether you would be willing to supervise my thesis next semester.\nI have long been interested in your work on youth entrepreneurship in Algeria, particularly your recent article on the determinants of business survival. My proposed research would examine the role of digital platforms in helping young entrepreneurs access customers outside their region, using a survey of around 200 small businesses.\nI have attached a two-page outline of the project and my academic transcript. I would be grateful for the opportunity to discuss the proposal with you during your office hours, at a time convenient for you.\nThank you very much for considering my request.\nYours sincerely,\nAnis Medjahed",[...CK_B2.slice(2),"I was respectful, specific and concise."]],
["b2w13","Essay: advertising aimed at children","'Advertising aimed at children should be banned.' Discuss.",240,["Children are exposed to…","Critics argue that…","It could be argued, however, that…","A more balanced approach would be…","To conclude,…"],"Children today are exposed to advertising not only on television but also on video platforms, games and social media, often in forms that are difficult to distinguish from entertainment.\nCritics argue that young children cannot fully understand the persuasive intent of advertisements and are therefore easily manipulated. Advertising for unhealthy food has been linked to rising childhood obesity, while constant promotion of toys and gadgets can create pressure on families with limited incomes.\nIt could be argued, however, that a complete ban would be difficult to enforce, particularly online, and that it would reduce funding for quality children's programmes. Some also believe that parents, rather than governments, should be responsible for what their children watch.\nA more balanced approach would be to ban advertising of unhealthy products to children under a certain age, require clear labelling of sponsored content and teach media literacy in schools.\nTo conclude, while a total ban may be unrealistic, stronger regulation is clearly justified to protect children from manipulative marketing.",CK_B2],
["b2w14","Summary and response","Summarise the main argument of a text you read about remote work (see Reading: 'Remote work: here to stay?') in about 80 words, then give your own response.",200,["The article argues that…","According to the author,…","While the author makes a valid point about…, I…","From my own experience,…","Therefore,…"],"The article argues that remote work, which became widespread during the pandemic, has evolved into hybrid models. According to the author, it offers clear benefits, including less commuting, lower costs and access to more talent, but it also creates challenges for team cohesion, training and work-life balance. The author concludes that its success depends on the type of task and on communication and trust.\nWhile the author makes a valid point about the importance of trust, I believe the article underestimates the inequality between workers. From my own experience, remote work is much easier for those with a quiet home and a fast connection, whereas young employees living with large families often struggle to concentrate. Therefore, companies that adopt hybrid models should provide equipment, co-working allowances or flexible office access, so that remote work does not become a privilege for some and a burden for others.",[...CK_B2.slice(2),"My summary is neutral and my response is clearly separated."]],
["b2w15","Speech: welcoming new students","Write a short speech to welcome new international students to your university.",200,["Good morning, everyone, and welcome to…","It is a great pleasure to…","You may be feeling…","Don't hesitate to…","I wish you…"],"Good morning, everyone, and welcome to the University of Boumerdès.\nIt is a great pleasure to welcome students from twelve different countries this year. Your presence enriches our campus, and we are proud that you have chosen to study with us.\nYou may be feeling excited, but perhaps also a little anxious. A new country, a new language and new academic expectations can be challenging. Please remember that this is completely normal, and that you are not alone. Our international office, student associations and teaching staff are here to support you.\nDon't hesitate to ask questions, to join clubs and to explore the region. Algeria has a remarkable history, delicious food and generous people, and some of your most valuable lessons will happen outside the classroom.\nI wish you a successful year, full of discoveries and new friendships. Welcome, and thank you.",[...CK_B2.slice(2),"My tone is warm, clear and suitable for speaking aloud."]],
["b2w16","Problem-solution essay: youth unemployment","Write an essay discussing the causes of youth unemployment and possible solutions.",250,["One of the most pressing challenges…","A key cause is…","This is compounded by…","One possible solution would be…","If these measures were combined,…"],"One of the most pressing challenges facing many countries, including Algeria, is youth unemployment, particularly among university graduates.\nA key cause is the mismatch between the skills taught in universities and the needs of the labour market. Many graduates specialise in fields with limited job openings, while sectors such as technology, renewable energy and skilled trades struggle to recruit. This is compounded by an economy that relies heavily on the public sector and on a small number of industries.\nOne possible solution would be to strengthen links between universities and employers through internships, apprenticeships and curriculum advisory boards. Another would be to support entrepreneurship by simplifying business registration, offering micro-credit and providing mentoring for young founders. Vocational training, which is still often undervalued, should also be promoted as a respected path to stable employment.\nIf these measures were combined with broader economic diversification, young people would have more opportunities to contribute their talents. Tackling youth unemployment is therefore not only an economic necessity but an investment in social stability.",CK_B2],
["b2w17","Formal email: responding to feedback","You organised a conference, and some participants sent critical feedback. Write a professional reply acknowledging the issues and explaining what you will change.",200,["Thank you for taking the time to…","We sincerely regret that…","We have taken note of…","In response, we will…","We hope to have the opportunity to welcome you…"],"Dear Dr Larbi,\nThank you for taking the time to share your feedback on the International Conference on Sustainable Development held on 14–15 May.\nWe sincerely regret that the sessions on the second day started late and that some presenters had insufficient time for questions. We have also taken note of your comments regarding the lack of vegetarian options at lunch and the difficulty of finding information about the programme online.\nIn response, we will appoint a dedicated session chair to manage timing more strictly, publish the full programme two weeks in advance on a single web page, and ensure that the catering includes a wider range of options.\nYour suggestions are extremely valuable in helping us improve. We hope to have the opportunity to welcome you to next year's conference.\nKind regards,\nThe Organising Committee",[...CK_B2.slice(2),"I acknowledged each problem and gave concrete actions."]],
["b2w18","Essay: preserving traditional crafts","Some people believe traditional crafts will disappear in the modern economy. What can be done to preserve them, and is it worth it?",240,["Across the world, traditional crafts…","It is undeniable that…","Yet these crafts embody…","Measures that could help include…","In my view, the effort is worthwhile because…"],"Across the world, traditional crafts such as pottery, weaving and jewellery-making are under threat. In Algeria, the carpets of Ghardaïa, the silver jewellery of Beni Yenni and the pottery of Kabylie are produced by fewer artisans each year.\nIt is undeniable that mass-produced goods are cheaper and more readily available, and young people often prefer careers that offer higher and more stable incomes. As a result, many skills passed down through generations risk being lost.\nYet these crafts embody far more than economic value. They carry cultural identity, local history and a form of knowledge that cannot be easily recorded in books.\nMeasures that could help include creating certification labels for authentic products, integrating craft training into vocational education, and using e-commerce to connect artisans directly with international buyers. Tourism, if managed responsibly, can also provide a steady market.\nIn my view, the effort is worthwhile because a society that loses its crafts loses part of its memory. Preserving them is an investment in both heritage and sustainable local economies.",CK_B2],
["b2w19","Reflective essay: what I have learned","Write a reflective essay about how learning English (or another skill) has changed you.",220,["When I first started…, I…","Over time, I came to realise that…","Perhaps the most significant change has been…","Looking back,…","Moving forward, I intend to…"],"When I first started learning English seriously, I saw it simply as a requirement for my studies. I memorised word lists before exams and forgot them soon afterwards.\nOver time, I came to realise that a language is not a subject but a door. Reading articles in English gave me access to research I could not find in other languages, and online discussions connected me with students from Brazil, India and Nigeria who shared my interests.\nPerhaps the most significant change has been in my confidence. The first time I gave a presentation in English, my voice was shaking. Today, I can express disagreement politely, ask for clarification and even make jokes, which I once thought impossible.\nLooking back, I also learned patience. Progress was rarely visible from one day to the next, but it was undeniable over months.\nMoving forward, I intend to reach a C1 level, to read one novel in English each month and, eventually, to help younger students discover that door for themselves.",CK_B2],
["b2w20","IELTS-style Task 2: technology and relationships","'Modern technology has made people more isolated, not more connected.' To what extent do you agree or disagree?",250,["It is widely claimed that…","On the one hand, it cannot be denied that…","On the other hand,…","Having considered both sides,…","In conclusion, I partly / strongly agree…"],"It is widely claimed that, despite being constantly connected online, people today are lonelier than ever. I partly agree with this view, although I believe technology itself is not the main cause.\nOn the one hand, it cannot be denied that some uses of technology can isolate people. Many individuals spend hours scrolling through social media, which may replace face-to-face interaction. Studies have linked heavy social media use to feelings of loneliness and anxiety, especially among teenagers, who may compare their lives unfavourably with idealised images of others.\nOn the other hand, technology has also created new forms of connection. Families separated by migration can see each other daily through video calls, and people with rare illnesses or specific interests can find supportive communities that do not exist locally. During the pandemic, digital tools allowed millions to continue working, studying and maintaining friendships.\nHaving considered both sides, I would argue that the outcome depends largely on how technology is used. When it replaces real relationships, it can deepen isolation; when it supports and organises them, it strengthens connection.\nIn conclusion, I partly agree with the statement, but I believe the solution lies in using technology more consciously rather than rejecting it.",CK_B2]

addStories("B2",[
["b2s01","The Translator",[
 ["For twenty years, Nadia had translated other people's words without ever writing her own.","طوال عشرين عامًا، كانت نادية تترجم كلمات الآخرين دون أن تكتب كلماتها الخاصة أبدًا."],
 ["She was known in the publishing world for her precision and her invisibility.","كانت معروفة في عالم النشر بدقتها وبقائها في الظل."],
 ["Readers praised the novels she translated, rarely noticing her name on the cover.","كان القراء يمدحون الروايات التي ترجمتها، ونادرًا ما لاحظوا اسمها على الغلاف."],
 ["One evening, while working on a particularly difficult passage, she found herself writing a sentence that did not exist in the original.","في إحدى الأمسيات، وبينما كانت تعمل على مقطع صعب بشكل خاص، وجدت نفسها تكتب جملة لا وجود لها في النص الأصلي."],
 ["She deleted it immediately, but the sentence stayed in her mind for days.","حذفتها على الفور، لكن الجملة بقيت في ذهنها لأيام."],
 ["Eventually, she opened a new document and wrote it down again.","في النهاية، فتحت مستندًا جديدًا وكتبتها مرة أخرى."],
 ["That sentence became a paragraph, then a chapter, then a book about her grandmother's life in the Aurès mountains.","أصبحت تلك الجملة فقرة، ثم فصلًا، ثم كتابًا عن حياة جدتها في جبال الأوراس."],
 ["When the manuscript was accepted, the editor asked who would translate it into French.","عندما قُبلت المخطوطة، سأل المحرر من سيترجمها إلى الفرنسية."],
 ["Nadia smiled for the first time in weeks.","ابتسمت نادية لأول مرة منذ أسابيع."],
 ["\"For once,\" she said, \"I would like someone else to find my words.\"","قالت: \"لمرة واحدة، أود أن يجد شخص آخر كلماتي.\""]],
 [["What was Nadia known for?",["Writing bestsellers","Precision and invisibility as a translator","Teaching","Editing newspapers"],1,"Known for her precision and her invisibility."],["What was her book about?",["Her career","Her grandmother's life in the Aurès","A love story in Paris","Translation techniques"],1,"A book about her grandmother's life in the Aurès mountains."],["What does her final sentence suggest?",["She wanted to translate it herself","She wanted someone else to translate her work","She refused publication","She stopped writing"],1,"I would like someone else to find my words."]]],
["b2s02","The Inheritance",[
 ["When their father died, the three brothers inherited an old olive grove on a dry hillside.","عندما توفي والدهم، ورث الإخوة الثلاثة بستان زيتون قديمًا على تلة جافة."],
 ["The eldest wanted to sell it to a developer who had offered a considerable sum.","أراد الأكبر أن يبيعه لمطوّر عقاري عرض مبلغًا كبيرًا."],
 ["The second suggested cutting down the trees and building holiday homes.","اقترح الثاني قطع الأشجار وبناء منازل لقضاء العطل."],
 ["The youngest, who had studied agronomy, asked for one year before they made any decision.","أما الأصغر، الذي درس الهندسة الزراعية، فطلب سنة واحدة قبل اتخاذ أي قرار."],
 ["Reluctantly, they agreed.","وافقوا على مضض."],
 ["He installed a drip irrigation system, pruned the trees and contacted a cooperative of organic producers.","ركّب نظام ري بالتنقيط، وقلّم الأشجار، واتصل بتعاونية لمنتجي الزراعة العضوية."],
 ["By the following autumn, the grove had produced an oil of exceptional quality.","بحلول الخريف التالي، أنتج البستان زيتًا ذا جودة استثنائية."],
 ["It won a regional prize, and orders arrived from as far away as Germany.","فاز بجائزة جهوية، ووصلت الطلبات من أماكن بعيدة مثل ألمانيا."],
 ["The eldest brother, who had insisted on selling, quietly withdrew his objection.","سحب الأخ الأكبر، الذي كان قد أصرّ على البيع، اعتراضه بهدوء."],
 ["Their father, they realised, had left them not just land, but a choice about what kind of future to grow.","أدركوا أن والدهم لم يترك لهم أرضًا فحسب، بل خيارًا حول نوع المستقبل الذي يريدون أن يزرعوه."]],
 [["What did the eldest brother want?",["To keep the grove","To sell it to a developer","To build homes","To plant new trees"],1,"Sell it to a developer."],["What did the youngest do?",["Sold the land","Modernised irrigation and joined an organic cooperative","Moved to Germany","Built holiday homes"],1,"Installed drip irrigation, pruned trees, contacted a cooperative."],["What did the brothers realise?",["Their father was rich","Their father left them a choice about the future","Olive oil is cheap","Land should always be sold"],1,"Not just land, but a choice about what kind of future to grow."]]],
["b2s03","The Algorithm",[
 ["Reda had designed the recommendation algorithm that millions of people used every day.","كان رضا قد صمّم خوارزمية التوصيات التي يستخدمها الملايين كل يوم."],
 ["It suggested videos so accurately that users rarely closed the app.","كانت تقترح مقاطع الفيديو بدقة كبيرة لدرجة أن المستخدمين نادرًا ما كانوا يغلقون التطبيق."],
 ["His company celebrated each new record of time spent on the platform.","كانت شركته تحتفل بكل رقم قياسي جديد للوقت الذي يقضيه الناس على المنصة."],
 ["One evening, he visited his sister and found his teenage nephew staring at a screen at two in the morning.","في إحدى الأمسيات، زار أخته فوجد ابن أخته المراهق يحدّق في الشاشة في الثانية صباحًا."],
 ["The boy looked exhausted, yet he kept scrolling, unable to stop.","كان الفتى يبدو منهكًا، ومع ذلك ظل يمرر الشاشة، عاجزًا عن التوقف."],
 ["Reda recognised the interface immediately: it was his own creation.","تعرّف رضا على الواجهة على الفور: كانت من صنعه."],
 ["For the first time, the numbers he had been so proud of had a face.","لأول مرة، أصبح للأرقام التي كان فخورًا بها وجه."],
 ["The next morning, he proposed a feature that would remind users to take breaks.","في صباح اليوم التالي، اقترح ميزة تذكّر المستخدمين بأخذ استراحات."],
 ["His managers hesitated, worried about the impact on profits.","تردد مديروه، قلقين من تأثير ذلك على الأرباح."],
 ["Reda insisted, and when the feature launched, he felt that he had finally designed something he could be proud of.","أصرّ رضا، وعندما أُطلقت الميزة، شعر أنه صمّم أخيرًا شيئًا يمكن أن يفخر به."]],
 [["What had Reda designed?",["A game","A recommendation algorithm","A phone","A website for news"],1,"The recommendation algorithm."],["What made him change his mind?",["A newspaper article","Seeing his exhausted nephew scrolling","A lawsuit","His salary"],1,"He found his teenage nephew staring at a screen at two in the morning."],["Why did his managers hesitate?",["The feature was too expensive to build","They worried about profits","They didn't understand it","Users asked for it"],1,"Worried about the impact on profits."]]],
["b2s04","The Exam Room",[
 ["Mr Haddad had supervised exams for thirty years, and he could recognise cheating from across the room.","كان السيد حداد يراقب الامتحانات منذ ثلاثين عامًا، وكان بإمكانه أن يكتشف الغش من الطرف الآخر للقاعة."],
 ["That morning, he noticed a student repeatedly glancing at her sleeve.","في ذلك الصباح، لاحظ طالبة تنظر مرارًا إلى كمّها."],
 ["He walked over slowly, expecting to find notes hidden there.","مشى نحوها ببطء، متوقعًا أن يجد أوراقًا مخبأة هناك."],
 ["Instead, he found a small bandage covering a burn.","بدلًا من ذلك، وجد ضمادة صغيرة تغطي حرقًا."],
 ["She whispered that she had burned her wrist while cooking for her younger siblings that morning.","همست بأنها أحرقت معصمها وهي تطبخ لإخوتها الصغار ذلك الصباح."],
 ["Her mother worked night shifts at the hospital, so she took care of the house before every exam.","كانت أمها تعمل في نوبات ليلية في المستشفى، لذلك كانت تهتم بالبيت قبل كل امتحان."],
 ["Mr Haddad felt ashamed of his suspicion.","شعر السيد حداد بالخجل من شكّه."],
 ["After the exam, he spoke to the administration and arranged support for her.","بعد الامتحان، تحدث إلى الإدارة ورتّب لها دعمًا."],
 ["Years later, she sent him an invitation to her graduation as a doctor.","بعد سنوات، أرسلت له دعوة لحفل تخرجها طبيبةً."],
 ["He kept it on his desk as a reminder that appearances can be profoundly misleading.","احتفظ بها على مكتبه تذكيرًا بأن المظاهر قد تكون مضللة للغاية."]],
 [["What did Mr Haddad suspect?",["The student was ill","The student was cheating","The student was late","The student had no pen"],1,"He expected to find notes hidden there."],["What was actually on her sleeve?",["Notes","A bandage covering a burn","A phone","A watch"],1,"A small bandage covering a burn."],["What lesson did he keep in mind?",["Never trust students","Appearances can be misleading","Exams are useless","Cooking is dangerous"],1,"Appearances can be profoundly misleading."]]],
["b2s05","The Desert Road",[
 ["The car broke down two hundred kilometres from the nearest town.","تعطلت السيارة على بعد مئتي كيلومتر من أقرب مدينة."],
 ["Karim, a city engineer on his first trip to the Sahara, had ignored the guide's advice to travel in convoy.","كان كريم، المهندس القادم من المدينة في أول رحلة له إلى الصحراء، قد تجاهل نصيحة المرشد بالسفر ضمن قافلة."],
 ["His phone had no signal, and the afternoon heat was unbearable.","لم يكن في هاتفه أي إشارة، وكانت حرارة الظهيرة لا تُطاق."],
 ["Remembering what he had read, he stayed with the car and rationed his water.","تذكّر ما قرأه، فبقي بجانب السيارة وقسّم ماءه بحذر."],
 ["As the sun set, he saw a faint light approaching across the dunes.","مع غروب الشمس، رأى ضوءًا خافتًا يقترب عبر الكثبان."],
 ["It was a family of nomads travelling with their camels.","كانت عائلة من الرحّل تسافر مع جمالها."],
 ["They shared tea, bread and dates with him without asking a single question.","تقاسموا معه الشاي والخبز والتمر دون أن يسألوه سؤالًا واحدًا."],
 ["In the morning, the eldest son guided him to a well where a truck stopped regularly.","في الصباح، أرشده الابن الأكبر إلى بئر تتوقف عندها شاحنة بانتظام."],
 ["When Karim tried to pay them, the father simply shook his head.","عندما حاول كريم أن يدفع لهم، اكتفى الأب بهزّ رأسه."],
 ["\"In the desert,\" he said, \"hospitality is not a gift. It is a duty.\"","قال: \"في الصحراء، الضيافة ليست هدية، بل واجب.\""]],
 [["What advice had Karim ignored?",["To bring a map","To travel in convoy","To leave early","To take a bus"],1,"The guide's advice to travel in convoy."],["What did he do while waiting?",["Walked to town","Stayed with the car and rationed water","Slept in the sun","Drove away"],1,"He stayed with the car and rationed his water."],["What did the nomad father say about hospitality?",["It is expensive","It is a duty","It is optional","It is for friends only"],1,"Hospitality is not a gift. It is a duty."]]],
["b2s06","The Startup",[
 ["Meriem and Lotfi founded their company in a borrowed garage with two laptops and an unreliable internet connection.","أسست مريم ولطفي شركتهما في مرآب مستعار بحاسوبين محمولين واتصال إنترنت غير موثوق."],
 ["Their app helped farmers sell their produce directly to restaurants, cutting out intermediaries.","كان تطبيقهما يساعد الفلاحين على بيع منتجاتهم مباشرة للمطاعم، متجاوزًا الوسطاء."],
 ["For the first eight months, almost nobody used it.","خلال الأشهر الثمانية الأولى، لم يكن أحد تقريبًا يستخدمه."],
 ["Farmers were suspicious of technology, and restaurants preferred their usual suppliers.","كان الفلاحون يرتابون من التكنولوجيا، وكانت المطاعم تفضل مورّديها المعتادين."],
 ["Instead of giving up, they spent weeks visiting markets and listening to farmers' concerns.","بدلًا من الاستسلام، قضيا أسابيع في زيارة الأسواق والاستماع إلى مخاوف الفلاحين."],
 ["They discovered that what farmers needed most was not an app, but guaranteed payment on delivery.","اكتشفا أن ما يحتاجه الفلاحون أكثر لم يكن تطبيقًا، بل ضمان الدفع عند التسليم."],
 ["They redesigned their service around that single promise.","أعادا تصميم خدمتهما حول ذلك الوعد الوحيد."],
 ["Within a year, more than five hundred farmers had joined the platform.","في غضون عام، انضم أكثر من خمسمئة فلاح إلى المنصة."],
 ["When journalists asked about the secret of their success, Meriem's answer surprised them.","عندما سأل الصحفيون عن سر نجاحهما، فاجأتهم إجابة مريم."],
 ["\"We stopped talking about our product and started listening to our customers.\"","\"توقفنا عن الحديث عن منتجنا وبدأنا الاستماع إلى زبائننا.\""]],
 [["What did their app do?",["Delivered pizza","Connected farmers directly with restaurants","Taught farming","Sold phones"],1,"Helped farmers sell produce directly to restaurants."],["What did farmers need most?",["A better app design","Guaranteed payment on delivery","Cheaper seeds","Free phones"],1,"Guaranteed payment on delivery."],["What was the secret of their success?",["More advertising","Listening to customers","Lower prices","Investors"],1,"Started listening to our customers."]]],
["b2s07","The Bridge",[
 ["The old bridge in Constantine had connected the two sides of the gorge for over a century.","كان الجسر القديم في قسنطينة يربط ضفتي الوادي العميق منذ أكثر من قرن."],
 ["Every morning, Ammi Larbi sold newspapers at its eastern end.","كل صباح، كان عمي العربي يبيع الجرائد عند طرفه الشرقي."],
 ["He knew the habits of everyone who crossed: the doctor who bought two papers, the student who only read the sports pages.","كان يعرف عادات كل من يعبر: الطبيب الذي يشتري جريدتين، والطالب الذي لا يقرأ إلا صفحات الرياضة."],
 ["When the city announced that the bridge would close for renovation, he feared he would lose his livelihood.","عندما أعلنت المدينة أن الجسر سيُغلق للترميم، خشي أن يفقد مصدر رزقه."],
 ["To his surprise, his regular customers organised a petition.","لدهشته، نظّم زبائنه الدائمون عريضة."],
 ["They asked the council to provide him with a temporary kiosk near the new pedestrian route.","طلبوا من المجلس البلدي أن يوفر له كشكًا مؤقتًا قرب ممر المشاة الجديد."],
 ["The request was accepted, and the doctor even helped him set up a small online delivery service.","قُبل الطلب، بل إن الطبيب ساعده على إنشاء خدمة توصيل صغيرة عبر الإنترنت."],
 ["When the bridge reopened two years later, his business had actually grown.","عندما أُعيد فتح الجسر بعد عامين، كانت تجارته قد نمت فعلًا."],
 ["He realised that the true bridge had never been made of stone.","أدرك أن الجسر الحقيقي لم يكن يومًا مصنوعًا من الحجر."],
 ["It had been built, over decades, out of small daily conversations.","لقد بُني، على مدى عقود، من أحاديث يومية صغيرة."]],
 [["What did Ammi Larbi sell?",["Bread","Newspapers","Flowers","Coffee"],1,"He sold newspapers."],["What did his customers do?",["Moved away","Organised a petition","Bought a shop","Closed the bridge"],1,"They organised a petition."],["What is the 'true bridge' in the story?",["The new stone bridge","The relationships built through daily conversations","The online service","The kiosk"],1,"Built out of small daily conversations."]]],
["b2s08","The Second Language",[
 ["When Sofia arrived in Algiers as an exchange student, she believed her French would be enough.","عندما وصلت صوفيا إلى الجزائر العاصمة طالبةً في برنامج تبادل، ظنت أن فرنسيتها ستكفيها."],
 ["She quickly discovered that the city spoke in layers: Darja, French, Tamazight and, increasingly, English.","سرعان ما اكتشفت أن المدينة تتكلم بطبقات: الدارجة، والفرنسية، والأمازيغية، والإنجليزية بشكل متزايد."],
 ["Conversations switched languages in the middle of a sentence, and she often felt lost.","كانت المحادثات تنتقل من لغة إلى أخرى في منتصف الجملة، وكثيرًا ما شعرت بالضياع."],
 ["Her flatmate, Amel, suggested a simple rule: one new Darja expression every day.","اقترحت عليها شريكتها في السكن، آمال، قاعدة بسيطة: تعبير جديد بالدارجة كل يوم."],
 ["At first, Sofia's pronunciation made shopkeepers laugh, though never unkindly.","في البداية، كان نطق صوفيا يُضحك أصحاب المحلات، لكن دون أي سخرية."],
 ["Gradually, she noticed that people treated her differently when she tried.","شيئًا فشيئًا، لاحظت أن الناس صاروا يعاملونها بشكل مختلف عندما كانت تحاول."],
 ["Prices at the market became fairer, and neighbours began inviting her for tea.","أصبحت الأسعار في السوق أكثر إنصافًا، وبدأ الجيران يدعونها لشرب الشاي."],

function ring(pct,label,sub){const r=54,c=2*Math.PI*r;return `<svg viewBox="0 0 136 136" class="ring" role="img" aria-label="${sub}: ${label}"><circle cx="68" cy="68" r="${r}" class="ring-bg"/><circle cx="68" cy="68" r="${r}" class="ring-fg" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct)).toFixed(1)}" transform="rotate(-90 68 68)"/><text x="68" y="70" class="ring-t">${label}</text><text x="68" y="92" class="ring-s">${sub}</text></svg>`}

/* ---------------- render + events ---------------- */
function render(){
  renderHeader();
  const v=document.getElementById("view");
  if(tab==="test") v.innerHTML=pendingReview?viewReview():viewTest();
  else if(tab==="pron") v.innerHTML=viewPron();
  else if(tab==="lesson") v.innerHTML=viewLesson();
  else if(tab==="listen") v.innerHTML=viewSection("listen");
  else if(tab==="read") v.innerHTML=viewSection("read");
  else if(tab==="write") v.innerHTML=viewSection("write");
  else if(tab==="story") v.innerHTML=viewSection("story");
  else if(tab==="ielts") v.innerHTML=viewIelts();
  else v.innerHTML=viewDashboard();
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function go(t){try{speechSynthesis.cancel()}catch(_){}storyRun=null;tab=t;pendingReview=t==="test"?pendingReview:null;S.lastTab=t;saveLocal();render();window.scrollTo({top:0,behavior:"smooth"})}

document.querySelector(".topnav").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)go(b.dataset.tab)});
document.getElementById("frToggle").addEventListener("click",e=>{frOn=!frOn;e.currentTarget.setAttribute("aria-pressed",frOn);document.body.classList.toggle("show-fr",frOn);try{localStorage.setItem("mec-fr",frOn?"1":"0")}catch(_){}});
document.getElementById("resumeBtn").addEventListener("click",()=>{document.getElementById("resumeBanner").hidden=true;go(S.lastTab||"dashboard")});

document.getElementById("view").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.q!==undefined){S.test.answers[t.dataset.q]=+t.dataset.o;saveLocal();render();return}
  if(t.dataset.plv){S.pronLevel=t.dataset.plv;saveLocal();render();return}
  if(t.dataset.listen){const c=findClip(t.dataset.listen);speak(c.text,c.accent,!!t.dataset.slow);return}
  if(t.dataset.ans){if(S.ans[t.dataset.ans]===undefined){S.ans[t.dataset.ans]=+t.dataset.o;markAll();saveLocal();keepScroll(render)}return}
  if(t.dataset.seclv){const [k,lv]=t.dataset.seclv.split(":");S[SECS[k].lvk]=lv;saveLocal();render();return}
  if(t.dataset.unit){const [k,id]=t.dataset.unit.split(":");try{speechSynthesis.cancel()}catch(_){}storyRun=null;S[SECS[k].cur]=id;const u=SECS[k].arr().find(x=>x.id===id);if(u)S[SECS[k].lvk]=u.lv;saveLocal();if(tab!==k){go(k)}else{render();window.scrollTo({top:0})}return}
  if(t.dataset.unitback){const k=t.dataset.unitback;try{speechSynthesis.cancel()}catch(_){}storyRun=null;S[SECS[k].cur]=null;saveLocal();render();window.scrollTo({top:0});return}
  if(t.dataset.ureset){const [k,id]=t.dataset.ureset.split(":");const u=SECS[k].arr().find(x=>x.id===id);u.qs.forEach(q=>delete S.ans[q.id]);delete SECS[k].done()[id];saveLocal();render();return}
  if(t.dataset.readplay){const r=RD.find(x=>x.id===t.dataset.readplay);speak(r.paras.join(" "),"en-GB",!!t.dataset.slow);return}
  if(t.dataset.wmodel){const el=document.getElementById("wm-"+t.dataset.wmodel);el.hidden=!el.hidden;t.textContent=el.hidden?"Show the model answer":"Hide the model answer";return}
  if(t.dataset.splay){const st=ST.find(x=>x.id===t.dataset.splay);try{speechSynthesis.cancel()}catch(_){}storyRun={id:st.id,j:0};setTimeout(()=>storyLine(st,0),150);return}
  if(t.dataset.sline){const [id,j]=t.dataset.sline.split(":");const st=ST.find(x=>x.id===id);try{speechSynthesis.cancel()}catch(_){}storyRun=null;storyLine(st,+j,true);return}
  if(t.dataset.srate){S.storyRate=+t.dataset.srate;saveLocal();document.querySelectorAll("[data-srate]").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t.dataset.golevel){const nx=nextLesson();S.curLesson=(S.level===t.dataset.golevel&&nx)?nx.id:null;go("lesson");return}
  if(t.dataset.goielts){S.ieltsMod=t.dataset.goielts;go("ielts");return}
  if(t.dataset.lessonOpen){S.curLesson=t.dataset.lessonOpen;go("lesson");return}
  if(t.dataset.lesson){S.curLesson=t.dataset.lesson;saveLocal();render();window.scrollTo({top:0});return}
  if(t.dataset.llv){S.listenLevel=t.dataset.llv;saveLocal();render();return}
  if(t.dataset.trans){const c=findClip(t.dataset.trans);if(!c.qs.every(q=>S.ans[q.id]!==undefined)){toast("Answer the questions first, then read the text.");return}const el=document.getElementById("tr-"+t.dataset.trans);el.hidden=!el.hidden;return}
  if(t.dataset.imod){S.ieltsMod=t.dataset.imod;speechSynthesis&&speechSynthesis.cancel();saveLocal();render();return}
  if(t.dataset.ilisten){speakSeq(IELTS_LISTEN.find(p=>p.id===t.dataset.ilisten).lines);return}
  if(t.dataset.istop){try{speechSynthesis.cancel()}catch(_){}return}
  if(t.dataset.itrans){const p=IELTS_LISTEN.find(x=>x.id===t.dataset.itrans);if(!p.qs.every(q=>S.ans[q.id]!==undefined)){toast("Answer the questions first, then read the text.");return}const el=document.getElementById("itr-"+p.id);el.hidden=!el.hidden;return}
  if(t.dataset.ireset){const qs=t.dataset.ireset==="read"?IELTS_READ.qs:IELTS_LISTEN.find(p=>p.id===t.dataset.ireset).qs;qs.forEach(q=>delete S.ans[q.id]);saveLocal();render();return}
  if(t.dataset.copy){const v=t.dataset.copy;try{navigator.clipboard.writeText(v).then(()=>{t.textContent="Copied";setTimeout(()=>t.textContent="Copy",1600)},()=>toast("Select the number and copy it: "+v))}catch(_){toast("Select the number and copy it: "+v)}return}
  if(t.dataset.sayt){speak(t.dataset.sayt,"en-GB");return}
  if(t.dataset.say){const it=ALL_PRON.find(x=>x.id===t.dataset.say);speak(it.w.replace(/\((noun|verb)\)/g,""),t.dataset.lang,!!t.dataset.slow);return}
  if(t.dataset.rec) return listen(t.dataset.rec,t);
  if(t.dataset.rate){S.pron[t.dataset.rate]=t.dataset.v;saveLocal();render();return}
  if(t.dataset.coach) return askCoach(t.dataset.coach);
  const a=t.dataset.act;
  if(a==="save") saveCloud();
  else if(a==="submitStage") submitStage();
  else if(a==="next"){pendingReview=null;render();window.scrollTo({top:0})}
  else if(a==="saveNext"){pendingReview=null;saveCloud();render();window.scrollTo({top:0})}
  else if(a==="checkWriting") checkWriting();
  else if(a==="backToMap"){S.curLesson=null;saveLocal();render();window.scrollTo({top:0})}
  else if(a==="askLesson") askLesson();
  else if(a==="iWrite") iFeedback(t.dataset.k);
  else if(a==="iSpeak") iFeedback("sp");
  else if(a==="iTimer"){const k=t.dataset.k;runTimer(t,(+t.dataset.min)*60,()=>{t.textContent="Time is up";toast("Time is up. Finish your sentence and check your answer.")})}
  else if(a==="sPrep"){const el=document.getElementById("sTimer");t.disabled=true;runTimer(el,60,()=>{toast("Start speaking now. You have 2 minutes.");el.classList.add("live");runTimer(el,120,()=>{el.classList.remove("live");t.disabled=false;toast("Time is up. Well done.")})})}
  else if(a==="sMic") speakMic();
  else if(a==="sMicStop"){try{speakMic.rec&&speakMic.rec.stop()}catch(_){}}
  else if(a==="wAI") wAI(t.dataset.w);
  else if(a==="wDone"){const id=t.dataset.w,txt=((S.writeTxt||{})[id]||"").trim();if(!txt){toast("Write your answer first.");return}S.writeDone[id]={at:new Date().toISOString(),words:txt.split(/\s+/).length};saveCloud();render();toast("Task marked as done.")}
  else if(a==="sStop"){storyRun=null;try{speechSynthesis.cancel()}catch(_){}document.querySelectorAll(".sline.on").forEach(e=>e.classList.remove("on"))}
  else if(a==="donLater"){donateHidden=true;render()}
  else if(a==="donDone"){S.donated=true;saveCloud();render();toast("Thank you so much for your support.")}
  else if(a==="finishLesson"){const L=LESSONS.find(l=>l.id===S.curLesson);const qs=lessonQs(L);S.lessons[L.id]={score:Math.round(qs.filter(q=>S.ans[q.id]===q.a).length/qs.length*5),at:new Date().toISOString()};S.curLesson=null;saveCloud();render();window.scrollTo({top:0})}
  else if(a==="resetLesson"){const L=LESSONS.find(l=>l.id===S.curLesson);lessonQs(L).forEach(q=>delete S.ans[q.id]);saveLocal();render()}
  else if(a==="skipWriting"){S.test.ai=null;finishTest()}
  else if(a==="retake"){S.test=blank().test;S.level=null;S.levelIdx=null;saveLocal();render()}
});
document.getElementById("view").addEventListener("input",e=>{
  if(e.target.id==="writing"){S.test.writing=e.target.value;saveLocal()}
  const wc=e.target.dataset&&e.target.dataset.wchk;
  if(wc){const [id,i]=wc.split(":");S.writeChk=S.writeChk||{};S.writeChk[id]=S.writeChk[id]||{};S.writeChk[id][i]=e.target.checked;saveLocal();return}
  if(e.target.dataset&&e.target.dataset.act==="sAr"){S.showAr=e.target.checked;saveLocal();const c=document.querySelector(".story");if(c)c.classList.toggle("no-ar",!S.showAr);return}
  const wt=e.target.dataset&&e.target.dataset.wtxt;
  if(wt){S.writeTxt=S.writeTxt||{};S.writeTxt[wt]=e.target.value;saveLocal();const w=WR.find(x=>x.id===wt),n=e.target.value.trim()?e.target.value.trim().split(/\s+/).length:0,el=document.getElementById("wwc-"+wt);if(el)el.textContent=n+" words · aim for about "+w.min}
  const iw=e.target.dataset&&e.target.dataset.iw;
  if(iw){S.ieltsW=S.ieltsW||{};S.ieltsW[iw]=e.target.value;saveLocal();
    if(iw!=="sp"){const T=IELTS_W[iw],wc=e.target.value.trim()?e.target.value.trim().split(/\s+/).length:0,n=document.getElementById("wc-"+iw);if(n)n.textContent=wc+" words"+(wc<T.min?" · "+(T.min-wc)+" more to reach "+T.min:" · length OK")}}
});

function showResume(){
  const has=S.level||Object.keys(S.test.answers).length||Object.keys(S.pron).length;
  if(!has)return;
  const bits=[];
  if(!S.test.done&&(Object.keys(S.test.answers).length||S.test.stage))bits.push(`Your test is at part ${S.test.stage+1} of ${STAGES.length}.`);
  if(S.level)bits.push(`Your level is ${S.level}.`);
  if(Object.keys(S.pron).length)bits.push(`You practised ${Object.keys(S.pron).length} sounds.`);
  document.getElementById("resumeText").textContent=bits.join(" ")+" Continue where you stopped.";
  document.getElementById("resumeBanner").hidden=false;
}

function showNudge(){
  if((S.visits||0)<6||S.donated||document.getElementById("nudge"))return;
  const n=document.createElement("div");n.className="nudge";n.id="nudge";n.setAttribute("role","dialog");n.setAttribute("aria-label","Support My English Coach");
  n.innerHTML=`<span class="don-ic">${ic("heart")}</span><div style="min-width:0"><h3>Enjoying My English Coach?</h3>
   <p>If you have improved your English or loved using the platform, you can support it with a voluntary donation of <b>1,000 DA</b>.</p>
   <p class="fr">Si vous avez progressé ou aimé la plateforme, vous pouvez la soutenir avec un don volontaire de 1 000 DA.</p>
   <div class="row"><button class="btn hot small" id="nudgeGo">See how to donate</button><button class="btn ghost small" id="nudgeNo">Not now</button></div></div>
   <button class="x" id="nudgeX" aria-label="Close">×</button>`;
  document.body.appendChild(n);
  const close=()=>n.remove();
  n.querySelector("#nudgeNo").onclick=close;n.querySelector("#nudgeX").onclick=close;
  n.querySelector("#nudgeGo").onclick=()=>{close();donateHidden=false;go("dashboard");setTimeout(()=>{const d=document.querySelector(".donate");if(d)d.scrollIntoView({behavior:"smooth",block:"center"})},350)};
}

(async()=>{
  if(!window.claude||!window.claude.use){document.getElementById("learnerCount").textContent="–";return}
  const [d,u,s]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);
  db=d;userNs=u;sample=s;
  if(userNs){try{uid=await userNs.id()}catch(e){uid=null}}
  if(db&&uid){
    // restore from account if newer
    try{
      const snap=await db.collection("data/users/"+uid).doc("progress").get();
      if(snap.exists){const cloud=JSON.parse(snap.data().json||"{}");
        if(!local||!local.updatedAt||(cloud.updatedAt&&cloud.updatedAt>local.updatedAt)){S=migrate(cloud);saveLocal();render();showResume()}}
    }catch(e){}
    // count this learner once
    try{const me=db.collection("learners").doc(uid);const s0=await me.get();if(!s0.exists)await me.set({since:new Date().toISOString()})}catch(e){}
  }
  if(db){
    const lc=document.getElementById("learnerCount");
    const timer=setTimeout(()=>{if(lc.textContent==="…")lc.textContent="–"},10000);
    try{db.collection("learners").limit(1000).onSnapshot(q=>{clearTimeout(timer);lc.textContent=q.size>=1000?"1000+":String(q.size);document.querySelectorAll("[data-learners]").forEach(e=>e.textContent=lc.textContent);document.querySelectorAll("[data-learners-wrap]").forEach(e=>e.hidden=!/\d/.test(lc.textContent))},()=>{clearTimeout(timer);lc.textContent="–"})}catch(e){lc.textContent="–"}
  } else document.getElementById("learnerCount").textContent="–";
})();
</script>

<script>
/* Visitor counter (GoatCounter): private stats for the author + public total on the page */
(function(){
  var GC="https://myenglishcoachbadreddine.goatcounter.com";
  var pill=document.getElementById("learners"); if(pill) pill.hidden=true;
  function show(n){
    var lc=document.getElementById("learnerCount"); if(lc) lc.textContent=n;
    document.querySelectorAll("[data-learners]").forEach(function(e){e.textContent=n});
    document.querySelectorAll("[data-learners-wrap]").forEach(function(e){e.hidden=false});
    if(pill) pill.hidden=false;
  }
  fetch(GC+"/counter/TOTAL.json").then(function(r){return r.ok?r.json():null}).then(function(j){
    if(!j) return; var n=j.count_unique||j.count; if(n&&/\d/.test(n)) show(String(n).trim());
  }).catch(function(){});
})();
</script>
<script data-goatcounter="https://myenglishcoachbadreddine.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
