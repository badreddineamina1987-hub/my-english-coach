["a1w05","My house or flat","Describe your house or flat. What rooms are there? What is your favourite room?",40,["I live in a house / flat.","There is / There are…","My favourite room is…","because…"],"I live in a flat on the second floor. There are three bedrooms, a kitchen, a living room and a bathroom. My favourite room is the kitchen because it is big and sunny, and my mother makes delicious food there.",[...CK_A1,"I used there is (one) and there are (many)."]],
["a1w06","A message to a friend","Write a short text message to a friend. Invite them to go somewhere this weekend. Say where, when and what time.",30,["Hi …!","Are you free on…?","Let's go to…","Meet me at … at …","See you!"],"Hi Rym! Are you free on Saturday? Let's go to the new park near the sea. We can have a picnic. Meet me at the bus stop at ten o'clock. See you!",["I said where, when and what time.","I used Let's + verb.","I started with Hi and finished with a goodbye."]],
["a1w07","My favourite food","Write about your favourite food. What is it? When do you eat it? Who makes it?",40,["My favourite food is…","It is made with…","I eat it on / when…","My … makes it."],"My favourite food is couscous. It is made with meat, vegetables and semolina. We eat it every Friday with all the family. My grandmother makes the best couscous. It is delicious!",[...CK_A1,"I explained when I eat it."]],
["a1w08","My town","Write about your town or city. Where is it? What can people do there?",50,["I live in…","It is in the north / south / east / west of…","There is / There are…","You can…","I like it because…"],"I live in Jijel. It is in the east of Algeria, by the sea. There are beautiful beaches and mountains. In summer, you can swim and eat fresh fish. There is also a nice market in the centre. I like my town because it is green and calm.",[...CK_A1,"I used You can… for activities."]],
["a1w09","A postcard from a holiday","Imagine you are on holiday. Write a postcard to a friend: where you are, the weather, what you do.",40,["Dear…","I'm in…","The weather is…","Every day I…","See you soon!"],"Dear Nadia,\nI'm in Ghardaïa with my family. The weather is hot and sunny. Every day we visit the old town and the markets. The houses are very beautiful. See you soon!\nLove, Hana",["I started with Dear… and ended with my name.","I described the weather.","I used the present simple or continuous."]],
["a1w10","My weekend","Write about what you usually do at the weekend.",40,["On Friday / Saturday I usually…","Sometimes I…","I never…","I like / love…ing"],"On Friday I usually visit my grandparents. We have lunch together. In the afternoon I sometimes go to the park with my cousins. On Saturday I clean my room and study. I never get up early at the weekend!",[...CK_A1,"I used frequency words (usually, sometimes, never)."]],
["a1w11","Describe a photo","Imagine a photo of a family in a park. Describe it: who is there, what they are wearing, what they are doing.",40,["In the photo there is / there are…","The man is wearing…","The children are playing…","They are happy."],"In the photo there is a family in a park. The father is wearing a blue shirt. The mother is sitting on the grass. The two children are playing with a ball. The weather is sunny and everyone is happy.",[...CK_A1,"I used the present continuous (is …ing)."]],
["a1w12","A form","Complete a short profile for an English course: full name, nationality, age, email, languages you speak, and why you want to learn English.",30,["Full name:","Nationality: Algerian","I speak…","I want to learn English because…"],"Full name: Sara Benmoussa\nNationality: Algerian\nAge: 24\nEmail: sara.b@example.com\nLanguages: Arabic, Kabyle and French\nI want to learn English because I want to work in an international company.",["I filled in every part of the form.","I wrote a full sentence for the reason.","I checked the spelling of my email."]],
["a1w13","My clothes","What do you usually wear to university or work? What do you wear at the weekend?",40,["To university I usually wear…","At the weekend I wear…","My favourite colour is…","I don't like…"],"To university I usually wear jeans, a shirt and comfortable shoes. At the weekend I wear a long dress or a tracksuit. My favourite colour is blue. I don't like wearing high heels because they are not comfortable.",[...CK_A1,"I used colours and clothes words."]],
["a1w14","An email to a teacher","Write a short email to your teacher. Say you are ill and you can't come to class tomorrow. Ask about the homework.",40,["Dear Mr / Mrs…","I'm sorry, but…","I'm ill / I have a…","Can you tell me the homework, please?","Best regards,"],"Dear Mrs Saadi,\nI'm sorry, but I can't come to class tomorrow. I'm ill and I have a fever. Can you tell me the homework, please?\nThank you.\nBest regards,\nWalid",["I used a polite greeting and ending.","I gave a reason.","I asked a polite question with please."]],
["a1w15","My favourite season","What is your favourite season? Why? What do you do in that season?",40,["My favourite season is…","because…","In … I like…","The weather is…"],"My favourite season is spring. The weather is warm and the trees are green. In spring I like walking in the countryside and taking photos of flowers. I don't like summer because it is too hot.",[...CK_A1,"I gave a reason with because."]],
["a1w16","What I can do","Write about things you can and can't do (sports, languages, cooking, music…).",40,["I can…","I can't…","I can … very well.","I want to learn to…"],"I can speak Arabic and French very well. I can cook pasta and omelettes. I can swim, but I can't ride a bike. I can't play the guitar, but I want to learn to play it this year.",[...CK_A1,"I used can / can't + verb without to."]],
["a1w17","A shopping list and a note","Your brother is going to the shop. Write a note: what to buy and how much.",30,["Please buy…","some / a kilo of / a bottle of…","Don't forget…","Thanks!"],"Hi Anis,\nPlease buy some bread, a kilo of tomatoes, a bottle of olive oil and six eggs. Don't forget the milk! The money is on the table.\nThanks!\nMeriem",["I used some and quantities.","I wrote a clear list.","I used Please and Thanks."]],
["a1w18","Yesterday","Write about yesterday: where you were, who you were with, and how it was.",40,["Yesterday I was at…","I was with…","It was…","We were…"],"Yesterday I was at home in the morning. In the afternoon I was at my aunt's house with my cousins. It was her birthday. The cake was very good and we were very happy.",[...CK_A1,"I used was and were correctly."]],
["a1w19","Directions to my house","A friend is coming to visit. Write how to get to your house from the bus stop.",40,["Get off the bus at…","Go straight on.","Turn left / right at…","My house is next to / opposite…"],"Get off the bus at the post office. Go straight on for two minutes. Turn right at the pharmacy. My house is the white house next to the small mosque. The door is green. Call me if you are lost!",["I used imperatives (Go, Turn).","I used place words (next to, opposite).","The steps are in a clear order."]],
["a1w20","Why I learn English","Write why you are learning English and what you want to do with it.",50,["I'm learning English because…","I want to…","English is important for…","Every day I…"],"I'm learning English because it is important for my job. I want to read books and articles in English and speak with people from other countries. English is also important for travel. Every day I study for thirty minutes and I listen to English songs.",[...CK_A1,"I gave at least two reasons."]]
]);

/* ---- A1 read-along stories 1-10 ---- */
addStories("A1",[
["a1s01","My Family",[
 ["Hello, my name is Sami.","مرحبًا، اسمي سامي."],
 ["I am ten years old.","عمري عشر سنوات."],
 ["I live with my family in a small house.","أعيش مع عائلتي في بيت صغير."],
 ["My father is a doctor.","أبي طبيب."],
 ["My mother is a teacher.","أمي معلمة."],
 ["I have one sister. Her name is Lina.","لدي أخت واحدة. اسمها لينا."],
 ["We have a cat. It is white and very lazy.","لدينا قطة. إنها بيضاء وكسولة جدًا."],
 ["Every evening, we eat dinner together.","كل مساء، نتناول العشاء معًا."],
 ["I love my family very much.","أحب عائلتي كثيرًا."]],
 [["What is Sami's father's job?",["Teacher","Doctor","Driver","Farmer"],1,"My father is a doctor."],["What colour is the cat?",["Black","Brown","White","Grey"],2,"It is white."],["When does the family eat together?",["Every morning","Every evening","On Fridays","Never"],1,"Every evening, we eat dinner together."]]],
["a1s02","A Day at School",[
 ["Today is Monday.","اليوم هو الاثنين."],
 ["Nora wakes up at seven o'clock.","تستيقظ نورة في الساعة السابعة."],
 ["She puts on her uniform and eats breakfast.","ترتدي زيها المدرسي وتتناول الفطور."],
 ["She walks to school with her friend Maya.","تمشي إلى المدرسة مع صديقتها مايا."],
 ["Her first class is English.","حصتها الأولى هي الإنجليزية."],
 ["The teacher is kind and the lesson is fun.","المعلمة لطيفة والدرس ممتع."],
 ["At ten o'clock, the children play in the playground.","في الساعة العاشرة، يلعب الأطفال في الساحة."],
 ["After school, Nora does her homework.","بعد المدرسة، تقوم نورة بواجباتها."],
 ["She is tired but happy.","إنها متعبة لكنها سعيدة."]],
 [["How does Nora go to school?",["By bus","By car","She walks","By bike"],2,"She walks to school."],["What is her first class?",["Maths","English","Science","Arabic"],1,"Her first class is English."],["How does Nora feel at the end?",["Sad","Angry","Tired but happy","Bored"],2,"She is tired but happy."]]],
["a1s03","At the Market",[
 ["On Saturday, Omar goes to the market with his mother.","يوم السبت، يذهب عمر إلى السوق مع أمه."],
 ["The market is big and noisy.","السوق كبير وصاخب."],
 ["There are many fruits and vegetables.","هناك الكثير من الفواكه والخضروات."],
 ["His mother buys tomatoes, onions and potatoes.","تشتري أمه الطماطم والبصل والبطاطا."],
 ["Omar wants some oranges.","يريد عمر بعض البرتقال."],
 ["The seller smiles and gives him one orange for free.","يبتسم البائع ويعطيه برتقالة مجانًا."],
 ["\"Thank you!\" says Omar.","يقول عمر: \"شكرًا لك!\""],
 ["They carry the heavy bags home.","يحملان الأكياس الثقيلة إلى البيت."],
 ["Omar likes the market very much.","يحب عمر السوق كثيرًا."]],
 [["When do they go to the market?",["On Friday","On Saturday","On Monday","Every day"],1,"On Saturday."],["What does the seller give Omar?",["A tomato","An orange","An apple","Money"],1,"He gives him one orange for free."],["What are the bags like?",["Light","Heavy","Empty","Small"],1,"They carry the heavy bags."]]],
["a1s04","My New Friend",[
 ["A new girl comes to our class.","تأتي فتاة جديدة إلى صفنا."],
 ["Her name is Hana and she is from Annaba.","اسمها هناء وهي من عنابة."],
 ["She is shy and she sits alone.","إنها خجولة وتجلس وحدها."],
 ["At lunch, I say, \"Hello, do you want to eat with me?\"","في وقت الغداء، أقول: \"مرحبًا، هل تريدين أن تأكلي معي؟\""],
 ["She smiles and says, \"Yes, please.\"","تبتسم وتقول: \"نعم، من فضلك.\""],
 ["We talk about books and music.","نتحدث عن الكتب والموسيقى."],
 ["We both love drawing.","كلانا يحب الرسم."],
 ["Now Hana is my new friend.","الآن هناء صديقتي الجديدة."],
 ["We sit together every day.","نجلس معًا كل يوم."]],
 [["Where is Hana from?",["Oran","Annaba","Algiers","Setif"],1,"She is from Annaba."],["How is Hana at the beginning?",["Shy","Angry","Loud","Funny"],0,"She is shy and she sits alone."],["What do they both love?",["Football","Cooking","Drawing","Swimming"],2,"We both love drawing."]]],
["a1s05","The Lost Cat",[
 ["Mimi is a little grey cat.","ميمي قطة رمادية صغيرة."],
 ["One morning, Mimi is not in the house.","في صباح أحد الأيام، ليست ميمي في البيت."],
 ["Aya is very sad.","آية حزينة جدًا."],
 ["She looks under the bed and in the garden.","تبحث تحت السرير وفي الحديقة."],
 ["She asks her neighbours, \"Have you seen my cat?\"","تسأل جيرانها: \"هل رأيتم قطتي؟\""],
 ["Nobody has seen her.","لم يرها أحد."],
 ["In the evening, Aya hears a small sound.","في المساء، تسمع آية صوتًا صغيرًا."],
 ["Mimi is on the roof!","ميمي على السطح!"],
 ["Aya's father helps the cat come down, and Aya is happy again.","يساعد والد آية القطة على النزول، وتعود آية سعيدة."]],
 [["What colour is Mimi?",["White","Black","Grey","Orange"],2,"A little grey cat."],["Where is Mimi in the end?",["Under the bed","In the garden","On the roof","At the neighbour's"],2,"Mimi is on the roof!"],["Who helps the cat come down?",["Aya","Aya's father","A neighbour","The police"],1,"Aya's father helps the cat come down."]]],
["a1s06","Breakfast with Grandma",[
 ["Every Friday, I visit my grandmother.","كل يوم جمعة، أزور جدتي."],
 ["She lives in a village near the mountains.","تعيش في قرية قرب الجبال."],
 ["Her house smells of fresh bread.","بيتها تفوح منه رائحة الخبز الطازج."],
 ["She makes msemen and hot tea for me.","تحضّر لي المسمن والشاي الساخن."],
 ["We eat on the terrace and look at the trees.","نأكل على الشرفة وننظر إلى الأشجار."],
 ["Grandma tells me stories about her childhood.","تحكي لي جدتي قصصًا عن طفولتها."],
 ["She was a very good student.","كانت طالبة جيدة جدًا."],
 ["I love her stories and her food.","أحب قصصها وطعامها."],
 ["Friday is my favourite day.","يوم الجمعة هو يومي المفضل."]],
 [["Where does the grandmother live?",["In a big city","In a village near the mountains","By the sea","In France"],1,"In a village near the mountains."],["What does she make?",["Couscous","Msemen and tea","Pizza","Soup"],1,"She makes msemen and hot tea."],["What does Grandma talk about?",["Her childhood","The news","Football","Her job"],0,"Stories about her childhood."]]],
["a1s07","A Rainy Day",[
 ["Today it is raining a lot.","اليوم تمطر كثيرًا."],
 ["Yanis can't play outside.","لا يستطيع يانيس اللعب في الخارج."],
 ["He is bored at home.","يشعر بالملل في البيت."],
 ["His mother says, \"Let's make a cake!\"","تقول أمه: \"لنصنع كعكة!\""],
 ["They mix flour, eggs, sugar and milk.","يخلطان الدقيق والبيض والسكر والحليب."],
 ["The kitchen is a little messy.","المطبخ فوضوي قليلًا."],
 ["After forty minutes, the cake is ready.","بعد أربعين دقيقة، تصبح الكعكة جاهزة."],
 ["It smells wonderful.","رائحتها رائعة."],
 ["Now Yanis loves rainy days!","الآن يانيس يحب الأيام الممطرة!"]],
 [["Why can't Yanis play outside?",["It's dark","It's raining","He is ill","It's too hot"],1,"It is raining a lot."],["What do they make?",["Bread","A cake","Tea","Soup"],1,"Let's make a cake!"],["How long does the cake take?",["Ten minutes","Twenty minutes","Forty minutes","One hour"],2,"After forty minutes."]]],
["a1s08","My Favourite Season",[
 ["Hello everyone.","مرحبًا بالجميع."],
 ["Today I want to talk about my favourite season.","اليوم أريد أن أتحدث عن فصلي المفضل."],
 ["My favourite season is autumn.","فصلي المفضل هو الخريف."],
 ["I love autumn because the weather is cool and fresh.","أحب الخريف لأن الجو يكون لطيفًا ومنعشًا."],
 ["The trees become yellow, orange and red.","تتحول أوراق الأشجار إلى الأصفر والبرتقالي والأحمر."],
 ["I like walking in the park and looking at the colourful leaves.","أحب التنزه في الحديقة والنظر إلى الأوراق الملونة."],
 ["In autumn, I drink hot tea and read books.","في الخريف، أشرب الشاي الساخن وأقرأ الكتب."],
 ["Sometimes it rains, and I listen to the rain from my window.","أحيانًا تمطر، فأستمع إلى المطر من نافذتي."],
 ["Autumn makes me calm and happy.","الخريف يجعلني هادئًا وسعيدًا."]],
 [["What is the speaker's favourite season?",["Spring","Summer","Autumn","Winter"],2,"My favourite season is autumn."],["What colours do the trees become?",["Green and blue","Yellow, orange and red","White","Pink"],1,"Yellow, orange and red."],["What does the speaker do when it rains?",["Goes swimming","Listens to the rain","Plays football","Sleeps"],1,"I listen to the rain from my window."]]],
["a1s09","The Birthday Party",[
 ["Today is Rania's birthday.","اليوم هو عيد ميلاد رانيا."],
 ["She is eight years old.","عمرها ثماني سنوات."],
 ["Her friends come to her house at four o'clock.","يأتي أصدقاؤها إلى بيتها في الساعة الرابعة."],
 ["They bring presents and balloons.","يحضرون الهدايا والبالونات."],
 ["Her mother makes a big chocolate cake.","تصنع أمها كعكة شوكولاتة كبيرة."],
 ["Everyone sings \"Happy Birthday\".","يغني الجميع \"عيد ميلاد سعيد\"."],
 ["Rania blows out eight candles.","تطفئ رانيا ثماني شموع."],
 ["Her favourite present is a book about animals.","هديتها المفضلة هي كتاب عن الحيوانات."],
 ["It is the best day of the year!","إنه أفضل يوم في السنة!"]],
 [["How old is Rania?",["Six","Seven","Eight","Ten"],2,"She is eight years old."],["What kind of cake is it?",["Strawberry","Chocolate","Lemon","Orange"],1,"A big chocolate cake."],["What is her favourite present?",["A doll","A bike","A book about animals","A dress"],2,"A book about animals."]]],
["a1s10","A Trip to the Sea",[
 ["In July, Adel and his family go to the sea.","في شهر يوليو، يذهب عادل وعائلته إلى البحر."],
 ["They get up early and drive for two hours.","يستيقظون باكرًا ويقودون السيارة لمدة ساعتين."],
 ["The beach is beautiful and the water is blue.","الشاطئ جميل والماء أزرق."],
 ["Adel and his brother swim and play with a ball.","يسبح عادل وأخوه ويلعبان بالكرة."],
 ["Their father reads a newspaper under the umbrella.","يقرأ أبوهما جريدة تحت المظلة."],
 ["Their mother prepares sandwiches and fruit.","تحضّر أمهما الشطائر والفواكه."],
 ["In the afternoon, they eat ice cream.","في فترة الظهيرة، يأكلون المثلجات."],
 ["In the evening, they go home tired and happy.","في المساء، يعودون إلى البيت متعبين وسعداء."],
 ["Adel wants to go to the sea again next week.","يريد عادل أن يذهب إلى البحر مرة أخرى الأسبوع القادم."]],
 [["How long do they drive?",["One hour","Two hours","Three hours","Thirty minutes"],1,"They drive for two hours."],["What does the father do?",["Swims","Reads a newspaper","Cooks","Sleeps in the car"],1,"Their father reads a newspaper under the umbrella."],["What do they eat in the afternoon?",["Sandwiches","Ice cream","Fish","Cake"],1,"In the afternoon, they eat ice cream."]]]
]);

/* ---- A2 lessons 5-20 ---- */
addLessons("A2",[
["a2L05","Past simple: negatives and questions",
 "Negative: didn't + base verb (I didn't go). Question: Did + subject + base verb (Did you go?). Never use the past form after did.",
 "Négatif : didn't + verbe de base. Question : Did + sujet + verbe de base.",
 ["I didn't watch TV last night.","Did you finish your homework?","Where did they go on holiday?"],
 [["She ___ to the party.",["didn't went","didn't go","not went","doesn't went"],1,"didn't + base verb: didn't go."],
  ["___ you call your mother yesterday?",["Do","Were","Did","Have"],2,"Past question: Did."],
  ["What did he ___ for lunch?",["ate","eats","eat","eaten"],2,"After did, use the base verb: eat."],
  ["Did they win? No, they ___.",["didn't","don't","weren't","haven't"],0,"Short answer: No, they didn't."]],
 [["finish","complete","finir"],["win","be first in a game","gagner"],["call","phone someone","appeler"],["last night","the night before today","hier soir"]]],
["a2L06","Past continuous",
 "Use was / were + -ing for an action in progress at a time in the past: At 8 p.m. I was cooking. We often use it with when + past simple: I was walking home when it started to rain.",
 "was/were + -ing : action en cours dans le passé, souvent interrompue (when + passé simple).",
 ["At nine o'clock I was studying.","They were watching TV when I arrived.","What were you doing at midnight?"],
 [["I ___ a shower when the phone rang.",["had","was having","have","am having"],1,"Action in progress: was having."],
  ["They ___ football at 5 p.m. yesterday.",["were playing","was playing","played","are playing"],0,"They → were + -ing."],
  ["What ___ you doing when the lights went out?",["did","was","were","are"],2,"You → were."],
  ["She was driving when she ___ an accident.",["was seeing","sees","saw","has seen"],2,"Short completed action: past simple, saw."]],
 [["shower","washing your body under water","douche"],["rang","past of ring","a sonné"],["accident","something bad that happens suddenly","accident"],["midnight","12 o'clock at night","minuit"]]],
["a2L07","Much, many, a lot of",
 "Many + countable plurals (many books). Much + uncountables (much time), mostly in questions and negatives. A lot of works with both: a lot of friends, a lot of money.",
 "many + dénombrable, much + indénombrable (questions/négations), a lot of = les deux.",
 ["How many students are there?","I don't have much time.","She has a lot of friends."],
 [["How ___ water do you drink a day?",["many","much","a lot","few"],1,"Water is uncountable: much."],
  ["There aren't ___ people here today.",["much","many","a lot","little"],1,"People is countable plural: many."],
  ["He eats ___ fruit every day.",["many","a lot of","much of","a lots of"],1,"Positive sentence: a lot of."],
  ["How ___ brothers have you got?",["much","many","lot","more"],1,"Countable: how many."]],
 [["countable","you can count it: one, two…","dénombrable"],["money","dinars, euros…","argent"],["time","hours and minutes","temps"],["people","more than one person","gens"]]],
["a2L08","Too and enough",
 "Too + adjective = more than necessary (too hot). Adjective + enough = as much as necessary (old enough). Enough + noun: enough money.",
 "too + adjectif = trop ; adjectif + enough = assez ; enough + nom.",
 ["This coffee is too hot to drink.","He isn't tall enough to play basketball.","We don't have enough chairs."],
 [["I can't buy this car. It's ___ expensive.",["enough","too","very much","so much"],1,"More than I can pay: too expensive."],
  ["She is ___ to drive. She's eighteen.",["enough old","old enough","too old","old too"],1,"Adjective + enough."],
  ["There isn't ___ milk for everyone.",["too","enough","too much","many"],1,"enough + noun."],
  ["The music is ___ loud. Please turn it down.",["enough","too","so much","very much"],1,"More than necessary: too loud."]],
 [["necessary","needed","nécessaire"],["loud","with a lot of sound","fort (bruit)"],["turn down","make quieter","baisser"],["expensive","costs a lot","cher"]]],
["a2L09","Should for advice",
 "Use should / shouldn't + base verb to give advice: You should sleep more. You shouldn't eat so late. Question: Should I…?",
 "should + verbe = conseil (devrais). shouldn't = ne devrais pas.",
 ["You should see a doctor.","You shouldn't drink so much coffee.","What should I wear tomorrow?"],
 [["You look tired. You ___ go to bed early.",["should","shouldn't","must not","can't"],0,"Advice: should."],
  ["You ___ use your phone while driving.",["should","shouldn't","can","will"],1,"Bad idea: shouldn't."],
  ["___ I take an umbrella?",["Do","Should","Am","Would"],1,"Asking for advice: Should I…?"],
  ["He should ___ more water.",["drinks","to drink","drink","drinking"],2,"should + base verb."]],
 [["advice","an idea to help someone","conseil"],["wear","have clothes on","porter (vêtements)"],["while","during the time that","pendant que"],["tired","needing sleep","fatigué"]]],
["a2L10","Have to and don't have to",
 "Have to / has to = it is necessary (I have to work on Saturday). Don't have to = it is not necessary (You don't have to come, it's optional).",
 "have to = obligation ; don't have to = pas nécessaire (≠ interdit).",
 ["I have to get up at six.","She has to wear a uniform.","You don't have to pay. It's free."],
 [["Students ___ wear a uniform at this school.",["has to","have to","don't have","must to"],1,"Students = they → have to."],
  ["It's free. You ___ pay.",["have to","don't have to","has to","should"],1,"Not necessary: don't have to."],
  ["My father ___ work on Fridays.",["have to","has to","having to","haves to"],1,"He → has to."],
  ["___ you have to go now?",["Does","Are","Do","Have"],2,"Question: Do you have to…?"]],
 [["uniform","special clothes for school or work","uniforme"],["necessary","needed","nécessaire"],["optional","you can choose","facultatif"],["pay","give money","payer"]]],
["a2L11","Present perfect: ever and never",
 "Use have / has + past participle to talk about experiences in your life: Have you ever been to Spain? I've never eaten sushi. We don't say when.",
 "have/has + participe passé pour les expériences : ever (déjà ?), never (jamais).",
 ["Have you ever flown in a plane?","She has never seen snow.","I've visited Tunisia twice."],
 [["Have you ever ___ to Paris?",["went","been","go","going"],1,"Past participle of go (experience): been."],
  ["I have never ___ camel meat.",["ate","eat","eaten","eating"],2,"Past participle: eaten."],

 [["experience","something that happened to you","expérience"],["flown","past participle of fly","pris l'avion"],["snow","white cold rain","neige"],["famous","known by many people","célèbre"]]],
["a2L12","Present perfect: just, already, yet",
 "Just = a very short time ago (I've just arrived). Already = sooner than expected (She's already finished). Yet = until now, in questions and negatives (Have you eaten yet? I haven't eaten yet).",
 "just = venir de ; already = déjà ; yet = déjà ? / pas encore (fin de phrase).",
 ["The bus has just left.","I've already done my homework.","Have you replied to the email yet?"],
 [["I'm not hungry. I've ___ eaten.",["yet","just","ever","still"],1,"A short time ago: just."],
  ["Have you finished your project ___?",["already","just","yet","never"],2,"Question at the end: yet."],
  ["She has ___ read that book. She read it last year.",["yet","already","ever","still"],1,"Already."],
  ["I haven't seen the new film ___.",["already","just","yet","ever"],2,"Negative: not … yet."]],
 [["arrive","get to a place","arriver"],["reply","answer","répondre"],["project","a big piece of work","projet"],["hungry","wanting food","avoir faim"]]],
["a2L13","Adverbs of manner",
 "Adverbs say how we do something. Most are adjective + -ly: quick → quickly, careful → carefully. Irregular: good → well, fast → fast, hard → hard.",
 "Adverbe de manière : adjectif + -ly. Irréguliers : well, fast, hard.",
 ["She speaks English very well.","Please drive carefully.","He works hard every day."],
 [["He sings ___.",["beautiful","beautifully","beauty","more beautiful"],1,"How? Adverb: beautifully."],
  ["You speak French very ___.",["good","well","goodly","nice"],1,"Good → well."],
  ["Please speak ___. The baby is sleeping.",["quiet","quietly","quieter","quiets"],1,"Adverb: quietly."],
  ["She is a ___ driver.",["careful","carefully","care","carefuly"],0,"Describing a noun (driver): adjective careful."]],
 [["carefully","with attention","prudemment"],["quietly","without noise","doucement"],["hard","with a lot of effort","dur"],["driver","a person who drives","conducteur"]]],
["a2L14","Will and might for predictions",
 "Will = you are sure about the future (It will be sunny tomorrow). Might = maybe, it's possible (I might go to the party).",
 "will = sûr ; might = peut-être.",
 ["I think Algeria will win the match.","It might rain this afternoon.","She won't be late."],
 [["Take an umbrella. It ___ rain later.",["might","is","has","did"],0,"Possible: might."],
  ["I'm sure you ___ pass the exam.",["might","will","are","do"],1,"Sure: will."],
  ["I'm not sure. I ___ stay at home tonight.",["will","might","am","won't"],1,"Not sure: might."],
  ["He ___ be here before nine. He's always late.",["won't","will","might to","not will"],0,"Negative prediction: won't."]],
 [["prediction","what you think will happen","prédiction"],["sure","certain","sûr"],["match","a game between teams","match"],["later","after now","plus tard"]]],
["a2L15","Would like and want",
 "Would like ('d like) is a polite way to say want: I'd like a coffee, please. Would you like some tea? Use would like + to + verb: I'd like to visit London.",
 "would like = vouloir (poli). Would you like…? = Voulez-vous… ?",
 ["I'd like a glass of water, please.","Would you like to come with us?","She'd like to study abroad."],
 [["___ you like some cake?",["Do","Would","Are","Will"],1,"Polite offer: Would you like…?"],
  ["I'd like ___ a room for two nights.",["book","booking","to book","books"],2,"would like + to + verb."],
  ["Yes, I ___. Thank you.",["would","like","do","am"],0,"Short answer: Yes, I would."],
  ["Which is the most polite?",["Give me a tea.","I want tea.","I'd like a tea, please.","Tea now."],2,"I'd like…, please is polite."]],
 [["polite","nice and respectful","poli"],["book","reserve","réserver"],["abroad","in another country","à l'étranger"],["glass","you drink from it","verre"]]],
["a2L16","A few and a little",
 "A few + countable plurals (a few friends). A little + uncountables (a little sugar). Both mean a small amount, but enough.",
 "a few + dénombrable ; a little + indénombrable = un peu.",
 ["I have a few questions.","Can I have a little milk?","We stayed there for a few days."],
 [["Add ___ salt to the soup.",["a few","a little","many","few"],1,"Salt is uncountable: a little."],
  ["I invited ___ friends for dinner.",["a little","a few","much","little"],1,"Countable: a few."],
  ["She speaks ___ English.",["a few","a little","many","few of"],1,"Uncountable: a little English."],
  ["Wait ___ minutes, please.",["a little","a few","much","a lot"],1,"Minutes are countable: a few."]],
 [["salt","white, it makes food salty","sel"],["invite","ask someone to come","inviter"],["amount","how much","quantité"],["question","what you ask","question"]]],
["a2L17","As … as",
 "Use as + adjective + as to say two things are equal: My brother is as tall as my father. Not as … as means less: The bus is not as fast as the train.",
 "as … as = aussi … que ; not as … as = moins … que.",

  ["The film wasn't as good ___ the book.",["than","like","as","that"],2,"not as … as."],
  ["Tea is not as ___ as coffee for me.",["strongest","stronger","strong","more strong"],2,"as + basic adjective + as."],
  ["'Not as cheap as' means…",["cheaper","more expensive","the same","very cheap"],1,"Not as cheap = more expensive."]],

["a2L18","Prepositions of movement",
 "Into (go inside), out of (leave inside), across (from one side to the other), through (in one side and out the other), along, up, down, towards.",

 [["He jumped ___ the pool.",["into","out","across","off"],0,"Going inside: into."],
  ["Walk ___ the bridge to the other side.",["into","across","out of","under"],1,"From one side to the other: across."],
  ["The cat ran ___ of the house.",["into","out","through","across"],1,"out of the house."],
  ["We drove ___ the forest for an hour.",["into","through","out","on"],1,"In one side and out the other: through."]],
 [["bridge","a road over a river","pont"],["tunnel","a road under a mountain","tunnel"],["forest","a lot of trees","forêt"],["river","water that moves to the sea","rivière"]]],
["a2L19","Linking words: and, but, so, because",
 "And adds information. But shows a contrast. So gives a result. Because gives a reason.",
 "and = et, but = mais, so = donc, because = parce que.",

  ["She plays the piano ___ the guitar.",["but","and","so","because"],1,"Adding: and."]],

["a2L20","Used to",
 "Use used to + base verb for habits or states in the past that are not true now: I used to play football (I don't now). Negative: didn't use to. Question: Did you use to…?",

  ["Did you ___ live here?",["used to","use to","using","uses to"],1,"Question: Did you use to…?"],
  ["'I used to smoke' means…",["I smoke now","I smoked before but not now","I never smoked","I will smoke"],1,"A past habit that stopped."]],

addReads("A2",[
["a2r01","A new life in the city","Two years ago, Malik moved from a small village to Algiers to study at university. At first, life in the city was difficult. There was a lot of noise and traffic, and he didn't know anyone.\nBut after a few months, he made friends and found a part-time job in a bookshop. Now he loves the city. He enjoys the museums, the cafés and the sea. He still visits his village every holiday because he misses his family.",
 [["Why did Malik move to Algiers?",["To work","To study","To get married","To see the sea"],1,"To study at university."],["What was difficult at first?",["The food","The noise, traffic and not knowing anyone","The weather","The exams"],1,"A lot of noise and traffic, and he didn't know anyone."],["Where does Malik work?",["In a café","In a museum","In a bookshop","In a bank"],2,"A part-time job in a bookshop."]],
 [["moved","went to live in a new place"],["part-time","only some hours a week"],["miss","feel sad because someone is not with you"]]],
["a2r02","How I learned to swim","When I was a child, I was afraid of water. I never went into the sea with my friends. When I was twelve, my uncle decided to teach me.\nEvery morning that summer, we went to the beach early, when it was quiet. He was very patient. At first I only put my feet in the water. After two weeks, I could swim a little. By the end of the summer, I was swimming with my friends. Now swimming is my favourite sport.",
 [["How did the writer feel about water as a child?",["Happy","Afraid","Bored","Excited"],1,"I was afraid of water."],["Why did they go to the beach early?",["It was quiet","It was cold","The uncle worked later","It was cheaper"],0,"When it was quiet."],["What happened by the end of summer?",["The writer still couldn't swim","The writer was swimming with friends","The uncle left","The beach closed"],1,"I was swimming with my friends."]],
 [["afraid","feeling fear"],["patient","calm when something takes time"],["by the end of","not later than the end of"]]],
["a2r03","Phones at dinner","In many families, people look at their phones during meals. A recent survey found that 60% of young people use their phone at the dinner table.\nSome parents now have a 'no phones at dinner' rule. They say that family meals are a time to talk and listen to each other. Teenagers sometimes don't like the rule at first, but many say that conversations become more interesting.",
 [["What did the survey find?",["60% of young people use phones at dinner","All parents hate phones","Teenagers don't eat dinner","Phones are expensive"],0,"60% of young people use their phone at the dinner table."],["Why do some parents have this rule?",["To save money","Meals are a time to talk","Phones are dangerous","For homework"],1,"Family meals are a time to talk and listen."],["What do many teenagers say later?",["They are bored","Conversations become more interesting","They eat faster","They want new phones"],1,"Conversations become more interesting."]],
 [["survey","questions asked to many people"],["rule","what you must or mustn't do"],["teenager","a person aged 13 to 19"]]],
["a2r04","The Casbah of Algiers","The Casbah is the old part of Algiers. It has narrow streets, steep stairs and white houses close together. Many of the houses are hundreds of years old.\nIn 1992, UNESCO made the Casbah a World Heritage Site. Today, visitors come to see the old palaces, the mosques and the beautiful doors. Some houses need repairs, and the government and local people are working to protect them.",
 [["What are the streets like?",["Wide","Narrow with steep stairs","Long and flat","New"],1,"Narrow streets, steep stairs."],["What happened in 1992?",["The Casbah was built","It became a World Heritage Site","The palaces closed","Visitors stopped coming"],1,"UNESCO made it a World Heritage Site."],["What are people doing now?",["Building new towers","Working to protect the houses","Leaving the Casbah","Closing the mosques"],1,"Working to protect them."]],
 [["narrow","not wide"],["steep","going up quickly"],["protect","keep safe"]]],
["a2r05","A job advert","SUMMER JOB: Tour guide assistant\nWe are looking for a friendly student to help our tour guides in Tipaza from June to August.\nYou must speak English and French. Arabic is an advantage.\nYou have to work weekends but you don't have to work on Mondays.\nPay: 30,000 DA a month + free lunch.\nSend your CV to jobs@tipazatours.dz before 15 May.",
 [["When is the job?",["All year","June to August","Only in May","September to December"],1,"From June to August."],["Which languages must you speak?",["Arabic only","English and French","Spanish","German and English"],1,"You must speak English and French."],["When don't you have to work?",["Weekends","Mondays","Fridays","Every afternoon"],1,"You don't have to work on Mondays."]],
 [["tour guide","a person who shows tourists a place"],["advantage","something that helps you"],["CV","a document about your studies and work"]]],
["a2r06","My grandfather's shop","My grandfather opened a small shoe shop in 1975. He used to make every pair of shoes by hand. People came from other towns to buy his shoes because they were strong and comfortable.\nWhen he got older, my father started working with him. Today my father runs the shop. He sells shoes from factories, but he still makes some pairs by hand for special customers. I'd like to learn the job one day.",
 [["When did the grandfather open the shop?",["1957","1975","1995","2005"],1,"In 1975."],["Why did people come from other towns?",["The shoes were cheap","The shoes were strong and comfortable","The shop was big","It was open at night"],1,"Because they were strong and comfortable."],["What does the father do differently?",["He closed the shop","He sells factory shoes too","He only makes shoes by hand","He sells clothes"],1,"He sells shoes from factories."]],
 [["by hand","without machines"],["runs","manages"],["customer","a person who buys"]]],
["a2r07","Sleep and students","Many students don't sleep enough. Doctors say young adults need seven to nine hours of sleep every night. But during exams, a lot of students sleep only four or five hours.\nWithout enough sleep, it is harder to remember information and to concentrate. So studying all night is not a good idea. It's better to study a little every day, go to bed at a regular time and turn off your phone an hour before sleeping.",
 [["How many hours do young adults need?",["4 to 5","5 to 6","7 to 9","10 to 12"],2,"Seven to nine hours."],["What happens without enough sleep?",["You remember more","It's harder to concentrate","You get taller","Nothing"],1,"It is harder to remember and concentrate."],["Which is one piece of advice?",["Study all night","Turn off your phone before sleeping","Drink coffee at night","Sleep in the afternoon"],1,"Turn off your phone an hour before sleeping."]],
 [["concentrate","think carefully about one thing"],["regular","the same every time"],["remember","keep in your mind"]]],
["a2r08","An email from a hotel","Dear Mr Saïdi,\nThank you for booking a room at Hotel Atlas for 3–5 April. Your room is a double room with a sea view. Breakfast is included.\nCheck-in is from 2 p.m. and check-out is before 12 noon. Our hotel has free parking and a swimming pool.\nIf you have any questions, please reply to this email.\nBest regards,\nHotel Atlas",
 [["What kind of room did Mr Saïdi book?",["A single room","A double room with a sea view","A family room","A room without breakfast"],1,"A double room with a sea view."],["When must he leave the room?",["Before 2 p.m.","Before 12 noon","Before 10 a.m.","After 2 p.m."],1,"Check-out is before 12 noon."],["What does the hotel have?",["A gym","A swimming pool and free parking","A cinema","A shop"],1,"Free parking and a swimming pool."]],
 [["included","part of the price"],["check-in","arriving at a hotel"],["sea view","you can see the sea"]]],
["a2r09","The village festival","Every year in May, our village has a festival to celebrate the cherry harvest. People decorate the streets with flowers and lights. There is traditional music and dancing in the main square.\nFarmers sell cherries, jam and cakes. Children play games and old people tell stories. Many people who live in the city come back for the festival. It's the happiest weekend of the year.",
 [["What does the festival celebrate?",["The new year","The cherry harvest","A wedding","The end of school"],1,"The cherry harvest."],["Where is the music and dancing?",["At the school","In the main square","At the farm","In the mosque"],1,"In the main square."],["Who comes back for the festival?",["Tourists from Europe","People who live in the city","Only children","Nobody"],1,"Many people who live in the city come back."]],
 [["celebrate","have a party for a special event"],["harvest","collecting fruit or crops"],["decorate","make something beautiful"]]],
["a2r10","Online shopping","More and more Algerians buy things online. You can order clothes, books and electronics from your phone and pay when the package arrives.\nOnline shopping is quick and easy, and prices are often lower. But there are some problems. Sometimes the product looks different from the photo, or the delivery is late. Before you buy, you should read the reviews from other customers.",
 [["How can people pay?",["Only by card","When the package arrives","Before ordering in the shop","With gold"],1,"Pay when the package arrives."],["What is one problem?",["Prices are very high","The product can look different from the photo","You can't order books","It's too slow to order"],1,"The product looks different from the photo."],["What should you do before you buy?",["Call the shop","Read the reviews","Go to the market","Ask your teacher"],1,"Read the reviews."]],
 [["order","ask to buy something"],["delivery","bringing something to your home"],["review","an opinion written by a customer"]]],
["a2r11","My first day at work","Last Monday was my first day as a receptionist at a hospital. I arrived at half past seven because I was nervous. My manager, Mrs Boudiaf, showed me the building and introduced me to my colleagues.\nIn the morning, I answered the phone and helped patients find the right department. It was busy, but everybody was kind. At the end of the day, I was tired but proud.",
 [["What is the writer's job?",["Nurse","Doctor","Receptionist","Manager"],2,"A receptionist at a hospital."],["Why did the writer arrive early?",["The bus was early","She was nervous","The manager asked her","She lives near"],1,"Because I was nervous."],["How did the writer feel at the end?",["Angry and sad","Tired but proud","Bored","Ill"],1,"I was tired but proud."]],
 [["receptionist","a person who welcomes visitors"],["nervous","a little afraid"],["proud","happy about what you did"]]],
["a2r12","Too much sugar","Many drinks have a lot of sugar. A can of cola has about 35 grams of sugar. That's seven teaspoons! For better health, the World Health Organization advises adults to have less than about 25 grams of added sugar a day.\nToo much sugar is bad for your teeth and can make you put on weight. Water, milk and tea without sugar are better choices.",
 [["How much sugar is in a can of cola?",["About 5 grams","About 15 grams","About 35 grams","About 100 grams"],2,"About 35 grams."],["What is the recommended maximum for adults?",["10 grams","25 grams","50 grams","70 grams"],1,"No more than 25 grams of added sugar a day."],["Which is a better choice?",["Cola","Juice with sugar","Water","Energy drinks"],2,"Water, milk and tea without sugar."]],
 [["teaspoon","a small spoon"],["put on weight","become heavier"],["choice","what you decide to take"]]],
["a2r13","The robot teacher","In some schools in Japan, small robots help teachers in English classes. The robots can speak, ask questions and play games with the children.\nThe children like the robots because they are fun. But teachers say robots can't replace people. A good teacher understands when a student is sad or confused. Robots can help, but they can't care about students like a human teacher.",

["a2r14","A bad day","Yesterday was a terrible day for Lyes. First, he woke up late because there was no electricity and his phone was dead. Then he ran to the bus stop, but the bus had already left.\nHe took a taxi, but there was a lot of traffic. When he arrived at university, the exam was already starting. Luckily, the teacher let him in. He did the exam and, in the end, he got a good mark!",
 [["Why did Lyes wake up late?",["He went to bed late","No electricity and his phone was dead","He was ill","He forgot"],1,"There was no electricity and his phone was dead."],["How did he go to university?",["By bus","On foot","By taxi","By car"],2,"He took a taxi."],["What happened in the end?",["He missed the exam","He got a good mark","He went home","The teacher was angry"],1,"He got a good mark!"]],
 [["terrible","very bad"],["dead (phone)","with no battery"],["luckily","by good luck"]]],
["a2r15","Volunteering","Volunteers work without pay to help other people. In our town, a group of students volunteers every Saturday. They collect food and clothes for poor families, clean the beach and visit old people in a care home.\nVolunteering is good for the community, and it's also good for the volunteers. They meet new people, learn new skills and feel useful. Anyone can join: you only need some free time.",
 [["What is a volunteer?",["Someone who works for money","Someone who helps without pay","A teacher","A doctor"],1,"Volunteers work without pay."],["Which activity is mentioned?",["Building houses","Cleaning the beach","Teaching maths","Cooking in restaurants"],1,"Clean the beach."],["What do you need to join?",["Money","A car","Some free time","A diploma"],2,"You only need some free time."]],
 [["collect","bring things together"],["community","the people in a place"],["skill","something you can do well"]]],
["a2r16","The weather in Algeria","Algeria is a very big country, so the weather is different in each region. On the coast, summers are hot and winters are mild and rainy. In the mountains, it can snow in winter.\nIn the Sahara, the days are very hot, especially in summer, but the nights can be cold. It almost never rains there. The best time to visit the desert is between November and March.",
 [["What are winters like on the coast?",["Very cold with snow","Mild and rainy","Very hot","Dry"],1,"Winters are mild and rainy."],["Where can it snow?",["On the coast","In the mountains","In the Sahara","In Algiers every year"],1,"In the mountains."],["When is the best time to visit the desert?",["June to August","November to March","Only in July","April to June"],1,"Between November and March."]],
 [["coast","land next to the sea"],["mild","not too hot or cold"],["region","an area of a country"]]],
["a2r17","How to make friends at university","Starting university can be lonely. Here are some tips. First, join a club: sport, music, theatre or a language club. You'll meet people with the same interests.\nSecond, talk to the people next to you in class. Ask simple questions like 'Did you understand the homework?'. Third, say yes to invitations, even if you are shy. Finally, be patient: real friendships take time.",
 [["What is the first tip?",["Stay at home","Join a club","Change university","Study alone"],1,"Join a club."],["What kind of question can you ask in class?",["Personal questions","Did you understand the homework?","How much money do you have?","Nothing"],1,"Did you understand the homework?"],["What does the writer say about friendships?",["They are quick","They take time","They are not important","They are expensive"],1,"Real friendships take time."]],
 [["lonely","sad because you are alone"],["club","a group with the same activity"],["shy","not comfortable with new people"]]],
["a2r18","A famous Algerian","Assia Djebar (1936–2015) was an Algerian writer and film director. She wrote novels in French about the lives of Algerian women and the history of her country.\nIn 2005, she became the first writer from North Africa to join the Académie française, a very famous institution in France. Her books are translated into more than twenty languages, and students all over the world study them.",
 [["What was Assia Djebar?",["A singer","A writer and film director","A doctor","A politician"],1,"A writer and film director."],["What did she write about?",["Sport","The lives of Algerian women and history","Cooking","Science"],1,"The lives of Algerian women and the history of her country."],["What happened in 2005?",["She was born","She joined the Académie française","She made her first film","She moved to Algeria"],1,"She joined the Académie française."]],
 [["novel","a long story in a book"],["institution","an important organisation"],["translated","changed into another language"]]],
["a2r19","Recycling at home","Recycling helps the environment. Plastic bottles, paper, glass and metal cans can be used again to make new things.\nAt home, you can have different bags for different rubbish. You should wash bottles and cans before you recycle them. You can also reduce rubbish: use a cloth bag for shopping and a water bottle you can use again.",
 [["What can be recycled?",["Only paper","Plastic, paper, glass and metal","Food","Clothes only"],1,"Plastic bottles, paper, glass and metal cans."],["What should you do before recycling bottles?",["Break them","Wash them","Paint them","Sell them"],1,"Wash bottles and cans."],["How can you reduce rubbish?",["Use a cloth bag","Buy more plastic","Throw away everything","Use paper cups"],0,"Use a cloth bag for shopping."]],
 [["environment","nature around us"],["rubbish","things you throw away"],["reduce","make less"]]],
["a2r20","A trip to the desert","Last spring, Nadia went on a trip to Djanet in the south of Algeria. She travelled with a group of twelve people and a Tuareg guide. They slept in tents and cooked dinner on a fire.\nDuring the day, they walked in the Tassili n'Ajjer, where they saw very old rock paintings of animals and people. At night, the sky was full of stars. Nadia says it was the most beautiful trip of her life.",
 [["Where did Nadia go?",["Oran","Djanet","Tunisia","The coast"],1,"A trip to Djanet."],["Where did they sleep?",["In a hotel","In tents","In a car","In a house"],1,"They slept in tents."],["What did they see in the Tassili n'Ajjer?",["A big city","Old rock paintings","The sea","Snow"],1,"Very old rock paintings."]],
 [["guide","a person who shows the way"],["tent","a small house made of cloth"],["rock painting","a picture painted on stone"]]]

/* ---- A2 writing 1-20 ---- */
const CK_A2=["I used linking words (and, but, so, because, then).","I checked my verb tenses.","I organised my ideas in a clear order."];
addWrites("A2",[
["a2w01","My last holiday","Write about your last holiday: where you went, who with, what you did and how it was.",70,["Last summer / winter I went to…","I went with…","We stayed in…","Every day we…","The best part was…"],"Last summer I went to Béjaïa with my two cousins. We stayed in a small hotel near the beach for one week. Every morning we swam in the sea, and in the afternoon we visited the old town and Cap Carbon. One evening we ate grilled fish in a restaurant by the port. The best part was the view from the mountain at sunset. It was a wonderful holiday and I want to go back next year.",[...CK_A2,"I used the past simple."]],
["a2w02","An email to a friend about your news","Write an email to a friend you haven't seen for a long time. Tell them your news (studies, work, family).",70,["Hi …, how are you?","It's been a long time!","I've just…","I'm now…","Let's meet when…"],"Hi Sabrina,\nHow are you? It's been a long time! I've got some news. I've just finished my second year at university and I passed all my exams. I'm now working part-time in a pharmacy, so I'm very busy. My brother got married last month and the wedding was beautiful. How are your studies? Let's meet when you come back to Oran.\nLove,\nKenza",[...CK_A2,"I used the present perfect for news (I've just…)."]],
["a2w03","Describe a person you admire","Write about a person you admire. Who are they? What are they like? Why do you admire them?",70,["The person I admire most is…","He / She is very…","He / She has always…","I admire him / her because…"],"The person I admire most is my mother. She is a nurse and she works very hard. She is patient, kind and always calm, even when she is tired. She has always helped other people in our neighbourhood. When I was ill, she stayed with me every night. I admire her because she never complains and she always finds time for her family.",[...CK_A2,"I gave reasons with because."]],
["a2w04","Advice for a new student","A new student is coming to your university. Write a message with advice.",60,["You should…","You shouldn't…","Don't forget to…","It's a good idea to…"],"Welcome to the university! Here is some advice. You should arrive early on the first day because the buildings are big. It's a good idea to join a club to meet people. You should go to the library: it's quiet and it has free Wi-Fi. You shouldn't leave your work until the last minute before exams. Don't forget to bring your student card every day.",[...CK_A2,"I used should / shouldn't + base verb."]],
["a2w05","A complaint email","You bought a pair of shoes online, but they are the wrong size. Write an email to the shop.",70,["Dear Sir or Madam,","I am writing because…","I ordered … on…","Unfortunately,…","Could you please…?","I look forward to your reply."],"Dear Sir or Madam,\nI am writing because there is a problem with my order. I ordered a pair of black shoes, size 39, on 3 May. Unfortunately, the shoes I received are size 41, so they are too big. Could you please send me the correct size or give me my money back? I can send the shoes back this week.\nI look forward to your reply.\nYours faithfully,\nIkram Belaid",["I used a formal greeting and ending.","I explained the problem clearly.","I asked politely for a solution."]],
["a2w06","My hometown: then and now","Write about how your town has changed. What did it use to be like? What is it like now?",70,["When I was a child, my town used to…","There didn't use to be…","Now there is / are…","I think it's better / worse because…"],"When I was a child, my town used to be very quiet. There didn't use to be many cars, and children played in the streets. There was only one small shop. Now there are big supermarkets, cafés and a new hospital. The roads are busier and there is more noise. I think it's better now because life is easier, but I miss the quiet streets.",[...CK_A2,"I used used to / didn't use to."]],
["a2w07","A day you will never forget","Write about a special day in your life. What happened?",80,["I will never forget the day when…","It was…","First,… Then,… After that,…","In the end,…","I felt…"],"I will never forget the day I got my baccalaureate results. It was a hot day in July. First, I was very nervous and I couldn't eat breakfast. Then my brother checked the results on his phone. He looked at me and smiled. I got a very good mark! After that, my family made a big lunch and our neighbours came to congratulate me. In the end, it was one of the happiest days of my life.",[...CK_A2,"I used sequence words (first, then, after that)."]],
["a2w08","A review of a restaurant or café","Write a short review of a restaurant or café you know.",70,["Last week I went to…","The food was…","The service was…","The prices are…","I recommend it / I don't recommend it because…"],"Last week I went to Café Zahra in the city centre with my friends. The place is small but very clean and modern. I had a chocolate cake and a mint tea. The cake was delicious and the tea was hot and sweet. The service was fast and friendly. The prices are reasonable for students. I recommend it, especially in the afternoon when it is quiet.",[...CK_A2,"I gave my opinion with reasons."]],
["a2w09","Plans for next year","What are you going to do next year? Write about your plans and hopes.",70,["Next year I'm going to…","I'd like to…","I might…","I hope to…"],"Next year I'm going to start a master's degree in economics. I'd like to improve my English because many articles are in English. I'm going to take an online course and practise every day. I might look for a part-time job in a bank to get some experience. I also hope to travel to Turkey with my friends in the summer.",[...CK_A2,"I used going to, would like and might."]],
["a2w10","Instructions: how to make tea","Explain to a foreign friend how to make Algerian mint tea, step by step.",60,["First,…","Next,…","Then,…","After that,…","Finally,…"],"First, boil some water. Next, put two spoons of green tea in the teapot and add a little hot water. Wash the tea quickly and throw this water away. Then add fresh mint, sugar and more hot water. After that, let it rest for five minutes. Finally, pour the tea into small glasses from high above to make foam. Enjoy!",["I used imperatives (Boil, Put…).","The steps are in the right order.","I used sequence words."]],
["a2w11","An invitation to a party","Write an invitation to a party. Include the reason, date, time, place and what to bring.",50,["You're invited to…","It's on … at …","The party is at…","Please bring…","Let me know if you can come."],"Hi everyone!\nYou're invited to my graduation party! It's on Saturday 20 June at 7 p.m. The party is at my house, 12 Rue des Oliviers. There will be music, games and lots of food. Please bring your favourite dessert if you can. Let me know if you can come by Thursday.\nSee you there,\nAmine",["I included the date, time and place.","I said what to bring.","I asked for a reply."]],
["a2w12","Compare two places","Compare the city and the countryside. Which do you prefer?",80,["The city is … than the countryside.","The countryside is not as … as…","On the other hand,…","I prefer … because…"],"The city is busier and noisier than the countryside, but there are more jobs and services. There are hospitals, universities and big shops. The countryside is not as exciting as the city, but it is calmer and the air is cleaner. On the other hand, there is less public transport. I prefer the countryside because I love nature and I need quiet to study.",[...CK_A2,"I used comparatives and as … as."]],
["a2w13","My experience of learning English","Write about your experience of learning English. What have you done? What is easy or difficult?",80,["I have studied English for…","I have never…","For me, … is easy, but … is difficult.","To improve, I…"],"I have studied English for six years, at school and at university. I have watched many films in English, but I have never visited an English-speaking country. For me, reading is easy, but speaking is difficult because I'm shy. To improve, I listen to podcasts on the bus and I practise with an online coach every day. I want to speak more confidently next year.",[...CK_A2,"I used the present perfect for experience."]],
["a2w14","A thank-you note","Write a note to thank someone who helped you.",50,["Dear…","Thank you so much for…","It was very kind of you to…","Because of your help, I…","Best wishes,"],"Dear Mr Khelifi,\nThank you so much for your help with my project. It was very kind of you to give me your time and your books. Because of your help, I got a very good mark and I learned a lot about marketing. I really appreciate it.\nBest wishes,\nLamia",["I said what the person did.","I explained the result.","I used a friendly, polite tone."]],
["a2w15","A problem in your town","Write a short message to your town's website about a problem (rubbish, traffic, noise…) and suggest a solution.",80,["I'm writing about…","The problem is that…","This is bad because…","I think the town should…","For example,…"],"I'm writing about the rubbish near the central market. The problem is that people leave bags of rubbish on the street every evening, and the bins are always full. This is bad because it smells and it's dirty for children. I think the town should put more bins and collect the rubbish twice a day. For example, they could collect it in the morning and in the evening.",[...CK_A2,"I suggested a solution with should."]],
["a2w16","A story: a surprise","Write a short story that starts: 'When I opened the door, I couldn't believe my eyes…'",80,["When I opened the door,…","I was … -ing when…","Suddenly,…","In the end,…"],"When I opened the door, I couldn't believe my eyes. All my friends were standing in the living room with balloons and a big cake. I was coming home from a long day at work and I was very tired. Suddenly, they all shouted 'Happy birthday!'. My sister had organised everything without telling me. We laughed, ate cake and danced until midnight. In the end, it was the best birthday ever.",[...CK_A2,"I used the past continuous and past simple."]],
["a2w17","My daily habits: healthy or not?","Are your daily habits healthy? Write about what you eat, sleep and do.",70,["I usually…","I don't … enough.","I eat too much / too many…","I should … more.","From now on, I'm going to…"],"I think my habits are not very healthy. I usually sleep only six hours because I study late. I don't drink enough water and I eat too many sweets. I also sit at my computer for hours. However, I walk to university every day, which is good. I should sleep more and eat more fruit. From now on, I'm going to go to bed before midnight.",[...CK_A2,"I used too, enough and should."]],
["a2w18","A message to a landlord","Write a message to your landlord. Something is broken in your flat. Explain and ask for help.",60,["Dear Mr / Mrs…","I'm writing to tell you that…","It has been broken since…","Could you…?","Thank you in advance."],"Dear Mr Hamidi,\nI'm writing to tell you that the water heater in my flat is broken. It has been broken since Sunday, so we have no hot water. Could you send someone to repair it this week, please? I'm at home every afternoon after 3 p.m.\nThank you in advance.\nBest regards,\nNassim",["I explained what is broken and since when.","I asked politely.","I gave my availability."]],
["a2w19","My favourite film or book","Write about a film or book you like. What is it about? Why do you like it?",80,["My favourite film / book is…","It's about…","The main character is…","I like it because…","I recommend it to…"],"My favourite book is 'The Little Prince' by Antoine de Saint-Exupéry. It's about a little prince who travels from planet to planet and meets strange adults. The main character is curious and honest. I like it because it is simple but very deep. It teaches us that the most important things can't be seen with the eyes. I recommend it to everyone, children and adults.",[...CK_A2,"I explained the story and my opinion."]],
["a2w20","A letter to your future self","Write a letter to yourself in five years. What do you hope you will be doing?",80,["Dear future me,","I hope you have…","Are you still…?","I think you will…","Don't forget to…"],"Dear future me,\nI hope you have finished your studies and found a good job. Are you still living in Constantine, or did you move to a new city? I think you will speak English fluently by now, because I'm working hard every day. I hope you have travelled to at least two new countries. Don't forget to call Mum every day and to stay kind and patient.\nWith love,\nMe (2026)",[...CK_A2,"I used will and present perfect for hopes."]]
]);

addStories("A2",[
["a2s01","My Weekend",[
 ["Today, I want to tell you about my weekend.","اليوم أريد أن أحدثكم عن عطلة نهاية الأسبوع."],
 ["On the weekend, I have more free time.","في عطلة نهاية الأسبوع، يكون لدي وقت فراغ أكثر."],
 ["I usually wake up late and have a slow morning.","عادةً أستيقظ متأخرًا وأقضي صباحًا هادئًا."],
 ["I make breakfast and drink a cup of coffee.","أحضّر الفطور وأشرب كوبًا من القهوة."],
 ["Sometimes, I read a book or watch a film.","أحيانًا أقرأ كتابًا أو أشاهد فيلمًا."],
 ["In the afternoon, I meet my friends.","في فترة الظهيرة، ألتقي بأصدقائي."],
 ["We go for a walk or have lunch together.","نذهب في نزهة أو نتناول الغداء معًا."],
 ["Sometimes, I stay at home and spend time with my family.","أحيانًا أبقى في المنزل وأقضي وقتًا مع عائلتي."],
 ["In the evening, I prepare my clothes and books for Sunday.","في المساء، أجهّز ملابسي وكتبي ليوم الأحد."],
 ["The weekend helps me relax and feel ready for a new week.","تساعدني عطلة نهاية الأسبوع على الاسترخاء والاستعداد لأسبوع جديد."]],
 [["How does the speaker usually start the weekend?",["Wakes up early","Wakes up late with a slow morning","Goes to work","Goes running"],1,"I usually wake up late and have a slow morning."],["Who does the speaker meet in the afternoon?",["Colleagues","Friends","Teachers","Neighbours"],1,"I meet my friends."],["How does the weekend help?",["It makes the speaker tired","It helps the speaker relax","It's boring","It's too short"],1,"It helps me relax and feel ready."]]],
["a2s02","The Wrong Bus",[
 ["Last Monday, Salim was late for a job interview.","يوم الاثنين الماضي، كان سليم متأخرًا عن مقابلة عمل."],
 ["He ran to the bus stop and jumped on the first bus.","ركض إلى محطة الحافلات وقفز إلى أول حافلة."],
 ["After ten minutes, he looked out of the window.","بعد عشر دقائق، نظر من النافذة."],
 ["He didn't recognise the streets.","لم يتعرف على الشوارع."],
 ["\"Excuse me, does this bus go to the city centre?\" he asked.","سأل: \"عذرًا، هل تذهب هذه الحافلة إلى وسط المدينة؟\""],
 ["\"No, it goes to the airport,\" said the driver.","قال السائق: \"لا، إنها تذهب إلى المطار.\""],
 ["Salim got off and called the company.","نزل سليم واتصل بالشركة."],
 ["He explained the problem and said sorry.","شرح المشكلة واعتذر."],
 ["The manager laughed and said, \"Come tomorrow at ten.\"","ضحك المدير وقال: \"تعال غدًا في الساعة العاشرة.\""],
 ["The next day, Salim checked the bus number twice, and he got the job!","في اليوم التالي، تحقق سليم من رقم الحافلة مرتين، وحصل على الوظيفة!"]],
 [["Where was Salim going?",["To the airport","To a job interview","To university","Home"],1,"He was late for a job interview."],["Where did the bus go?",["The city centre","The airport","The beach","The hospital"],1,"It goes to the airport."],["What happened in the end?",["He lost the job","He got the job","He went home","He took a taxi"],1,"He got the job!"]]],
["a2s03","Grandpa's Garden",[
 ["My grandfather has a big garden behind his house.","لدى جدي حديقة كبيرة خلف بيته."],
 ["He grows tomatoes, peppers, beans and mint.","يزرع الطماطم والفلفل والفاصولياء والنعناع."],
 ["Every morning, he gets up before sunrise to water the plants.","كل صباح، يستيقظ قبل شروق الشمس ليسقي النباتات."],
 ["When I was small, I used to help him.","عندما كنت صغيرًا، كنت أساعده."],
 ["He taught me the names of all the plants.","علّمني أسماء كل النباتات."],
 ["He always said, \"A garden is like a friend. You have to take care of it.\"","كان يقول دائمًا: \"الحديقة مثل الصديق، يجب أن تعتني بها.\""],
 ["Now he is eighty years old, but he still works in his garden.","الآن عمره ثمانون عامًا، لكنه لا يزال يعمل في حديقته."],
 ["In summer, he gives vegetables to all the neighbours.","في الصيف، يعطي الخضروات لكل الجيران."],
 ["I hope I can have a garden like his one day.","آمل أن تكون لي حديقة مثل حديقته يومًا ما."]],
 [["What does the grandfather grow?",["Oranges and lemons","Tomatoes, peppers, beans and mint","Flowers only","Wheat"],1,"Tomatoes, peppers, beans and mint."],["When does he water the plants?",["At night","Before sunrise","At noon","Never"],1,"Before sunrise."],["How old is he now?",["Sixty","Seventy","Eighty","Ninety"],2,"Eighty years old."]]],
["a2s04","The Mobile Phone",[
 ["Ines got her first mobile phone when she was fifteen.","حصلت إيناس على أول هاتف محمول عندما كان عمرها خمسة عشر عامًا."],
 ["At first, she used it to call her parents.","في البداية، كانت تستعمله للاتصال بوالديها."],
 ["Then she started using it all the time.","ثم بدأت تستعمله طوال الوقت."],
 ["She watched videos until late at night.","كانت تشاهد الفيديوهات حتى وقت متأخر من الليل."],
 ["Her marks at school became worse.","أصبحت علاماتها في المدرسة أسوأ."],
 ["One day, her teacher asked, \"Are you sleeping enough?\"","في أحد الأيام، سألتها معلمتها: \"هل تنامين بما يكفي؟\""],
 ["Ines thought about it and decided to change.","فكرت إيناس في الأمر وقررت أن تتغير."],
 ["Now she turns off her phone at ten o'clock.","الآن تطفئ هاتفها في الساعة العاشرة."],
 ["She reads a book before sleeping.","تقرأ كتابًا قبل النوم."],
 ["Her marks are better, and she feels much happier.","علاماتها أفضل، وتشعر بسعادة أكبر بكثير."]],
 [["How old was Ines when she got her phone?",["Twelve","Fifteen","Eighteen","Ten"],1,"When she was fifteen."],["What was the problem?",["She lost her phone","She used it too much and her marks got worse","Her phone broke","She had no friends"],1,"She watched videos until late and her marks became worse."],["What does she do now?",["Turns off her phone at ten","Sells her phone","Watches more videos","Sleeps at school"],0,"She turns off her phone at ten o'clock."]]],
["a2s05","A Kind Stranger",[
 ["Leila was travelling to Constantine by train.","كانت ليلى مسافرة إلى قسنطينة بالقطار."],
 ["When she arrived, she couldn't find her wallet.","عندما وصلت، لم تجد محفظتها."],
 ["She had no money and no ticket for the bus.","لم يكن معها مال ولا تذكرة للحافلة."],
 ["She was very worried.","كانت قلقة جدًا."],
 ["An old woman saw her and asked, \"Are you all right?\"","رأتها امرأة عجوز وسألتها: \"هل أنتِ بخير؟\""],
 ["Leila explained the problem.","شرحت ليلى المشكلة."],
 ["The woman gave her money for the bus and a sandwich.","أعطتها المرأة مالًا للحافلة وشطيرة."],

 ["Leila never forgot those words.","لم تنسَ ليلى تلك الكلمات أبدًا."]],
 [["What did Leila lose?",["Her phone","Her wallet","Her bag","Her ticket only"],1,"She couldn't find her wallet."],["What did the old woman give her?",["A phone","Money for the bus and a sandwich","A taxi","A map"],1,"Money for the bus and a sandwich."],["What did the woman ask in return?",["Money","To help someone else one day","A phone number","Nothing at all, she left"],1,"Help someone else one day."]]],
["a2s06","Learning to Cook",[
 ["Youcef moved to a new city for his studies.","انتقل يوسف إلى مدينة جديدة من أجل دراسته."],

["a2s08","A Day in Ghardaïa",[
 ["Last spring, my class went on a trip to Ghardaïa.","في الربيع الماضي، ذهب صفنا في رحلة إلى غرداية."],
 ["Ghardaïa is in the M'zab valley, in the desert.","تقع غرداية في وادي ميزاب، في الصحراء."],
 ["The old towns were built hundreds of years ago.","بُنيت المدن القديمة منذ مئات السنين."],
 ["The houses are small and close together.","البيوت صغيرة ومتقاربة."],
 ["They are painted in soft colours like white, blue and pink.","وهي مطلية بألوان هادئة مثل الأبيض والأزرق والوردي."],
 ["We visited the market and saw beautiful carpets.","زرنا السوق ورأينا سجادًا جميلًا."],
 ["Our guide explained how people save water in the desert.","شرح لنا المرشد كيف يقتصد الناس الماء في الصحراء."],
 ["In the evening, the sky turned orange and red.","في المساء، تحولت السماء إلى البرتقالي والأحمر."],
 ["I took many photos.","التقطت صورًا كثيرة."],

["a2s09","The Exam",[
 ["Mira had an important maths exam on Thursday.","كان لدى ميرا امتحان رياضيات مهم يوم الخميس."],
 ["Maths was her most difficult subject.","كانت الرياضيات أصعب مادة عندها."],
 ["She was afraid she would fail.","كانت تخاف أن ترسب."],
 ["Her older brother offered to help her.","عرض أخوها الأكبر أن يساعدها."],
 ["Every evening for two weeks, they studied together.","كل مساء لمدة أسبوعين، درسا معًا."],
 ["He explained the exercises slowly and patiently.","كان يشرح التمارين ببطء وصبر."],
 ["Little by little, Mira started to understand.","شيئًا فشيئًا، بدأت ميرا تفهم."],
 ["On the day of the exam, she felt calm.","في يوم الامتحان، شعرت بالهدوء."],
 ["A week later, she got her result: sixteen out of twenty!","بعد أسبوع، حصلت على نتيجتها: ستة عشر من عشرين!"],

 [["Which subject was difficult for Mira?",["English","Maths","History","Physics"],1,"Maths was her most difficult subject."],["Who helped her?",["Her teacher","Her older brother","Her friend","Her mother"],1,"Her older brother."],["What was her result?",["10/20","12/20","16/20","20/20"],2,"Sixteen out of twenty."]]],
["a2s10","The Old Photograph",[
 ["One rainy afternoon, Amel was cleaning the cupboard.","في أحد الأيام الممطرة بعد الظهر، كانت آمال تنظف الخزانة."],
 ["She found an old box full of photographs.","وجدت صندوقًا قديمًا مليئًا بالصور."],
 ["In one photo, a young woman was standing in front of a school.","في إحدى الصور، كانت امرأة شابة واقفة أمام مدرسة."],
 ["She was smiling and holding some books.","كانت تبتسم وتحمل بعض الكتب."],

 ["\"That's me, on my first day as a teacher,\" her mother said.","قالت أمها: \"هذه أنا، في أول يوم لي كمعلمة.\""],
 ["Amel was surprised. Her mother looked so young!","تفاجأت آمال. كانت أمها تبدو صغيرة جدًا!"],
 ["Her mother told her stories about her first students.","حكت لها أمها قصصًا عن طلابها الأوائل."],
 ["They laughed and talked for hours.","ضحكتا وتحدثتا لساعات."],
 ["Amel put the photo in a frame on her desk.","وضعت آمال الصورة في إطار على مكتبها."]],
 [["What did Amel find?",["A letter","A box of photographs","Money","A book"],1,"An old box full of photographs."],["Who was the woman in the photo?",["Amel's grandmother","Amel's teacher","Amel's mother","A stranger"],2,"That's me, on my first day as a teacher."],["What did Amel do with the photo?",["Threw it away","Put it in a frame on her desk","Gave it to a friend","Sold it"],1,"She put the photo in a frame on her desk."]]]
