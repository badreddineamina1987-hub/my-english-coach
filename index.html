<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="My English Coach: a free personal English coach from A1 to B2 with a placement test, daily lessons, listening, UK and US pronunciation and IELTS preparation. Created by Dr. Amina Badreddine, University M'Hamed Bougara, Boumerdes.">
<meta property="og:title" content="My English Coach"><meta property="og:description" content="Free English coach from A1 to B2, with IELTS preparation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235427e6'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='28' fill='white' text-anchor='middle'%3EAa%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>My English Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Gentium+Book+Plus:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: photo-led learning site — violet top bar, bold hero with offset colour blocks behind a photo, gradient level tiles, card catalogue, deep-violet feature band */
:root{
  --bg:#fbfaff; --surface:#ffffff; --surface-2:#f4f1fd; --line:#e4e0f2; --line-2:#cfc8e8;
  --ink:#18122e; --muted:#625c7a; --deep:#1e0b4b; --deep-ink:#ffffff;
  --nav:#5427e6; --nav-ink:#ffffff; --nav-2:rgba(255,255,255,.14);
  --side:#1e0b4b; --side-2:#2c1868; --side-ink:#ffffff; --side-muted:#c9bdf5;
  --accent:#5427e6; --accent-ink:#ffffff; --accent-soft:#eee8ff;
  --hot:#ff4f3a; --hot-soft:#ffe9e5; --sun:#ffc53d;
  --good:#0e8f69; --good-soft:#ddf6ee; --bad:#d92d3a; --bad-soft:#fde6e8;
  --a1:#14a6c2; --a2:#3d5bff; --b1:#8b5cf6; --b2:#ff5a4e;
  --ga1:linear-gradient(135deg,#2bd4a4,#14a6c2); --ga2:linear-gradient(135deg,#5aa9ff,#3d5bff);
  --gb1:linear-gradient(135deg,#f06ba8,#8b5cf6); --gb2:linear-gradient(135deg,#ffb547,#ff5a4e);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-ipa:"Gentium Book Plus","Noto Sans","Lucida Sans Unicode",serif;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(30,11,75,.05),0 8px 24px -12px rgba(30,11,75,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0a1f; --surface:#171230; --surface-2:#211a42; --line:#2e2656; --line-2:#3e3570;
  --ink:#f1eeff; --muted:#a9a2c8; --deep:#0a0618; --deep-ink:#ffffff;
  --nav:#2a1a78; --nav-ink:#ffffff; --nav-2:rgba(255,255,255,.12);
  --side:#0a0618; --side-2:#211a42; --side-ink:#f1eeff; --side-muted:#a9a2c8;
  --accent:#9b80ff; --accent-ink:#0e0a1f; --accent-soft:#2a2160;
  --hot:#ff7563; --hot-soft:#3d1e1a; --sun:#ffd166;
  --good:#4fd6a0; --good-soft:#123528; --bad:#ff8592; --bad-soft:#3b1a22;
  --a1:#3fd1c0; --a2:#7d93ff; --b1:#b48bff; --b2:#ff8a70;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0a1f; --surface:#171230; --surface-2:#211a42; --line:#2e2656; --line-2:#3e3570;
  --ink:#f1eeff; --muted:#a9a2c8; --deep:#0a0618; --deep-ink:#ffffff;
  --nav:#2a1a78; --nav-ink:#ffffff; --nav-2:rgba(255,255,255,.12);
  --side:#0a0618; --side-2:#211a42; --side-ink:#f1eeff; --side-muted:#a9a2c8;
  --accent:#9b80ff; --accent-ink:#0e0a1f; --accent-soft:#2a2160;
  --hot:#ff7563; --hot-soft:#3d1e1a; --sun:#ffd166;
  --good:#4fd6a0; --good-soft:#123528; --bad:#ff8592; --bad-soft:#3b1a22;
  --a1:#3fd1c0; --a2:#7d93ff; --b1:#b48bff; --b2:#ff8a70;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;letter-spacing:-.025em}
h2{font-size:clamp(22px,3vw,27px);font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.muted{color:var(--muted)}
.fr{display:none;color:var(--muted);font-style:italic;font-size:.92em}
body.show-fr .fr{display:block}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--nav);color:var(--nav-ink);box-shadow:0 2px 14px -6px rgba(30,11,75,.5)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--nav)}
.tn-in{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:22px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;background:none;border:none;padding:0;flex:none}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.01em}
.logo-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#fff;color:#5427e6;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.04em;flex:none}
.nav{display:flex;gap:2px;align-items:stretch;min-width:0;align-self:stretch}
.tab{display:flex;align-items:center;gap:8px;background:transparent;border:none;color:rgba(255,255,255,.78);padding:0 12px;font-weight:700;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent;border-top:3px solid transparent;transition:color .15s,border-color .15s}
.tab .ic{display:none}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--sun)}
.tab .count{display:none}
.tn-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.side-pill{display:flex;align-items:center;gap:6px;font-size:14px;color:rgba(255,255,255,.85)}
.side-pill b{font-family:var(--f-display);color:#fff}
.toggle{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:6px 8px 6px 12px;font-size:14px;font-weight:700}
.toggle .ic{width:18px;height:18px}
.toggle .sw{width:32px;height:18px;border-radius:99px;background:var(--nav-2);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;opacity:.7;transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--hot)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px);opacity:1}
#levelPill{background:#fff;color:#5427e6;border-radius:999px;padding:6px 14px;font-family:var(--f-display);font-weight:800;font-size:14px;white-space:nowrap}
.main{min-width:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:34px 48px}
.main-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* ---------- generic ---------- */
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.note{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:11px 20px;border-radius:12px;font-weight:700;transition:transform .12s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line-2)}
.btn.small{padding:8px 14px;font-size:15px;border-radius:10px}
.btn.hot{background:var(--hot);border-color:var(--hot);color:#fff}
.banner{border-radius:var(--r);padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid transparent}
.banner p{min-width:0;flex:1 1 260px}
.linkbtn{background:none;border:none;color:var(--accent);text-decoration:underline;padding:0;font-weight:700}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--b2));border-radius:99px;transition:width .4s}
input[type=text],textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:160px;resize:vertical}
.ielts-promo{flex-direction:row;align-items:center;gap:16px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;background:linear-gradient(120deg,var(--surface),var(--hot-soft))}
.ielts-promo:hover{border-color:var(--hot)}
.ielts-promo .ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--hot);color:#fff;flex:none}
.ielts-promo b{font-family:var(--f-display);font-size:20px}
.ielts-promo>.ic:last-child{margin-left:auto;color:var(--hot)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;min-width:480px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tips div{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.reading{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.reading p{display:grid;grid-template-columns:28px 1fr;gap:6px}
.pk{font-family:var(--f-display);color:var(--accent)}
.chart-wrap{overflow-x:auto}
.chart{width:100%;max-width:560px;min-width:340px;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cue{border:2px dashed var(--line-2);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.cue b{font-family:var(--f-display);font-size:20px}
.cue ul{margin:0;padding-left:20px}
.timer{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.timer.live{color:var(--hot)}
.wfb{display:flex;flex-direction:column;gap:14px;background:var(--surface-2);border-radius:var(--r);padding:18px}
.band-big{display:flex;align-items:baseline;gap:10px}
.band-big span{font-family:var(--f-display);font-weight:800;font-size:54px;color:var(--accent);line-height:1}
.band-big small{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.crit div{background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.crit .band{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent)}
.wfb ul{margin:6px 0 0;padding-left:20px}
.donate{flex-direction:row;gap:18px;align-items:flex-start;border-color:var(--hot);background:linear-gradient(140deg,var(--surface),var(--hot-soft))}
.don-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--hot);color:#fff;flex:none}
.pay{display:grid;gap:8px;background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;border:1px solid var(--line)}
.pay div{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.pl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:130px}
.pv{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;user-select:all;overflow-wrap:anywhere}
@media (max-width:620px){.donate{flex-direction:column}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:15px;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.hero>*{position:relative}
.hero-copy{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-copy h2{font-size:clamp(24px,3.4vw,32px)}
.ring{width:150px;height:150px}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:12}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-t{font-family:var(--f-display);font-weight:800;font-size:34px;fill:var(--ink);text-anchor:middle}
.ring-s{font-size:11px;fill:var(--muted);text-anchor:middle;letter-spacing:.08em;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--tc)}
.tile .ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.tile .tn{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.tile .tl{font-weight:700}
.tile .ts{font-size:13px;color:var(--muted)}
.tile .progress span{background:var(--tc)}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lvl-step{border-radius:14px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;border:1px solid transparent;min-width:0}
.lvl-step .code{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--lc)}
.lvl-step .nm{font-size:13px;color:var(--muted)}
.lvl-step .pc{font-size:13px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.lvl-step.on{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 10%,var(--surface))}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{border:1px dashed var(--line-2);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--muted)}

/* ---------- dashboard ---------- */
.d-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center;padding-block:12px 20px}
.d-hero .hcopy{display:flex;flex-direction:column;gap:18px;min-width:0}
.d-hero h1{font-size:clamp(40px,5.6vw,68px);line-height:1;letter-spacing:-.035em}
.d-hero h1 em{font-style:normal;color:var(--accent)}
.cont{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 16px;max-width:520px}
.cont .ic{color:var(--accent)}
.cont span{font-size:15px}
.proof{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted)}
.proof b{color:var(--ink);font-family:var(--f-display)}
.avs{display:flex}
.avs i{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);margin-left:-10px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff}
.avs i:first-child{margin-left:0}
.photo{position:relative;aspect-ratio:4/3.4;max-width:100%;isolation:isolate}
.photo .blk{position:absolute;border-radius:28px;z-index:-1}
.photo .k1{inset:-4% 16% 30% -6%;background:var(--accent)}
.photo .k2{inset:38% -5% -6% 30%;background:var(--hot)}
.photo .k1::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.25;background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1.4px);background-size:7px 7px}
.photo img,.photo .ph{position:absolute;inset:6% 4% 6% 6%;width:90%;height:88%;object-fit:cover;border-radius:22px;box-shadow:0 24px 50px -24px rgba(30,11,75,.55)}
.photo .ph{display:grid;place-items:center;background:linear-gradient(150deg,var(--surface-2),var(--accent-soft));color:var(--accent)}
.photo .ph .ic{width:72px;height:72px;stroke-width:1.2;opacity:.6}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(26px,3.2vw,34px);letter-spacing:-.02em}
.lv-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.lv-tile{position:relative;aspect-ratio:1/1;border-radius:22px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:none;background:var(--g);box-shadow:var(--shadow);transition:transform .18s;overflow:hidden}
.lv-tile:hover{transform:translateY(-3px)}
.lv-tile .code{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,6vw,76px);line-height:.9;letter-spacing:-.04em}
.lv-tile .nm{font-family:var(--f-display);font-weight:700;font-size:20px}
.lv-tile .pc{font-size:14px;font-weight:700;opacity:.92}
.lv-tile .bar2{height:6px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:6px}
.lv-tile .bar2 span{display:block;height:100%;background:#fff}
.lv-tile.on{outline:4px solid var(--ink);outline-offset:4px}
.lv-tile .here{position:absolute;top:16px;right:16px;background:#fff;color:#1e0b4b;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800}
.lv-tile .go{margin-top:10px;align-self:flex-start;background:#fff;color:#1e0b4b;border-radius:10px;padding:7px 12px;font-weight:800;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.lv-tile .go .ic{width:16px;height:16px}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.skill{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.skill:hover{transform:translateY(-2px);border-color:var(--tc)}
.skill .top{display:flex;justify-content:space-between;align-items:center}
.skill .ib{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 15%,transparent);color:var(--tc)}

let S=blank();

const LS_KEY="mec-progress-v1";

function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);return raw?JSON.parse(raw):null}catch(e){return null}}
function saveLocal(){S.updatedAt=new Date().toISOString();try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
async function saveCloud(){
  saveLocal();
  if(!db||!uid){toast(HAS_CLAUDE?"Saved on this device. Sign in to Claude to save to your account.":"Progress saved on this device. Next time, open the coach on the same device and browser.");return false}
  try{
    S.savedToAccount=new Date().toISOString();
    await db.collection("data/users/"+uid).doc("progress").set({json:JSON.stringify(S),updatedAt:S.savedToAccount});
    saveLocal();toast("Progress saved. Next time you will continue from here.");render();return true;
  }catch(e){toast("Couldn't save to your account ("+(e&&e.code||"error")+"). It is saved on this device.");return false}
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3800)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim();

/* ---------------- header ---------------- */
function renderHeader(){
  const lad=document.getElementById("ladder");if(lad)lad.innerHTML=LEVELS.map((l,i)=>`<div class="rung ${S.levelIdx===i?"on":(S.levelIdx!=null&&i<S.levelIdx?"done":"")}" style="--lc:${LC[l.c]}"><i></i><span class="code">${l.c}</span></div>`).join("");
  document.getElementById("levelPill").textContent=S.level?("Level "+S.level):"No level yet";
  document.querySelector(".brand")&&document.querySelector(".brand").setAttribute("aria-selected","false");
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
  set("cnt-lesson",Object.keys(S.lessons).length+"/"+LESSONS.length);
  set("cnt-listen",Object.keys(S.listenDone).length+"/"+CLIPS.length);
  set("cnt-pron",Object.keys(S.pron).length+"/"+ALL_PRON.length);
  set("cnt-test",S.test.done?"✓":"");
}

/* ---------------- dashboard ---------------- */
function viewDashboard(){
  const nL=Object.keys(S.lessons).length,nC=Object.keys(S.listenDone).length,nP=Object.keys(S.pron).length;
  const started=Object.keys(S.test.answers).length||S.test.stage;
  const nx=nextLesson(), h=new Date().getHours();
  const greet=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  const lvPct=lv=>{const f=a=>a.filter(x=>x.lv===lv);const ls=f(LESSONS),cs=f(CLIPS),rs=f(RD),ws=f(WR),ts=f(ST),ps=PRON[lv];const d=ls.filter(l=>S.lessons[l.id]).length+cs.filter(c=>S.listenDone[c.id]!=null).length+rs.filter(r=>S.readDone[r.id]!=null).length+ws.filter(w=>S.writeDone[w.id]).length+ts.filter(t=>S.storyDone[t.id]!=null).length+ps.filter(p=>S.pron[p.id]).length;return Math.round(d/(ls.length+cs.length+rs.length+ws.length+ts.length+ps.length)*100)};
  const nR=Object.keys(S.readDone).length,nW=Object.keys(S.writeDone).length,nT=Object.keys(S.storyDone).length;
  const lc=(document.getElementById("learnerCount")||{}).textContent||"…";
  const skill=(go,icn,col,num,label,sub,p)=>`<button class="skill" data-go="${go}" style="--tc:${col}"><span class="top"><span class="ib">${ic(icn)}</span><span class="tn">${num}</span></span><span class="tl">${label}</span><span class="ts">${sub}</span><div class="progress"><span style="width:${Math.round(p*100)}%"></span></div></button>`;
  const picks=(()=>{const out=[];const start=nx?LESSONS.indexOf(nx):0;for(let i=0;i<LESSONS.length&&out.length<3;i++){const l=LESSONS[(start+i)%LESSONS.length];if(!S.lessons[l.id]||out.length<3&&i>=LESSONS.length-3)out.push(l)}return out.slice(0,3)})();
  const contLine=S.test.done?(nx?`Continue where you stopped: <b>Lesson ${LESSONS.indexOf(nx)+1} · ${esc(nx.title)}</b>`:"You finished every lesson. Try IELTS preparation next."):(started?`Your placement test is at <b>part ${S.test.stage+1} of ${STAGES.length}</b>.`:"Start with a 15-minute placement test to find your level.");
  return `<section class="stack" style="gap:44px">
   <div class="d-hero">
    <div class="hcopy">
     <span class="eyebrow">${greet}${S.level?" · Level "+S.level:""}</span>
     <h1>Your English, <em>one step</em> a day</h1>
     <p class="muted" style="font-size:19px;max-width:520px">Lessons, listening, pronunciation and IELTS practice from A1 to B2. Free, at your own pace, on any device.</p>
     <p class="fr">Leçons, écoute, prononciation et préparation IELTS de A1 à B2. Gratuit, à votre rythme, sur tous les appareils.</p>
     <div class="cont">${ic("book")}<span>${contLine}</span></div>
     <div class="row">
      <button class="btn hot" data-go="${S.test.done?"lesson":"test"}">${S.test.done?"Continue today's lesson":(started?"Continue the test":"Start the placement test")} ${ic("arrow")}</button>
      <button class="btn ghost" data-go="${S.test.done?"test":"lesson"}">${S.test.done?"Retake the test":"Browse lessons"}</button>
     </div>
     <div class="proof" data-learners-wrap ${/\d/.test(lc)?"":"hidden"}><span class="avs"><i style="background:var(--a1)">S</i><i style="background:var(--hot)">Y</i><i style="background:var(--b1)">K</i><i style="background:var(--a2)">M</i></span><span><b data-learners>${esc(lc)}</b> learners use this coach</span></div>
    </div>
    ${photoFrame("hero","Two learners practising English on a phone in a café")}
   </div>

   <div class="stack">
    <div class="sec-head"><h2>Choose your level</h2><span class="note">${S.level?"Your level is "+S.level+". Each tile shows your progress.":"Not sure? Take the placement test."}</span></div>
    <div class="lv-tiles">${LEVELS.map((L,i)=>{const on=S.levelIdx===i,p=lvPct(L.c);return `<button class="lv-tile ${on?"on":""}" style="--g:var(--g${L.c.toLowerCase()})" data-golevel="${L.c}">
      ${on?`<span class="here">You are here</span>`:""}
      <span class="code">${L.c}</span>
      <span><span class="nm">${L.n}</span><div class="pc">${p}% done</div><div class="bar2"><span style="width:${p}%"></span></div>${on&&nx?`<span class="go">Continue ${ic("arrow")}</span>`:""}</span></button>`}).join("")}</div>
   </div>

   <div class="stack">
    <div class="sec-head"><h2>Your skills</h2>${S.savedToAccount?`<span class="note">Saved to your account ${esc(new Date(S.savedToAccount).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</span>`:`<button class="btn ghost small" data-act="save">Save my progress</button>`}</div>
    <div class="skills">
     ${skill("lesson","book","var(--accent)",nL+"/"+LESSONS.length,"Lessons",nx?"Next: "+esc(nx.title):"All done",nL/LESSONS.length)}
     ${skill("listen","headphones","var(--a1)",nC+"/"+CLIPS.length,"Listening","Short UK and US recordings",nC/CLIPS.length)}
     ${skill("read","book","var(--a2)",nR+"/"+RD.length,"Reading","Texts with questions",nR/Math.max(1,RD.length))}
     ${skill("write","pen","var(--b1)",nW+"/"+WR.length,"Writing","Tasks with model answers",nW/Math.max(1,WR.length))}
     ${skill("story","spark","var(--hot)",nT+"/"+ST.length,"Stories","Read and listen, with Arabic",nT/Math.max(1,ST.length))}
     ${skill("pron","mic","var(--b2)",nP+"/"+ALL_PRON.length,"Pronunciation","Words and sentences",nP/ALL_PRON.length)}
    </div>
   </div>

   <div class="band">
    <div class="stack" style="gap:18px">
     <span class="eyebrow">Exam preparation</span>
     <h2>Get ready for IELTS</h2>
     <p>Practise all four parts of the test with real exam formats, timers and an estimated band score for Listening and Reading.</p>
     <div class="mods">
      <button class="mod" data-goielts="listening"><b>Listening</b><span>Conversations and lectures</span></button>
      <button class="mod" data-goielts="reading"><b>Reading</b><span>Academic texts, True / False / Not Given</span></button>
      <button class="mod" data-goielts="writing"><b>Writing</b><span>Task 1 and 2 with timers</span></button>
      <button class="mod" data-goielts="speaking"><b>Speaking</b><span>Cue card and timers</span></button>
     </div>
    </div>
    ${photoFrame("ielts","A student with headphones studying for IELTS in a library")}
   </div>

   <div class="stack">
    <div class="sec-head"><h2>Today's picks</h2><button class="linkbtn" data-go="lesson">See all ${LESSONS.length} lessons</button></div>
    <div class="picks">${picks.map(l=>{const c=findClip(l.clip);return `<button class="pick" data-lesson-open="${l.id}" style="--g:var(--g${l.lv.toLowerCase()})">
      <span class="cover">${ic(["book","headphones","mic","target"][LESSONS.indexOf(l)%4])}<span class="big">${l.lv}</span><span class="free">Free</span></span>
      <span class="body"><span class="meta"><span class="lvb">${l.lv}</span>Lesson ${LESSONS.indexOf(l)+1} · 10 min${S.lessons[l.id]?" · ✓ done":""}</span><b>${esc(l.title)}</b><span class="note">Listening: ${esc(c.title)}</span></span></button>`}).join("")}</div>
   </div>

   ${donateHtml()}

   <div class="card">
    <span class="eyebrow">Coming next</span>
    <div class="soon"><span>Vocabulary trainer</span><span>Grammar reference</span><span>Video lessons</span><span>Certificates of level</span></div>
   </div>

function photoFrame(k,alt){return `<div class="photo"><span class="blk k1"></span><span class="blk k2"></span>${PHOTOS[k]?`<img src="${PHOTOS[k]}" alt="${esc(alt)}" style="object-position:${k==="ielts"?"68% 40%":"50% 45%"}">`:`<div class="ph" role="img" aria-label="${esc(alt)}">${ic(k==="hero"?"users":"headphones")}</div>`}</div>`}

/* ---------------- placement test ---------------- */
function stageQs(st=S.test.stage){
  if(st<=3) return TEST[st].qs.map(q=>({...q,lv:TEST[st].lv}));
  if(st===4) return LISTEN.flatMap(c=>c.qs.map(q=>({...q,lv:c.lv,clip:c.id})));
  return [];
}
function optsHtml(q){
  const ans=S.test.answers[q.id];
  return `<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-q="${q.id}" data-o="${j}" aria-pressed="${ans===j}">${esc(o)}</button>`).join("")}</div>`;
}
function qHtml(q,i){
  return `<div class="q">${q.passage?`<div class="passage">${esc(q.passage)}</div>`:""}<div class="prompt">${i+1}. ${esc(q.p)}</div>${optsHtml(q)}</div>`;
}
function progressPct(answered,total){return Math.round(((S.test.stage)+(total?answered/total:0))/STAGES.length*100)}
function stageHead(){
  return `<span class="eyebrow">Placement test · Part ${S.test.stage+1} of ${STAGES.length} · ${STAGES[S.test.stage].t}</span>`;
}
function viewTest(){
  if(S.test.done) return viewResult();
  const st=S.test.stage;
  if(st===5) return viewWriting();
  const qs=stageQs();
  const answered=qs.filter(q=>S.test.answers[q.id]!==undefined).length;
  let body;
  if(st<=3){
    body=`<h2>${st===0?"Let's find your level":"Level "+TEST[st].lv+" questions"}</h2>
    <p class="muted">Choose one answer for each question. Do all ${STAGES.length} parts: you get your level at the end.</p>
    <p class="fr">Choisissez une réponse par question. Faites les ${STAGES.length} parties : votre niveau s'affiche à la fin.</p>
    <div class="progress"><span style="width:${progressPct(answered,qs.length)}%"></span></div>
    <div>${qs.map(qHtml).join("")}</div>`;
  } else {
    let n=0;
    body=`<h2>Listen and answer</h2>
    <p class="muted">Press Play to hear each short recording. You can listen again or slower. Then choose the answers.</p>
    <p class="fr">Appuyez sur Play pour écouter chaque enregistrement. Vous pouvez réécouter ou ralentir. Puis choisissez les réponses.</p>
    <div class="progress"><span style="width:${progressPct(answered,qs.length)}%"></span></div>
    ${LISTEN.map((c,ci)=>`<div class="q clip">
      <div class="row"><span class="clip-no">Recording ${ci+1}</span><span class="note">${c.label}</span></div>

function speak(text,lang,slow){

function listen(id,btn){
  const it=ALL_PRON.find(x=>x.id===id), box=document.getElementById("heard-"+id);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  box.hidden=false;
  if(!SR){box.textContent="This browser can't listen to your voice. Say it aloud and mark Easy or Hard.";return}
  let rec;
  try{rec=new SR()}catch(e){box.textContent="The microphone isn't available on this page. Say it aloud and mark Easy or Hard.";return}
  rec.lang="en-GB";rec.interimResults=false;rec.maxAlternatives=3;
  btn.classList.add("live");btn.textContent="● Listening…";box.textContent="Speak now.";
  const stop=()=>{btn.classList.remove("live");btn.textContent="● Say it"};
  rec.onresult=e=>{
    const alts=[...e.results[0]].map(a=>a.transcript);
    const target=norm(it.w.replace(/\(.*?\)/g,"").split("–")[0]);
    const hit=alts.some(a=>norm(a).includes(target)||target.includes(norm(a))&&norm(a).length>2);
    box.innerHTML=`I heard: <b>${esc(alts[0])}</b>. ${hit?"That matches. Well done.":"Not quite. Listen again and try once more."}`;
    if(hit){S.pron[id]="good";saveLocal();}
  };
  rec.onerror=e=>{box.textContent=(e.error==="not-allowed"||e.error==="service-not-allowed")?"The microphone isn't allowed on this page. Say it aloud and mark Easy or Hard.":"I couldn't hear you ("+e.error+"). Try again.";stop()};
  rec.onend=stop;
  try{rec.start()}catch(e){box.textContent="The microphone couldn't start. Say it aloud and mark Easy or Hard.";stop()}
}

const findClip=id=>CLIPS.find(c=>c.id===id)||LISTEN.find(c=>c.id===id);

/* ---------------- shared bits ---------------- */
function ansQ(q,i){
  const a=S.ans[q.id], done=a!==undefined;
  return `<div class="q"><div class="prompt">${i!=null?(i+1)+". ":""}${esc(q.p)}</div>
   <div class="opts">${q.o.map((o,j)=>`<button class="opt ${done&&j===q.a?"right":""} ${done&&j===a&&a!==q.a?"wrong":""}" data-ans="${q.id}" data-o="${j}" ${done?"disabled":""} aria-pressed="${a===j}">${esc(o)}</button>`).join("")}</div>
   ${done?`<div class="fb ${a===q.a?"ok":"no"}">${a===q.a?"Correct.":"Not quite."} ${esc(q.why)}</div>`:""}</div>`;
}
function clipCard(c,num){
  const answered=c.qs.every(q=>S.ans[q.id]!==undefined);
  return `<article class="clip-card">
    <div class="row" style="justify-content:space-between"><h3>${num?num+". ":""}${esc(c.title)}</h3><span class="note">${c.lv} · ${c.label}${S.listenDone[c.id]!=null?` · ✓ ${S.listenDone[c.id]}/${c.qs.length}`:""}</span></div>
    <div class="play"><button class="btn small" data-listen="${c.id}">▶ Play</button><button data-listen="${c.id}" data-slow="1">Slower</button><button data-trans="${c.id}">${answered?"Show the text":"Show the text (after answering)"}</button></div>
    <div class="passage" id="tr-${c.id}" hidden>${esc(c.text)}</div>
    ${c.qs.map((q,i)=>ansQ(q,i)).join("")}
  </article>`;
}
function wordCard(it){
  const r=S.pron[it.id];
  return `<article class="word ${r?"practised":""}">
    <div class="w">${esc(it.w)}</div>
    ${it.uk?`<dl class="ipa"><dt>UK</dt><dd>${esc(it.uk)}</dd><dt>US</dt><dd>${esc(it.us)}</dd></dl>`:""}
    <p class="tip">${esc(it.tip)}</p><p class="fr">${esc(it.fr)}</p>
    <div class="play"><button data-say="${it.id}" data-lang="en-GB">▶ UK</button><button data-say="${it.id}" data-lang="en-US">▶ US</button><button class="rec" data-rec="${it.id}">● Say it</button></div>
    <div class="heard" id="heard-${it.id}" hidden></div>
    <div class="rate">How was it?
      <button data-rate="${it.id}" data-v="good" aria-pressed="${r==="good"}">Easy</button>
      <button data-rate="${it.id}" data-v="hard" aria-pressed="${r==="hard"}">Hard</button></div>
  </article>`;
}
function lessonPron(L){const lvl=PRON[L.lv],k=LESSONS.filter(x=>x.lv===L.lv).indexOf(L);return [lvl[k*2],lvl[k*2+1]].filter(Boolean)}
function nextLesson(){
  const start=S.levelIdx!=null?S.levelIdx:0;
  const order=[...LESSONS.filter(l=>LEVELS.findIndex(x=>x.c===l.lv)>=start),...LESSONS.filter(l=>LEVELS.findIndex(x=>x.c===l.lv)<start)];
  return order.find(l=>!S.lessons[l.id])||null;
}

/* ---------------- today's lesson ---------------- */
function viewLesson(){
  if(S.curLesson){const L=LESSONS.find(l=>l.id===S.curLesson);if(L)return viewLessonBody(L)}
  const nx=nextLesson(), done=Object.keys(S.lessons).length;
  return `<section class="stack">
   <div class="card today">
    <span class="eyebrow">Today's lesson${S.level?" · your level "+S.level:""}</span>
    ${nx?`<h2>${esc(nx.title)}</h2>
      <p class="muted">Lesson ${LESSONS.indexOf(nx)+1} of ${LESSONS.length} · Level ${nx.lv} · About 10 minutes: grammar, practice, listening, new words and pronunciation.</p>
      <p class="fr">Environ 10 minutes : grammaire, exercices, écoute, vocabulaire et prononciation.</p>
      ${S.level?"":`<p class="note">You haven't taken the placement test yet, so the lessons start at A1. <button class="linkbtn" data-go="test">Take the test</button></p>`}
      <div class="row"><button class="btn" data-lesson="${nx.id}">Start the lesson</button></div>`
      :`<h2>You finished all ${LESSONS.length} lessons.</h2><p class="muted">Amazing work. You can repeat any lesson below.</p>`}
    <div class="progress"><span style="width:${Math.round(done/LESSONS.length*100)}%"></span></div>
    <p class="note">${done} of ${LESSONS.length} lessons done.</p>
   </div>
   <div class="card">
    <span class="eyebrow">Course map · A1 to B2</span>
    <div class="map">${LEVELS.map(L=>`<div class="map-lv" style="--lc:${LC[L.c]}"><div class="map-head"><span class="code">${L.c}</span><span class="note">${L.n}</span></div>
      ${LESSONS.filter(l=>l.lv===L.c).map(l=>{const d=S.lessons[l.id];return `<button class="map-item ${d?"done":""} ${nx&&nx.id===l.id?"next":""}" data-lesson="${l.id}"><span>${esc(l.title)}</span><span class="note">${d?"✓ "+d.score+"/5":(nx&&nx.id===l.id?"Today":"")}</span></button>`}).join("")}</div>`).join("")}</div>
   </div>
  </section>`;
}
function viewLessonBody(L){
  const c=L.clip?findClip(L.clip):null, qs=lessonQs(L), pr=lessonPron(L); let n=2;
  const answered=qs.filter(q=>S.ans[q.id]!==undefined).length;
  const right=qs.filter(q=>S.ans[q.id]===q.a).length;
  const finished=S.lessons[L.id];
  return `<section class="stack">
   <div class="row"><button class="btn ghost small" data-act="backToMap">← All lessons</button><span class="note">Lesson ${LESSONS.indexOf(L)+1} of ${LESSONS.length} · Level ${L.lv}</span></div>
   <div class="card">
    <span class="eyebrow">1 · Learn</span><h2>${esc(L.title)}</h2>
    <p>${esc(L.ex)}</p><p class="fr">${esc(L.exfr)}</p>
    <div class="egs">${L.eg.map((e,i)=>`<div class="eg"><span>${esc(e)}</span><button data-sayt="${esc(e)}" aria-label="Listen">▶</button></div>`).join("")}</div>
   </div>
   <div class="card"><span class="eyebrow">2 · Practise</span>${L.qs.map((q,i)=>ansQ(q,i)).join("")}</div>
   ${c?`<div class="card"><span class="eyebrow">${++n} · Listen</span>${clipCard(c)}</div>`:""}
   <div class="card"><span class="eyebrow">${++n} · New words</span>
    <div class="vocab">${L.voc.map(w=>`<div class="voc"><div class="row" style="justify-content:space-between"><b>${esc(w.w)}</b><button data-sayt="${esc(w.w)}" aria-label="Listen">▶</button></div><span class="muted">${esc(w.m)}</span><span class="fr">${esc(w.fr)}</span></div>`).join("")}</div>
   </div>
   ${pr.length?`<div class="card"><span class="eyebrow">${++n} · Say it</span><div class="words">${pr.map(wordCard).join("")}</div></div>`:""}
   <div class="card"><span class="eyebrow">Ask your coach</span>
    <p class="muted">Do you have a question about this lesson? Ask in English or French.</p>
    <div class="row"><input type="text" id="askq" placeholder="Why do we say 'since 2020' and not 'for 2020'?"><button class="btn small" data-act="askLesson">Ask</button></div>
    <div class="coach" id="askOut" hidden></div>
   </div>
   <div class="banner"><p>${answered<qs.length?`<b>Answer all ${qs.length} questions to finish.</b> ${answered}/${qs.length} done.`:`<b>${right} of ${qs.length} correct.</b> ${finished?"Lesson finished.":"Finish the lesson and save your progress?"}`}<span class="fr">Répondez à toutes les questions, puis terminez et sauvegardez.</span></p>
    <div class="row"><button class="btn small" data-act="finishLesson" ${answered<qs.length?"disabled":""}>Finish and save</button><button class="btn ghost small" data-act="resetLesson">Start again</button></div></div>
  </section>`;
}
async function askLesson(){
  const L=LESSONS.find(l=>l.id===S.curLesson), q=(document.getElementById("askq").value||"").trim(), out=document.getElementById("askOut");
  if(!q)return; out.hidden=false;
  if(!sample){out.textContent="The AI coach isn't available here.";return}
  out.textContent="Thinking…";
  try{await sample(`You are a patient English teacher. The learner (level ${L.lv}, often a French, Kabyle or Arabic speaker) is studying the lesson "${L.title}": ${L.ex}\nAnswer their question simply, with 1-2 short examples. If they wrote in French, answer in French with English examples. Plain text, no markdown symbols, under 120 words.\nQuestion: ${q.slice(0,500)}`,{modelTier:"quick",onText:({text})=>{out.textContent=text}})}
  catch(e){out.textContent=e&&e.code==="not_granted"?"You said no to the AI coach.":"The coach didn't answer. Try again in a moment."}
}

/* ---------------- listening ---------------- */
function viewListening(){
  const lv=S.listenLevel||S.level||"A1";
  const list=CLIPS.filter(c=>c.lv===lv);
  const done=CLIPS.filter(c=>S.listenDone[c.id]!=null).length;
  return `<section class="stack">
   <div class="card">
    <span class="eyebrow">Listening · UK and US</span><h2>Short recordings for your level</h2>
    <p class="muted">Listen as many times as you want. Answer the questions first, then read the text to check what you heard.</p>
    <p class="fr">Écoutez autant de fois que vous voulez. Répondez d'abord, puis lisez le texte pour vérifier.</p>
    <div class="lvl-filter">${LEVELS.map(l=>`<button class="chip" data-llv="${l.c}" aria-pressed="${l.c===lv}">${l.c}</button>`).join("")}</div>
    <p class="note">${done} of ${CLIPS.length} recordings done.</p>
   </div>
   ${list.map((c,i)=>clipCard(c,i+1)).join("")}
   <div class="banner"><p><b>Done for today?</b> Save so you can continue next time.<span class="fr">Fini pour aujourd'hui ? Sauvegardez.</span></p><button class="btn small" data-act="save">Save my progress</button></div>
  </section>`;
}
function markClips(){CLIPS.forEach(c=>{if(c.qs.every(q=>S.ans[q.id]!==undefined))S.listenDone[c.id]=c.qs.filter(q=>S.ans[q.id]===q.a).length})}

function ieltsChart(d){
  const W=520,H=260,l=40,b=36,t=14,r=10,cols=["var(--b1)","var(--hot)","var(--a1)"];
  const gw=(W-l-r)/d.years.length, bw=(gw-18)/d.series.length, y=v=>t+(H-t-b)*(1-v/100);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Bar chart of household internet access, 2005 to 2020">`;
  [0,25,50,75,100].forEach(g=>{s+=`<line x1="${l}" x2="${W-r}" y1="${y(g)}" y2="${y(g)}" class="grid"/><text x="${l-6}" y="${y(g)+4}" class="ax" text-anchor="end">${g}%</text>`});
  d.years.forEach((yr,i)=>{const x0=l+i*gw+9;d.series.forEach((se,j)=>{s+=`<rect x="${x0+j*bw}" y="${y(se.v[i])}" width="${bw-3}" height="${y(0)-y(se.v[i])}" rx="3" fill="${cols[j]}"><title>${se.n} ${yr}: ${se.v[i]}%</title></rect>`});s+=`<text x="${l+i*gw+gw/2}" y="${H-b+20}" class="ax" text-anchor="middle">${yr}</text>`});
  s+=`</svg><div class="legend">${d.series.map((se,j)=>`<span><i style="background:${cols[j]}"></i>${se.n}</span>`).join("")}</div>`;
  return s;
}

   ${f.corrections&&f.corrections.length?`<div class="corr">${f.corrections.map(c=>`<div><s>${esc(c.wrong)}</s> → <ins>${esc(c.right)}</ins></div>`).join("")}</div>`:""}

async function iFeedback(k){

  if(!sample){box.innerHTML=`<p class="fb no">The AI examiner isn't available here.</p>`;return}
  box.innerHTML=`<p class="note">The examiner is reading…</p>`;
  const task=k==="sp"?`IELTS Speaking Part 2. Topic: "${IELTS_S.p2.topic}" (${IELTS_S.p2.points.join(", ")}). The text is a transcript of what the candidate said. Use criteria: Fluency and Coherence, Lexical Resource, Grammatical Range and Accuracy. Do not score pronunciation.`
    :k==="t1"?`IELTS Academic Writing Task 1. Prompt: ${IELTS_W.t1.prompt} Data (percent): ${JSON.stringify(IELTS_W.t1.data)}. Criteria: Task Achievement, Coherence and Cohesion, Lexical Resource, Grammatical Range and Accuracy. Check that the figures used match the data.`
    :`IELTS Writing Task 2. Prompt: ${IELTS_W.t2.prompt} Criteria: Task Response, Coherence and Cohesion, Lexical Resource, Grammatical Range and Accuracy.`;
  try{
    const r=await sample.json(`You are an experienced, fair IELTS examiner. ${task} Score each criterion in half bands (0-9) following public IELTS band descriptors, penalise answers under the word limit, and give an overall band (average rounded to the nearest half band). Write comments in simple English for a learner. Return JSON only:
{"overall":"6.5","criteria":[{"name":"...","band":"6","comment":"one or two sentences"}],"improve":["3 short, concrete tips"],"corrections":[{"wrong":"exact phrase","right":"corrected"}]}
At most 4 corrections.
Candidate's answer:
"""${txt.slice(0,4000)}"""`,{modelTier:"default"});
    S.ieltsFb=S.ieltsFb||{};S.ieltsFb[k]=r;saveLocal();box.innerHTML=wfbHtml(r);
  }catch(e){box.innerHTML=`<p class="fb no">${e&&e.code==="not_granted"?"You said no to the AI examiner.":"The examiner didn't answer. Try again in a moment."}</p>`}
}
function speakSeq(lines){
  if(!("speechSynthesis" in window)){toast("Your browser can't read aloud.");return}
  try{speechSynthesis.cancel();
    const en=voices.filter(v=>/^en[-_]GB/i.test(v.lang)); const pool=en.length>1?en:voices.filter(v=>/^en/i.test(v.lang));
    lines.forEach(([w,t])=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.95;
      const vv=pool[w==="A"?0:Math.min(1,pool.length-1)];if(vv)u.voice=vv;u.pitch=w==="A"?1.15:0.85;speechSynthesis.speak(u)});
  }catch(e){toast("Audio couldn't play here.")}
}
let tmr=null;
function runTimer(el,secs,done){clearInterval(tmr);let s=secs;const f=()=>{el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};f();tmr=setInterval(()=>{s--;f();if(s<=0){clearInterval(tmr);done&&done()}},1000)}
function speakMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition, note=document.getElementById("sMicNote");
  if(!SR){note.textContent="This browser can't listen. Type what you said instead.";return}
  let rec;try{rec=new SR()}catch(e){note.textContent="The microphone isn't available here. Type what you said instead.";return}
  rec.lang="en-GB";rec.continuous=true;rec.interimResults=false;
  const ta=document.getElementById("sp-text");note.textContent="Listening… press again to stop.";
  const btn=document.getElementById("sMic");btn.textContent="■ Stop";btn.dataset.act="sMicStop";speakMic.rec=rec;
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){ta.value=(ta.value+" "+e.results[i][0].transcript).trim()}S.ieltsW=S.ieltsW||{};S.ieltsW.sp=ta.value;saveLocal()};
  rec.onerror=e=>{note.textContent=(e.error==="not-allowed"||e.error==="service-not-allowed")?"The microphone isn't allowed on this page. Type what you said instead.":"Microphone error: "+e.error};
  rec.onend=()=>{btn.textContent="● Speak with the microphone";btn.dataset.act="sMic";if(note.textContent.startsWith("Listening"))note.textContent="Stopped."};
  try{rec.start()}catch(e){note.textContent="The microphone couldn't start. Type what you said instead."}
}

const RD=[],WR=[],ST=[];

function addLessons(lv,arr){arr.forEach(([id,title,ex,exfr,eg,qs,voc])=>LESSONS.push({id,lv,title,ex,exfr,eg,qs:mkQs(id,qs),voc:voc.map(v=>({w:v[0],m:v[1],fr:v[2]}))}))}
function addClips(lv,arr){arr.forEach(([id,accent,title,text,qs])=>CLIPS.push({id,lv,accent,label:accent==="en-US"?"US accent":"UK accent",title,text,qs:mkQs(id,qs)}))}
function addReads(lv,arr){arr.forEach(([id,title,text,qs,gloss])=>RD.push({id,lv,title,paras:text.split("\n"),qs:mkQs(id,qs),gloss:(gloss||[]).map(g=>({w:g[0],m:g[1]}))}))}
function addWrites(lv,arr){arr.forEach(([id,title,prompt,min,useful,model,check])=>WR.push({id,lv,title,prompt,min,useful,model,check}))}
function addStories(lv,arr){arr.forEach(([id,title,lines,qs])=>ST.push({id,lv,title,lines:lines.map(l=>({en:l[0],ar:l[1]})),qs:mkQs(id,qs)}))}
const lvIdx=lv=>LEVELS.findIndex(x=>x.c===lv);
function finalizeCourse(){const by=(a,b)=>lvIdx(a.lv)-lvIdx(b.lv);[LESSONS,CLIPS,RD,WR,ST].forEach(a=>{const s=a.map((x,i)=>[x,i]).sort((p,q)=>by(p[0],q[0])||p[1]-q[1]);s.forEach(([x],i)=>a[i]=x)})}
const lessonQs=L=>{const c=L.clip?findClip(L.clip):null;return [...L.qs,...(c?c.qs:[])]};

function wFbHtml(f){return `<div class="wfb"><p>${esc(f.feedback||"")}</p>${f.corrections&&f.corrections.length?`<div class="corr">${f.corrections.map(c=>`<div><s>${esc(c.wrong)}</s> → <ins>${esc(c.right)}</ins>${c.why?`<br><span class="muted">${esc(c.why)}</span>`:""}</div>`).join("")}</div>`:""}${f.better?`<div><span class="side-label" style="color:var(--muted)">A better version</span><p>${esc(f.better)}</p></div>`:""}</div>`}
async function wAI(id){
  const w=WR.find(x=>x.id===id), box=document.getElementById("wfb-"+id), txt=((S.writeTxt||{})[id]||"").trim();
  if(txt.split(/\s+/).length<5){box.innerHTML=`<p class="fb no">Write at least one or two sentences first.</p>`;return}
  if(!sample){box.innerHTML=`<p class="fb no">The AI coach isn't available here. Compare with the model answer instead.</p>`;return}
  box.innerHTML=`<p class="note">Your coach is reading…</p>`;
  try{const r=await sample.json(`You are a kind English teacher. Level ${w.lv} learner (often French, Kabyle or Arabic speaker). Task: "${w.prompt}". Return JSON only: {"feedback":"2-3 short encouraging sentences in simple English about content and organisation","corrections":[{"wrong":"exact phrase","right":"correction","why":"very short reason"}],"better":"an improved version of the learner's text at level ${w.lv}, same ideas"}. At most 5 corrections, only real mistakes.\nLearner text:\n"""${txt.slice(0,2500)}"""`,{modelTier:"quick"});
    S.writeFb=S.writeFb||{};S.writeFb[id]=r;saveLocal();box.innerHTML=wFbHtml(r)}
  catch(e){box.innerHTML=`<p class="fb no">${e&&e.code==="not_granted"?"You said no to the AI coach.":"The coach didn't answer. Try again in a moment."}</p>`}
}

function pickVoice(lang){return voices.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(lang.toLowerCase()))}
function storyLine(t,j,single){
  document.querySelectorAll(".sline.on").forEach(e=>e.classList.remove("on"));
  const el=document.getElementById("sl-"+j); if(!el){storyRun=null;return}
  el.classList.add("on"); el.scrollIntoView({behavior:"smooth",block:"center"});
  const p=document.getElementById("sprog"); if(p)p.style.width=Math.round((j+1)/t.lines.length*100)+"%";
  try{const u=new SpeechSynthesisUtterance(t.lines[j].en);u.lang="en-GB";u.rate=S.storyRate||0.95;const v=pickVoice("en-GB")||pickVoice("en");if(v)u.voice=v;
    u.onend=()=>{if(single||!storyRun||storyRun.id!==t.id)return;if(j+1<t.lines.length){storyRun.j=j+1;setTimeout(()=>storyRun&&storyLine(t,j+1),350)}else{storyRun=null;el.classList.remove("on");toast("The end. Now answer the questions.")}};
    speechSynthesis.speak(u)}catch(e){toast("Audio couldn't play here.")}
}

addReads("A1",[
["a1r01","Hello, I'm Adam","Hello! My name is Adam. I am nineteen years old and I am from Béjaïa, a city by the sea in Algeria. I am a student at the university. I study computer science.\nI live with my parents and my little sister, Lina. She is ten. In my free time, I play football and I watch films.",
 [["How old is Adam?",["Nine","Nineteen","Ten","Twenty-nine"],1,"I am nineteen years old."],["What does Adam study?",["Medicine","English","Computer science","Economics"],2,"I study computer science."],["Who is Lina?",["His mother","His sister","His friend","His teacher"],1,"My little sister, Lina."]],
 [["by the sea","near the sea"],["free time","time when you are not working"],["little","small, young"]]],
["a1r02","A small family business","Karim has a small bakery in Tizi Ouzou. He gets up at four o'clock every morning to make bread. His wife, Souad, works in the shop. She sells bread, cakes and croissants.\nThe bakery is open every day except Friday. Many people buy their bread there because it is fresh and cheap.",
 [["What time does Karim get up?",["At six","At four","At five","At seven"],1,"He gets up at four o'clock."],["What does Souad do?",["She makes bread","She works in the shop","She is a teacher","She drives a taxi"],1,"She works in the shop."],["When is the bakery closed?",["Saturday","Sunday","Friday","Monday"],2,"Open every day except Friday."]],
 [["bakery","a shop that makes bread"],["sell","give something for money"],["fresh","new, just made"]]],
["a1r03","My favourite day","My favourite day of the week is Thursday. I finish university at twelve o'clock. In the afternoon, I meet my friends at a café in the city centre. We drink tea and talk.\nIn the evening, I have dinner with my family. After dinner, I read a book or I call my cousin in France.",
 [["Why does the writer like Thursday?",["There is no class","Classes finish at twelve","It's the weekend","There is an exam"],1,"I finish university at twelve o'clock."],["Where does the writer meet friends?",["At home","At a café","At the library","At the park"],1,"At a café in the city centre."],["Who lives in France?",["The writer's brother","The writer's cousin","The writer's friend","The writer's father"],1,"I call my cousin in France."]],
 [["favourite","the one you like most"],["city centre","the middle of a town"],["cousin","the child of your uncle or aunt"]]],
["a1r04","A notice at school","STUDENTS, PLEASE NOTE\nThe library is closed on Saturday 12 March for cleaning.\nThe computer room is open from 8 a.m. to 6 p.m. every day.\nPlease do not eat or drink in the classrooms.\nThank you! – The Director",
 [["Why is the library closed on 12 March?",["For an exam","For cleaning","For a holiday","For a party"],1,"Closed for cleaning."],["When is the computer room open?",["8 a.m. – 6 p.m.","9 a.m. – 5 p.m.","Only on Saturday","24 hours"],0,"From 8 a.m. to 6 p.m."],["What can't students do in classrooms?",["Talk","Write","Eat or drink","Read"],2,"Do not eat or drink in the classrooms."]],
 [["notice","a short message on a wall"],["note","pay attention to"],["director","the boss of a school"]]],
["a1r05","My house","I live in a house in a quiet street. Downstairs there is a big kitchen, a living room and a small bathroom. Upstairs there are three bedrooms and another bathroom.\nThere is a small garden behind the house. My mother grows tomatoes, mint and flowers there. I love sitting in the garden in summer.",
 [["How many bedrooms are there?",["Two","Three","Four","One"],1,"Three bedrooms."],["Where is the garden?",["In front of the house","Behind the house","On the roof","Next to the school"],1,"Behind the house."],["What does the mother grow?",["Potatoes and carrots","Tomatoes, mint and flowers","Only flowers","Oranges"],1,"Tomatoes, mint and flowers."]],
 [["quiet","with no noise"],["downstairs","on the floor below"],["grow","make plants get bigger"]]],
["a1r06","An email to a new friend","Hi Emma,\nThank you for your email. I'm happy to be your pen friend! I'm Selma and I'm from Setif. I'm twenty and I study English at university.\nI have two brothers. I like cooking, drawing and walking in the mountains. What do you like doing?\nWrite soon,\nSelma",
 [["Why does Selma write to Emma?",["She is her teacher","They are new pen friends","Emma is her sister","To say sorry"],1,"I'm happy to be your pen friend."],["What does Selma study?",["English","French","Art","Maths"],0,"I study English."],["Which is one of Selma's hobbies?",["Swimming","Drawing","Football","Singing"],1,"I like cooking, drawing and walking."]],
 [["pen friend","a friend you write to"],["drawing","making pictures"],["mountains","very high hills"]]],
["a1r07","The weekly market","Every Tuesday there is a big market in our town. People come from the villages to sell fruit, vegetables, eggs, cheese and clothes. Everything is cheaper than in the shops.\nI go to the market with my grandmother. She knows all the sellers. She always buys oranges and olive oil.",
 [["When is the market?",["Every day","Every Tuesday","Every Friday","Once a month"],1,"Every Tuesday."],["Why do people go to the market?",["Things are cheaper","It is open at night","It is near the sea","There are restaurants"],0,"Everything is cheaper than in the shops."],["What does the grandmother always buy?",["Cheese and eggs","Oranges and olive oil","Clothes","Bread"],1,"She always buys oranges and olive oil."]],
 [["village","a very small town"],["vegetables","carrots, potatoes, onions…"],["seller","a person who sells things"]]],
["a1r08","A healthy breakfast","Breakfast is the most important meal of the day. A good breakfast gives you energy for the morning. For example, you can eat bread with cheese or eggs, some fruit, and drink a glass of milk or tea.\nTry not to eat too much sugar. Sweet cakes every morning are not good for you.",
 [["Why is breakfast important?",["It is cheap","It gives you energy","It is fast","It is sweet"],1,"A good breakfast gives you energy."],["What is a good drink for breakfast?",["Cola","Milk or tea","Coffee with a lot of sugar","Juice only"],1,"A glass of milk or tea."],["What should you not eat too much?",["Fruit","Eggs","Sugar","Bread"],2,"Try not to eat too much sugar."]],
 [["meal","breakfast, lunch or dinner"],["energy","the power to move and work"],["sweet","with a lot of sugar"]]],
["a1r09","A holiday postcard","Dear Grandpa,\nWe are in Tipaza for the holidays. The weather is hot and sunny. Every morning we swim in the sea. In the afternoon we visit the old Roman ruins. They are beautiful!\nThe hotel is very nice and the food is delicious. See you next week!\nLove, Sami",
 [["Where is Sami?",["In Tipaza","In Algiers","In Rome","At school"],0,"We are in Tipaza."],["What do they do in the afternoon?",["Swim","Visit Roman ruins","Sleep","Go shopping"],1,"In the afternoon we visit the old Roman ruins."],["What is the weather like?",["Cold","Rainy","Hot and sunny","Windy"],2,"Hot and sunny."]],
 [["holidays","time without school or work"],["ruins","what is left of old buildings"],["delicious","very good to eat"]]],
["a1r10","My job","My name is Farid and I am a bus driver. I start work at six in the morning. I drive the number five bus from the station to the hospital. I talk to many people every day.\nMy job is sometimes difficult because there is a lot of traffic. But I like it because I meet nice people.",
 [["What is Farid's job?",["Taxi driver","Bus driver","Doctor","Teacher"],1,"I am a bus driver."],["Where does bus 5 go?",["To the university","To the airport","From the station to the hospital","To the beach"],2,"From the station to the hospital."],["Why is the job sometimes difficult?",["The bus is old","There is a lot of traffic","People are rude","It is too early"],1,"There is a lot of traffic."]],
 [["traffic","a lot of cars on the road"],["difficult","not easy"],["meet","see and talk to people"]]],
["a1r11","The new café","A new café is open on Didouche Mourad Street. It is small, clean and modern. It has free Wi-Fi, so many students go there to study.\nThe coffee is good and not expensive. The café also sells fresh orange juice and cakes. It opens at seven in the morning and closes at eleven at night.",
 [["Why do students go to the café?",["It is very big","It has free Wi-Fi","It is open all night","It sells books"],1,"It has free Wi-Fi, so many students go there to study."],["What time does it close?",["7 p.m.","9 p.m.","11 p.m.","Midnight"],2,"It closes at eleven at night."],["Which is true about the café?",["It is expensive","It is old","It is clean and modern","It is far from town"],2,"It is small, clean and modern."]],
 [["modern","new, of today"],["free","you don't pay"],["expensive","it costs a lot"]]],
["a1r12","Animals in the zoo","At the zoo there are many animals. The elephants are very big and grey. They eat a lot of grass and fruit. The monkeys are funny; they jump and play all day.\nThe lions sleep a lot in the afternoon. My favourite animals are the giraffes because they have very long necks.",
 [["What do elephants eat?",["Meat","Grass and fruit","Fish","Bread"],1,"They eat a lot of grass and fruit."],["What do lions do in the afternoon?",["Play","Jump","Sleep","Swim"],2,"The lions sleep a lot in the afternoon."],["Why does the writer like giraffes?",["They are funny","They have long necks","They are grey","They are small"],1,"Because they have very long necks."]],
 [["zoo","a place with wild animals"],["funny","it makes you laugh"],["neck","between your head and body"]]],
["a1r13","An advert for a flat","FLAT TO RENT\nNice flat in the city centre, near the metro.\nTwo bedrooms, a kitchen, a bathroom and a balcony.\nThird floor, with a lift.\n35,000 DA a month. No pets, please.\nCall Mr Amrani: 0555 12 34 56",
 [["Where is the flat?",["In a village","In the city centre","Near the sea","Next to the airport"],1,"In the city centre, near the metro."],["How much is it?",["35,000 DA a year","3,500 DA a month","35,000 DA a month","53,000 DA a month"],2,"35,000 DA a month."],["Which is NOT allowed?",["Children","Pets","Visitors","Cars"],1,"No pets, please."]],
 [["rent","pay money to live in a place"],["lift","it takes you up and down in a building"],["pets","animals you keep at home"]]],
["a1r14","My English class","I have English classes on Monday and Wednesday from two to four. Our teacher is Mrs Haddad. She is very patient and she speaks slowly.\nIn class we read short texts, listen to dialogues and speak in pairs. We have a small test every two weeks. I like the class because I can speak with my classmates.",
 [["When are the English classes?",["Monday and Wednesday","Tuesday and Thursday","Every day","Only Saturday"],0,"On Monday and Wednesday."],["What is Mrs Haddad like?",["Strict and fast","Patient","Always late","Very young"],1,"She is very patient."],["How often is there a test?",["Every week","Every two weeks","Every month","Never"],1,"A small test every two weeks."]],
 [["patient","calm, not angry when waiting"],["in pairs","two people together"],["classmates","students in your class"]]],
["a1r15","Ramadan evenings","During Ramadan, families eat together after sunset. The meal is called iftar. People usually start with dates and milk, then they eat soup, like chorba, and other dishes.\nAfter iftar, many people visit their family or go out with friends. The streets are busy and happy until late at night.",
 [["When do families eat iftar?",["At sunrise","At noon","After sunset","At midnight"],2,"After sunset."],["What do people usually eat first?",["Soup","Dates and milk","Cakes","Meat"],1,"They start with dates and milk."],["What are the streets like at night?",["Empty","Busy and happy","Dark and quiet","Closed"],1,"The streets are busy and happy."]],
 [["sunset","when the sun goes down"],["dates","sweet brown fruit from palm trees"],["dish","a type of food in a meal"]]],
["a1r16","Lost and found","FOUND: A black wallet\nI found a black wallet in the university library on Tuesday afternoon. There are some cards and a photo in it.\nIs it yours? Please come to room 14 on the first floor and ask for Hamza. You can tell me what is in the wallet.",
 [["What did Hamza find?",["A phone","A black wallet","Some keys","A bag"],1,"A black wallet."],["Where did he find it?",["In a café","In the library","On a bus","In room 14"],1,"In the university library."],["What should the owner do?",["Call the police","Go to room 14","Send an email","Wait at the library"],1,"Please come to room 14."]],
 [["wallet","a small case for money and cards"],["found","past of find"],["yours","belonging to you"]]],
["a1r17","Sports at our university","Our university has a big sports centre. You can play football, basketball and volleyball there. There is also a gym and a swimming pool.\nThe centre is free for students. You only need your student card. Women have special times at the swimming pool on Monday and Thursday mornings.",
 [["How much does the sports centre cost for students?",["Nothing, it's free","500 DA","1,000 DA a month","It depends"],0,"The centre is free for students."],["What do students need?",["A passport","Their student card","A photo","Money"],1,"You only need your student card."],["When are the special times for women at the pool?",["Every evening","Monday and Thursday mornings","Weekends","Friday afternoon"],1,"On Monday and Thursday mornings."]],
 [["gym","a room with machines for exercise"],["swimming pool","a place to swim"],["special","only for some people or times"]]],
["a1r18","A text message","Hi Imane! Are you free tomorrow? Let's go to the new shopping centre. I want to buy a present for my mum. It's her birthday on Sunday. Meet me at the bus stop at 10? Reply soon! – Dounia",
 [["What does Dounia want to buy?",["A present for her mum","New clothes","A phone","Books"],0,"A present for my mum."],["When is the mother's birthday?",["Tomorrow","Saturday","Sunday","Today"],2,"It's her birthday on Sunday."],["Where do they meet?",["At the shopping centre","At the bus stop","At home","At school"],1,"Meet me at the bus stop."]],
 [["present","a gift"],["shopping centre","a big building with many shops"],["reply","answer"]]],
["a1r19","Tea time","In Algeria, mint tea is very popular. People drink it after meals and when guests visit. To make it, you need green tea, fresh mint, sugar and hot water.\nThe tea is poured from high above the glass to make foam on top. It is a sign of welcome and respect.",
 [["When do people drink mint tea?",["Only in the morning","After meals and with guests","Only in summer","Before sleeping"],1,"After meals and when guests visit."],["Which is NOT needed to make it?",["Mint","Sugar","Milk","Green tea"],2,"Green tea, mint, sugar and water. No milk."],["What does mint tea mean for guests?",["Goodbye","Welcome and respect","It is late","Hurry up"],1,"It is a sign of welcome and respect."]],
 [["popular","liked by many people"],["guests","people who visit your home"],["foam","small bubbles on top of a drink"]]],
["a1r20","My future plan","I am in my last year of high school. I want to study medicine because I want to help people. My father is a doctor and I want to be like him.\nI study every evening for three hours. I know medicine is difficult, but I am ready to work hard.",
 [["What does the writer want to study?",["Law","Medicine","Engineering","English"],1,"I want to study medicine."],["Why?",["To earn money","To help people","To travel","Because it's easy"],1,"Because I want to help people."],["How long does the writer study every evening?",["One hour","Two hours","Three hours","Five hours"],2,"I study every evening for three hours."]],
